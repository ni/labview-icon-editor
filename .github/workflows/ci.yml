  apply-deps:
    name: Apply VIPC (LV ${{ needs.version-gate.outputs.raw }} x64/x86, serialized)
    needs: [run-metadata, version-gate, changes]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup (LV x64)
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 64
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Audit VIPC apply (LV x64)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $runnerCliProject = Join-Path $env:REPO_ROOT 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          if (-not (Test-Path -Path $runnerCliProject -PathType Leaf)) {
            throw "runner-cli project not found at $runnerCliProject"
          }

          $runnerCliArgs = @(
            'vipc', 'assert',
            '--repo-root', $env:REPO_ROOT,
            '--supported-bitness', '64',
            '--vipc-path', '.github/actions/apply-vipc/runner_dependencies.vipc',
            '--output-path', "$env:REPO_ROOT\\builds\\status\\vipc-audit-64.json"
          )
          & dotnet run --project $runnerCliProject --configuration Release -- @runnerCliArgs
      - name: Report VIPC change status (LV x64)
        shell: pwsh
        run: |
          if ('${{ needs.changes.outputs.vipc }}' -eq 'true') {
            Write-Host ".vipc changes detected for this run."
          } else {
            Write-Host "No .vipc changes detected; audit-first policy still enforced."
          }
      - name: Apply VIPC (LV x64, informational)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $runnerCliProject = Join-Path $env:REPO_ROOT 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          if (-not (Test-Path -Path $runnerCliProject -PathType Leaf)) {
            throw "runner-cli project not found at $runnerCliProject"
          }

          $logPath = Join-Path $env:REPO_ROOT 'builds\status\vipc-apply-64.log'
          $logDir = Split-Path -Path $logPath -Parent
          if (-not (Test-Path -Path $logDir)) {
            New-Item -Path $logDir -ItemType Directory -Force | Out-Null
          }

          '' | Set-Content -Path $logPath -Encoding utf8
          $runnerCliArgs = @(
            'vipc', 'apply',
            '--repo-root', $env:REPO_ROOT,
            '--supported-bitness', '64',
            '--vipc-path', '.github/actions/apply-vipc/runner_dependencies.vipc'
          )
          $output = & dotnet run --project $runnerCliProject --configuration Release -- @runnerCliArgs *>&1
          $exitCode = $LASTEXITCODE

          if ($output) {
            $output |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $logPath -Append |
              ForEach-Object { Write-Host $_ }
          }

          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - name: Upload VIPC audit artifact (LV x64)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-audit-64
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-audit-64.json
          if-no-files-found: warn
      - name: Upload VIPC apply log artifact (LV x64)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-apply-log-64
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-apply-64.log
          if-no-files-found: warn
      - name: Job teardown (LV x64)
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          release_lock: 'false'
      - name: Job setup (LV x86)
        if: ${{ always() }}
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 32
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Audit VIPC apply (LV x86)
        if: ${{ always() }}
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $runnerCliProject = Join-Path $env:REPO_ROOT 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          if (-not (Test-Path -Path $runnerCliProject -PathType Leaf)) {
            throw "runner-cli project not found at $runnerCliProject"
          }

          $runnerCliArgs = @(
            'vipc', 'assert',
            '--repo-root', $env:REPO_ROOT,
            '--supported-bitness', '32',
            '--vipc-path', '.github/actions/apply-vipc/runner_dependencies.vipc',
            '--output-path', "$env:REPO_ROOT\\builds\\status\\vipc-audit-32.json"
          )
          & dotnet run --project $runnerCliProject --configuration Release -- @runnerCliArgs
      - name: Report VIPC change status (LV x86)
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ('${{ needs.changes.outputs.vipc }}' -eq 'true') {
            Write-Host ".vipc changes detected for this run."
          } else {
            Write-Host "No .vipc changes detected; audit-first policy still enforced."
          }
      - name: Apply VIPC (LV x86, informational)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $runnerCliProject = Join-Path $env:REPO_ROOT 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          if (-not (Test-Path -Path $runnerCliProject -PathType Leaf)) {
            throw "runner-cli project not found at $runnerCliProject"
          }

          $logPath = Join-Path $env:REPO_ROOT 'builds\status\vipc-apply-32.log'
          $logDir = Split-Path -Path $logPath -Parent
          if (-not (Test-Path -Path $logDir)) {
            New-Item -Path $logDir -ItemType Directory -Force | Out-Null
          }

          '' | Set-Content -Path $logPath -Encoding utf8
          $runnerCliArgs = @(
            'vipc', 'apply',
            '--repo-root', $env:REPO_ROOT,
            '--supported-bitness', '32',
            '--vipc-path', '.github/actions/apply-vipc/runner_dependencies.vipc'
          )
          $output = & dotnet run --project $runnerCliProject --configuration Release -- @runnerCliArgs *>&1
          $exitCode = $LASTEXITCODE

          if ($output) {
            $output |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $logPath -Append |
              ForEach-Object { Write-Host $_ }
          }

          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - name: Upload VIPC audit artifact (LV x86)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-audit-32
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-audit-32.json
          if-no-files-found: warn
      - name: Upload VIPC apply log artifact (LV x86)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-apply-log-32
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-apply-32.log
          if-no-files-found: warn
      - name: Job teardown (LV x86)
        if: always()
        uses: ./.github/actions/lvie-job-teardown

  vi-analyzer:
    name: VI Analyzer Linux container ${{ needs.container-contract.outputs.raw }}
    needs: [run-metadata, prerelease-context, version-gate, container-contract]
    runs-on: ubuntu-latest
    env:
      LVIE_VI_ANALYZER_TASKS_PATH: Tooling/vi-analyzer/tasks.linux.json
      LVIE_CONTAINER_CONTRACT_RAW: ${{ needs.container-contract.outputs.raw }}
      LVIE_CONTAINER_CONTRACT_TAG: ${{ needs.container-contract.outputs.tag }}
      LVIE_CONTAINER_CONTRACT_IMAGE: ${{ needs.container-contract.outputs.image }}
      LVIE_CONTAINER_CONTRACT_OS: ${{ needs.container-contract.outputs.os }}
      LVIE_CONTAINER_CONTRACT_YEAR: ${{ needs.container-contract.outputs.year }}
      LVIE_CONTAINER_CONTRACT_MINOR: ${{ needs.container-contract.outputs.minor }}
      LVIE_CONTAINER_CONTRACT_RELEASE_TAG: ${{ needs.container-contract.outputs.release_tag }}
      LVIE_CONTAINER_CONTRACT_LINUX_IMAGE: ${{ needs.container-contract.outputs.linux_image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate vi-analyzer container selection
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LVIE_CONTAINER_CONTRACT_OS}" != "linux" ]]; then
            echo "vi-analyzer on ubuntu-latest requires a linux container tag; .lvcontainer resolved to tag '${LVIE_CONTAINER_CONTRACT_TAG}' (os=${LVIE_CONTAINER_CONTRACT_OS}, image=${LVIE_CONTAINER_CONTRACT_IMAGE})." >&2
            exit 1
          fi
          if [[ -z "${LVIE_CONTAINER_CONTRACT_LINUX_IMAGE}" ]]; then
            echo "linux_image output is empty for linux tag '${LVIE_CONTAINER_CONTRACT_TAG}'." >&2
            exit 1
          fi

      - name: Pull LabVIEW Linux image
        shell: bash
        run: |
          set -euo pipefail
          image="${LVIE_CONTAINER_CONTRACT_LINUX_IMAGE}"
          echo "Using image: ${image}"
          docker pull "${image}"
          echo "LABVIEW_LINUX_IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Run VI Analyzer tasks (Linux container)
        shell: bash
        env:
          LVIE_VI_ANALYZER_LABVIEW_YEAR: ${{ needs.container-contract.outputs.year }}
        run: |
          set -euo pipefail
          script_path="${GITHUB_WORKSPACE}/Tooling/container-parity/run-vi-analyzer-linux.sh"
          tasks_path_rel="${LVIE_VI_ANALYZER_TASKS_PATH:-Tooling/vi-analyzer/tasks.linux.json}"
          tasks_path_host="${GITHUB_WORKSPACE}/${tasks_path_rel}"
          tasks_path_container="/workspace/${tasks_path_rel}"
          if [[ ! -f "$script_path" ]]; then
            echo "VI Analyzer Linux worker script not found: $script_path" >&2
            exit 1
          fi
          if [[ ! -f "$tasks_path_host" ]]; then
            echo "VI Analyzer Linux task registry not found: $tasks_path_host" >&2
            exit 1
          fi

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e LVIE_REPO_ROOT=/workspace \
            -e WORKSPACE_ROOT=/workspace \
            -e REPO_ROOT=/workspace \
            -e LVIE_VI_ANALYZER_LABVIEW_YEAR="${LVIE_VI_ANALYZER_LABVIEW_YEAR}" \
            -e LVIE_VI_ANALYZER_TASKS_PATH="${tasks_path_container}" \
            "${LABVIEW_LINUX_IMAGE}" \
            bash -lc "chmod +x /workspace/Tooling/container-parity/run-vi-analyzer-linux.sh && /workspace/Tooling/container-parity/run-vi-analyzer-linux.sh"

      - name: Normalize Linux container output ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          for path in \
            "${GITHUB_WORKSPACE}/builds" \
            "${GITHUB_WORKSPACE}/TestResults/container-parity/linux/vi-analyzer"; do
            if [[ -e "$path" ]]; then
              sudo chown -R "${uid}:${gid}" "$path"
            fi
          done

      - name: Write VI Analyzer status summary (Linux container)
        if: always()
        shell: pwsh
        run: |
          $repoRoot = $env:GITHUB_WORKSPACE
          $tasksRelativePath = if ([string]::IsNullOrWhiteSpace($env:LVIE_VI_ANALYZER_TASKS_PATH)) {
            'Tooling/vi-analyzer/tasks.linux.json'
          } else {
            $env:LVIE_VI_ANALYZER_TASKS_PATH
          }
          $tasksPath = Join-Path $repoRoot $tasksRelativePath
          $reportsRoot = Join-Path $repoRoot 'builds/vi-analyzer'
          $statusPath = Join-Path $repoRoot 'builds/status/vi-analyzer-summary.json'
          New-Item -ItemType Directory -Path (Split-Path -Path $statusPath -Parent) -Force | Out-Null

          $taskResults = @()
          if (Test-Path -Path $tasksPath -PathType Leaf) {
            $tasksDoc = Get-Content -Raw -Path $tasksPath | ConvertFrom-Json
            foreach ($task in @($tasksDoc.tasks)) {
              $taskId = [string]$task.id
              if ([string]::IsNullOrWhiteSpace($taskId)) {
                continue
              }

              $safeTaskId = $taskId -replace '[^A-Za-z0-9_.-]', '-'
              $reportPath = Join-Path $reportsRoot ("vi-analyzer-{0}.txt" -f $safeTaskId)
              $taskResults += [pscustomobject]@{
                id          = $taskId
                config_path = [string]$task.config_path
                report_path = $reportPath
                succeeded   = (Test-Path -Path $reportPath -PathType Leaf)
              }
            }
          }

          $failedTasks = @($taskResults | Where-Object { -not $_.succeeded })
          $status = [ordered]@{
            generated_utc   = (Get-Date).ToUniversalTime().ToString('o')
            repo_root       = $repoRoot
            tasks_path      = $tasksPath
            tasks_path_relative = $tasksRelativePath
            reports_root    = $reportsRoot
            overall_success = ($taskResults.Count -gt 0 -and $failedTasks.Count -eq 0)
            task_count      = $taskResults.Count
            labview         = [ordered]@{
              source_contract = [ordered]@{
                raw            = '${{ needs.version-gate.outputs.raw }}'
                year           = '${{ needs.version-gate.outputs.year }}'
                minor_revision = '${{ needs.version-gate.outputs.minor }}'
              }
              container_contract = [ordered]@{
                raw            = $env:LVIE_CONTAINER_CONTRACT_RAW
                tag            = $env:LVIE_CONTAINER_CONTRACT_TAG
                image          = $env:LVIE_CONTAINER_CONTRACT_IMAGE
                os             = $env:LVIE_CONTAINER_CONTRACT_OS
                year           = $env:LVIE_CONTAINER_CONTRACT_YEAR
                minor_revision = $env:LVIE_CONTAINER_CONTRACT_MINOR
                release_tag    = $env:LVIE_CONTAINER_CONTRACT_RELEASE_TAG
                linux_image    = $env:LVIE_CONTAINER_CONTRACT_LINUX_IMAGE
              }
              runtime = [ordered]@{
                year = $env:LVIE_CONTAINER_CONTRACT_YEAR
              }
              bitness        = 64
              execution_mode = 'linux-container'
            }
            task_results    = $taskResults
          }

          $status | ConvertTo-Json -Depth 8 | Out-File -FilePath $statusPath -Encoding utf8

      - name: Upload VI Analyzer logs (Linux container)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vi-analyzer-linux-logs
          path: ${{ github.workspace }}/TestResults/container-parity/linux/vi-analyzer/logs
          if-no-files-found: warn

      - name: Upload VI Analyzer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vi-analyzer-reports
          path: ${{ github.workspace }}/builds/vi-analyzer
          if-no-files-found: warn
      - name: Upload VI Analyzer status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vi-analyzer-status
          path: ${{ github.workspace }}/builds/status/vi-analyzer-summary.json
          if-no-files-found: error

  version:
    name: Compute Version
    needs: [run-metadata, version-gate, prerelease-context]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    outputs:
      VERSION:       ${{ steps.compute.outputs.VERSION }}
      MAJOR:         ${{ steps.compute.outputs.MAJOR }}
      MINOR:         ${{ steps.compute.outputs.MINOR }}
      PATCH:         ${{ steps.compute.outputs.PATCH }}
      BUILD:         ${{ steps.compute.outputs.BUILD }}
      IS_PRERELEASE: ${{ steps.compute.outputs.IS_PRERELEASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          create_worktree: 'false'
      - name: Fail on conflicting merged PR release labels
        if: ${{ needs.prerelease-context.outputs.bump_conflict == 'true' }}
        shell: pwsh
        run: |
          $labels = '${{ needs.prerelease-context.outputs.bump_conflict_labels }}'
          $prNumber = '${{ needs.prerelease-context.outputs.merged_pr_number }}'
          if ([string]::IsNullOrWhiteSpace($prNumber)) {
            throw ("Conflicting merged PR release labels detected: {0}" -f $labels)
          }
          throw ("Conflicting merged PR release labels detected on merged PR #{0}: {1}" -f $prNumber, $labels)
      - id: compute
        uses: ./.github/actions/compute-version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bump_type_override: ${{ needs.prerelease-context.outputs.bump_type_override }}
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          cleanup_worktree: 'false'

  # Stage 3: Self-hosted LabVIEW validation/build chain (profile-gated).
  unit-tests:
    name: Test Source Using LV ${{ matrix.bitness }}-bit
    if: ${{ needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
    needs: [run-metadata, prerelease-context, version-gate, apply-deps]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
      LVIE_SOURCE_TEST_STRICT: ${{ vars.LVIE_SOURCE_TEST_STRICT || '0' }}
      LVIE_LUNIT_VERBOSE_GCLI: ${{ vars.LVIE_LUNIT_VERBOSE_GCLI || '1' }}
      LVIE_SOURCE_TEST_MODE_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_test_mode || 'inherit' }}
      LVIE_SOURCE_TEST_LABVIEW_YEAR_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_test_labview_year_override || '' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        bitness: ${{ fromJson('["64","32"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: ${{ matrix.bitness }}
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Test Source Using LV ${{ matrix.bitness }}-bit
        id: source_test
        shell: pwsh
        env:
          LVIE_MATRIX_BITNESS: ${{ matrix.bitness }}
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $runnerCliProject = Join-Path $env:REPO_ROOT 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          if (-not (Test-Path -Path $runnerCliProject -PathType Leaf)) {
            throw "runner-cli project not found at $runnerCliProject"
          }

          $isWorkflowDispatch = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch'
          $unitTestYearFromLvversion = $env:LABVIEW_VERSION_YEAR
          $unitTestYearSourceContract = $unitTestYearFromLvversion
          $unitTestYear = $unitTestYearFromLvversion
          $unitTestLvversionRaw = if ([string]::IsNullOrWhiteSpace($env:LABVIEW_VERSION)) { $env:LVIE_REQUIRED_LABVIEW_VERSION } else { $env:LABVIEW_VERSION }
          $unitTestLvversion = $unitTestLvversionRaw
          $unitTestYearOverrideRaw = if ([string]::IsNullOrWhiteSpace($env:LVIE_SOURCE_TEST_LABVIEW_YEAR_OVERRIDE)) { '' } else { $env:LVIE_SOURCE_TEST_LABVIEW_YEAR_OVERRIDE.Trim() }
          $unitTestYearSource = '.lvversion'
          $yearCompatMappingApplied = $false
          if ([string]::Equals($unitTestYearFromLvversion, '2020', [System.StringComparison]::OrdinalIgnoreCase)) {
            $unitTestYear = '2026'
            $unitTestYearSource = 'lv2020_compat_mapping'
            $yearCompatMappingApplied = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($unitTestYearOverrideRaw)) {
            if (-not $isWorkflowDispatch) {
              throw "source_test_labview_year_override is workflow_dispatch only."
            }
            if ($unitTestYearOverrideRaw -notmatch '^\d{4}$') {
              throw ("Invalid source_test_labview_year_override '{0}'. Expected a four-digit year (for example 2026)." -f $unitTestYearOverrideRaw)
            }
            $unitTestYear = $unitTestYearOverrideRaw
            $unitTestYearSource = 'workflow_dispatch input source_test_labview_year_override'
            $yearCompatMappingApplied = $false
          }
          $sourceTestModeInputRaw = if ([string]::IsNullOrWhiteSpace($env:LVIE_SOURCE_TEST_MODE_INPUT)) { 'inherit' } else { $env:LVIE_SOURCE_TEST_MODE_INPUT.Trim().ToLowerInvariant() }
          if ($sourceTestModeInputRaw -notin @('inherit', 'strict', 'canary')) {
            throw ("Invalid source_test_mode '{0}'. Expected inherit, strict, or canary." -f $sourceTestModeInputRaw)
          }
          if (-not $isWorkflowDispatch -and $sourceTestModeInputRaw -ne 'inherit') {
            throw "source_test_mode override is workflow_dispatch only."
          }
          $strictModeRawFromVariable = if ([string]::IsNullOrWhiteSpace($env:LVIE_SOURCE_TEST_STRICT)) { '0' } else { $env:LVIE_SOURCE_TEST_STRICT.Trim() }
          $strictModeSource = '$env:LVIE_SOURCE_TEST_STRICT'
          $strictModeRaw = $strictModeRawFromVariable
          switch ($sourceTestModeInputRaw) {
            'strict' {
              $strictModeRaw = '1'
              $strictModeSource = 'workflow_dispatch input source_test_mode=strict'
            }
            'canary' {
              $strictModeRaw = '0'
              $strictModeSource = 'workflow_dispatch input source_test_mode=canary'
            }
            default {
              $strictModeRaw = $strictModeRawFromVariable
              $strictModeSource = '$env:LVIE_SOURCE_TEST_STRICT'
            }
          }
          $strictMode = $strictModeRaw.ToLowerInvariant() -notin @('0', 'false', 'no')
          $sourceTestMode = if ($strictMode) { 'strict' } else { 'canary' }
          $yearOverrideApplied = -not [string]::IsNullOrWhiteSpace($unitTestYearOverrideRaw)
          $requestedBitness = if ([string]::IsNullOrWhiteSpace($env:LVIE_MATRIX_BITNESS)) {
            throw "LVIE_MATRIX_BITNESS is required for source-test execution."
          } else {
            $env:LVIE_MATRIX_BITNESS
          }
          Write-Host ("Unit-test LabVIEW target year: {0}" -f $unitTestYear)
          Write-Host ("Unit-test LabVIEW target .lvversion: {0}" -f $unitTestLvversion)
          Write-Host ("Unit-test LabVIEW .lvversion source contract: {0}" -f $unitTestLvversionRaw)
          Write-Host ("Unit-test LabVIEW source-contract year: {0}" -f $unitTestYearSourceContract)
          Write-Host ("Unit-test LabVIEW execution year: {0}" -f $unitTestYear)
          Write-Host ("Unit-test LabVIEW year source: {0}" -f $unitTestYearSource)
          Write-Host ("Unit-test LabVIEW year compat mapping applied: {0}" -f $yearCompatMappingApplied)
          Write-Host ("Unit-test LabVIEW year override applied: {0}" -f $yearOverrideApplied)
          if ($yearCompatMappingApplied) {
            Write-Host "Unit-test LabVIEW year compatibility mapping: source year 2020 -> execution year 2026"
          }
          Write-Host ("Unit-test LabVIEW target bitness: {0}" -f $requestedBitness)
          Write-Host ("Source .lvversion year from job setup: {0}" -f $env:LABVIEW_VERSION_YEAR)
          Write-Host ("Source test mode input: {0}" -f $sourceTestModeInputRaw)
          Write-Host ("Source test mode effective: {0}" -f $sourceTestMode)
          Write-Host ("Source test strict source: {0}" -f $strictModeSource)
          Write-Host ("Source test strict raw value: {0}" -f $strictModeRaw)

          function Resolve-LabVIEWInstallRootForEvidence {
            param(
              [Parameter(Mandatory = $true)][string]$Year,
              [Parameter(Mandatory = $true)][ValidateSet('32','64')][string]$Bitness
            )

            $defaultPath = if ($Bitness -eq '32') {
              "C:\Program Files (x86)\National Instruments\LabVIEW $Year"
            } else {
              "C:\Program Files\National Instruments\LabVIEW $Year"
            }
            if (Test-Path -Path $defaultPath) {
              return $defaultPath
            }

            $registryPath = if ($Bitness -eq '32') {
              "HKLM:\SOFTWARE\WOW6432Node\National Instruments\LabVIEW $Year"
            } else {
              "HKLM:\SOFTWARE\National Instruments\LabVIEW $Year"
            }
            try {
              $props = Get-ItemProperty -Path $registryPath -ErrorAction Stop
              foreach ($name in @('Path', 'InstallDir', 'InstallPath')) {
                $candidate = $props.$name
                if (-not [string]::IsNullOrWhiteSpace($candidate) -and (Test-Path -Path $candidate)) {
                  return $candidate
                }
              }
            } catch {
              return $null
            }

            return $null
          }

          function Invoke-DotnetBuildServerShutdown {
            param([Parameter(Mandatory = $true)][string]$Phase)

            try {
              $shutdownOutput = & dotnet build-server shutdown 2>&1
              $shutdownExitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
              foreach ($line in @($shutdownOutput | ForEach-Object { $_.ToString() })) {
                Write-Host ("dotnet build-server shutdown ({0}): {1}" -f $Phase, $line)
              }
              Write-Host ("dotnet build-server shutdown ({0}) exit code: {1}" -f $Phase, $shutdownExitCode)
              return $shutdownExitCode
            } catch {
              Write-Warning ("dotnet build-server shutdown ({0}) failed: {1}" -f $Phase, $_.Exception.Message)
              return 1
            }
          }

          function Save-LabVIEWTempLogs {
            param(
              [Parameter(Mandatory = $true)][DateTime]$SinceUtc,
              [Parameter(Mandatory = $true)][string]$DestinationDir
            )

            $copiedFiles = [System.Collections.Generic.List[string]]::new()
            $tempRoot = [System.IO.Path]::GetTempPath()
            if ([string]::IsNullOrWhiteSpace($tempRoot) -or -not (Test-Path -Path $tempRoot)) {
              Write-Warning ("Temp root unavailable for LabVIEW diagnostics: {0}" -f $tempRoot)
              return $copiedFiles.ToArray()
            }

            $candidates = @(Get-ChildItem -Path $tempRoot -Filter 'lvtemporary_*.log' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -ge $SinceUtc.AddMinutes(-2) } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 20)

            if ($candidates.Count -eq 0) {
              Write-Host ("No run-correlated lvtemporary logs found under {0} after {1:o}" -f $tempRoot, $SinceUtc)
              return $copiedFiles.ToArray()
            }

            if (-not (Test-Path -Path $DestinationDir)) {
              New-Item -Path $DestinationDir -ItemType Directory -Force | Out-Null
            }

            $index = 0
            foreach ($candidate in $candidates) {
              $destinationName = "{0:D2}-{1}" -f $index, $candidate.Name
              $destinationPath = Join-Path $DestinationDir $destinationName
              Copy-Item -Path $candidate.FullName -Destination $destinationPath -Force
              $copiedFiles.Add($destinationPath) | Out-Null
              $index++
            }

            Write-Host ("Saved {0} LabVIEW temp logs to {1}" -f $copiedFiles.Count, $DestinationDir)
            return $copiedFiles.ToArray()
          }

          $installRoot64 = Resolve-LabVIEWInstallRootForEvidence -Year $unitTestYear -Bitness '64'
          $installRoot32 = Resolve-LabVIEWInstallRootForEvidence -Year $unitTestYear -Bitness '32'
          $installDetected64 = -not [string]::IsNullOrWhiteSpace($installRoot64)
          $installDetected32 = -not [string]::IsNullOrWhiteSpace($installRoot32)
          $requestedInstallRoot = if ($requestedBitness -eq '32') { $installRoot32 } else { $installRoot64 }
          $requestedInstallDetected = -not [string]::IsNullOrWhiteSpace($requestedInstallRoot)
          Write-Host ("LabVIEW install evidence for year {0}: 64-bit={1}; 32-bit={2}" -f $unitTestYear, ($installRoot64 ?? '<missing>'), ($installRoot32 ?? '<missing>'))
          Write-Host ("Source test mode: {0} (effective strict raw={1}; source={2})" -f $sourceTestMode, $strictModeRaw, $strictModeSource)
          $verboseGcliRaw = if ([string]::IsNullOrWhiteSpace($env:LVIE_LUNIT_VERBOSE_GCLI)) { '1' } else { $env:LVIE_LUNIT_VERBOSE_GCLI.Trim() }
          $verboseGcli = $verboseGcliRaw.ToLowerInvariant() -notin @('0', 'false', 'no')
          Write-Host ("LUnit verbose g-cli mode: {0} (LVIE_LUNIT_VERBOSE_GCLI={1})" -f $verboseGcli, $verboseGcliRaw)

          $reportOs = if ([string]::IsNullOrWhiteSpace($env:RUNNER_OS)) { 'Unknown' } else { $env:RUNNER_OS }
          $reportPath = Join-Path $env:REPO_ROOT (".github/actions/run-unit-tests/UnitTestReport-{0}-{1}.xml" -f $reportOs, $requestedBitness)
          $legacyReportPath = Join-Path $env:REPO_ROOT '.github/actions/run-unit-tests/UnitTestReport.xml'
          if (Test-Path -Path $reportPath) {
            Remove-Item -Path $reportPath -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -Path $legacyReportPath) {
            Remove-Item -Path $legacyReportPath -Force -ErrorAction SilentlyContinue
          }
          $lunitLogPath = Join-Path $env:REPO_ROOT ("builds\\status\\lunit-run-{0}-{1}.log" -f $reportOs, $requestedBitness)
          $lunitLogDir = Split-Path -Path $lunitLogPath -Parent
          if (-not (Test-Path -Path $lunitLogDir)) {
            New-Item -Path $lunitLogDir -ItemType Directory -Force | Out-Null
          }
          '' | Set-Content -Path $lunitLogPath -Encoding utf8
          $labviewTempLogDir = Join-Path $env:REPO_ROOT ("builds\\status\\labview-temp-logs-{0}-{1}" -f $reportOs, $requestedBitness)
          if (Test-Path -Path $labviewTempLogDir) {
            Remove-Item -Path $labviewTempLogDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          $closeScriptPath = Join-Path $env:REPO_ROOT '.github/actions/close-labview/Close_LabVIEW.ps1'
          $preCloseExitCode = $null
          if (Test-Path -Path $closeScriptPath -PathType Leaf) {
            try {
              $closeOutput = & pwsh -NoProfile -File $closeScriptPath -LabVIEWVersion $unitTestYear -SupportedBitness $requestedBitness -TimeoutSeconds 120 2>&1
              $preCloseExitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
              foreach ($line in @($closeOutput | ForEach-Object { $_.ToString() })) {
                Write-Host $line
              }
              if ($preCloseExitCode -ne 0) {
                Write-Warning ("Pre-run LabVIEW close returned nonzero exit code: {0}" -f $preCloseExitCode)
              }
            } catch {
              $preCloseExitCode = 1
              Write-Warning ("Pre-run LabVIEW close failed: {0}" -f $_.Exception.Message)
            }
          } else {
            Write-Warning ("Close_LabVIEW script not found at {0}" -f $closeScriptPath)
          }

          $buildServerShutdownBeforeExitCode = Invoke-DotnetBuildServerShutdown -Phase 'pre-lunit'

          $runnerCliArgs = @(
            'lunit', 'run',
            '--repo-root', $env:REPO_ROOT,
            '--year', $unitTestYear,
            '--labview-version', $unitTestLvversion,
            '--bitness', $requestedBitness,
            '--project-path', $env:PROJECT_PATH,
            '--report-path', $reportPath
          )
          if ($verboseGcli) {
            $runnerCliArgs += '--verbose-gcli'
          }
          $lunitStartUtc = (Get-Date).ToUniversalTime()
          $output = & dotnet run --project $runnerCliProject --configuration Release -- @runnerCliArgs *>&1
          $runnerCliExitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
          $buildServerShutdownAfterExitCode = Invoke-DotnetBuildServerShutdown -Phase 'post-lunit'
          if ($output) {
            $output |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $lunitLogPath -Append |
              ForEach-Object { Write-Host $_ }
          }
          $gcliExitCode = $null
          $parserExitCode = $null
          $reportPathUsed = $reportPath
          $reportParseSource = 'canonical'
          $reportFallbackUsed = $false
          $classFallbackRecovered = $false
          foreach ($line in @($output | ForEach-Object { $_.ToString() })) {
            if ($line -match 'g-cli lunit exit code:\s*(-?\d+)') {
              $gcliExitCode = [int]$Matches[1]
            } elseif ($line -match 'RunUnitTests parser exit code:\s*(-?\d+)') {
              $parserExitCode = [int]$Matches[1]
            } elseif ($line -match 'Unit test report parse source:\s*(canonical|legacy)\s*$') {
              $reportParseSource = $Matches[1].ToLowerInvariant()
              $reportFallbackUsed = $reportParseSource -eq 'legacy'
            } elseif ($line -match 'Unit test report parse path:\s*(.+)$') {
              $reportPathUsed = $Matches[1].Trim()
            } elseif ($line -match '^LUnit class fallback succeeded with \d+ testcase\(s\) merged into:\s*.+$') {
              $classFallbackRecovered = $true
            }
          }
          if ([string]::IsNullOrWhiteSpace($reportPathUsed)) {
            $reportPathUsed = $reportPath
          }
          Write-Host ("Unit test report parse source resolved by workflow: {0}" -f $reportParseSource)
          Write-Host ("Unit test report path resolved by workflow: {0}" -f $reportPathUsed)
          $labviewTempLogs = @()
          if ($null -ne $gcliExitCode -and $gcliExitCode -ne 0) {
            $labviewTempLogs = Save-LabVIEWTempLogs -SinceUtc $lunitStartUtc -DestinationDir $labviewTempLogDir
          }

          $reportPathCanonical = $reportPath
          $reportExistsCanonical = Test-Path -Path $reportPathCanonical
          $reportExists = Test-Path -Path $reportPathUsed
          if (-not $reportExists -and (Test-Path -Path $legacyReportPath)) {
            Write-Warning ("Canonical unit test report missing at {0}; using legacy alias for workflow parsing: {1}" -f $reportPathUsed, $legacyReportPath)
            $reportPathUsed = $legacyReportPath
            $reportParseSource = 'legacy'
            $reportFallbackUsed = $true
            $reportExists = $true
            if (-not $reportExistsCanonical) {
              try {
                Copy-Item -Path $legacyReportPath -Destination $reportPathCanonical -Force
                $reportExistsCanonical = Test-Path -Path $reportPathCanonical
                if ($reportExistsCanonical) {
                  Write-Host ("Canonical report rehydrated from legacy alias: {0}" -f $reportPathCanonical)
                }
              } catch {
                Write-Warning ("Failed to rehydrate canonical report from legacy alias at {0}: {1}" -f $reportPathCanonical, $_.Exception.Message)
              }
            }
          }
          $legacyReportWritten = $false
          if ($reportExists) {
            $reportUsedIsLegacy = [string]::Equals(
              [System.IO.Path]::GetFullPath($reportPathUsed),
              [System.IO.Path]::GetFullPath($legacyReportPath),
              [System.StringComparison]::OrdinalIgnoreCase
            )
            if ($reportUsedIsLegacy) {
              $legacyReportWritten = $true
              Write-Host ("Legacy UnitTestReport compatibility copy already present: {0}" -f $legacyReportPath)
            } else {
              try {
                Copy-Item -Path $reportPathUsed -Destination $legacyReportPath -Force
                $legacyReportWritten = $true
                Write-Host ("Legacy UnitTestReport compatibility copy written: {0}" -f $legacyReportPath)
              } catch {
                Write-Warning ("Failed to write legacy UnitTestReport compatibility copy at {0}: {1}" -f $legacyReportPath, $_.Exception.Message)
              }
            }
          }
          $testcaseCount = 0
          $reportParseError = $null
          if ($reportExists) {
            try {
              [xml]$reportXml = Get-Content -Path $reportPathUsed -Raw -ErrorAction Stop
              $testCases = $reportXml.SelectNodes('//testcase')
              if ($null -ne $testCases) {
                $testcaseCount = $testCases.Count
              }
            } catch {
              $reportParseError = $_.Exception.Message
            }
          }

          $failureReasons = New-Object System.Collections.Generic.List[string]
          $failureClassifications = New-Object System.Collections.Generic.List[string]
          if (-not $requestedInstallDetected) {
            $failureReasons.Add(("LabVIEW {0} install not detected for requested {1}-bit lane on this runner." -f $unitTestYear, $requestedBitness)) | Out-Null
            $failureClassifications.Add('install_missing_requested_bitness') | Out-Null
          }
          if ($runnerCliExitCode -ne 0) {
            $failureReasons.Add(("runner-cli lunit run exited with code {0}" -f $runnerCliExitCode)) | Out-Null
            $failureClassifications.Add('runner_cli_nonzero') | Out-Null
          }
          if ($null -ne $gcliExitCode -and $gcliExitCode -ne 0) {
            $failureClassifications.Add('gcli_nonzero') | Out-Null
            if ($classFallbackRecovered) {
              $failureClassifications.Add('gcli_nonzero_recovered_by_class_fallback') | Out-Null
              Write-Host ("g-cli primary run was nonzero ({0}) but class fallback recovered testcase evidence." -f $gcliExitCode)
            } else {
              $failureReasons.Add(("g-cli lunit run exited with code {0}" -f $gcliExitCode)) | Out-Null
            }
          }
          if ($null -ne $parserExitCode -and $parserExitCode -ne 0) {
            $failureClassifications.Add('parser_nonzero') | Out-Null
          }
          if (-not $reportExists) {
            $failureReasons.Add("Unit test report missing at $reportPathUsed") | Out-Null
            $failureClassifications.Add('report_missing') | Out-Null
          } elseif (-not [string]::IsNullOrWhiteSpace($reportParseError)) {
            $failureReasons.Add(("Unit test report parse error: {0}" -f $reportParseError)) | Out-Null
            $failureClassifications.Add('report_parse_error') | Out-Null
          } elseif ($testcaseCount -le 0) {
            $failureReasons.Add(("Unit test report has no <testcase> entries: {0}" -f $reportPathUsed)) | Out-Null
            $failureClassifications.Add('empty_testcase_report') | Out-Null
          }
          if (($null -ne $gcliExitCode -and $gcliExitCode -ne 0) -and $reportExists -and $testcaseCount -le 0) {
            $failureClassifications.Add('gcli_nonzero_empty_report') | Out-Null
          }
          if ($null -ne $preCloseExitCode -and $preCloseExitCode -ne 0) {
            $failureClassifications.Add('pre_close_nonzero') | Out-Null
          }
          if ($buildServerShutdownBeforeExitCode -ne 0) {
            $failureClassifications.Add('dotnet_build_server_shutdown_pre_nonzero') | Out-Null
          }
          if ($buildServerShutdownAfterExitCode -ne 0) {
            $failureClassifications.Add('dotnet_build_server_shutdown_post_nonzero') | Out-Null
          }

          $verdict = if ($failureReasons.Count -eq 0) { 'pass' } else { 'fail' }
          $evidencePath = Join-Path $env:REPO_ROOT ("builds\\status\\source-test-evidence-{0}-{1}.json" -f $reportOs, $requestedBitness)
          $evidence = [ordered]@{
            timestamp_utc = (Get-Date).ToUniversalTime().ToString('o')
            lvversion_raw = $unitTestLvversion
            lvversion_source_contract = $unitTestLvversionRaw
            year = $unitTestYear
            year_source_contract = $unitTestYearSourceContract
            year_source = $unitTestYearSource
            year_override_requested = $unitTestYearOverrideRaw
            year_override_applied = $yearOverrideApplied
            year_compat_mapping_applied = $yearCompatMappingApplied
            bitness = $requestedBitness
            install_detected_64 = $installDetected64
            install_detected_32 = $installDetected32
            install_detected_requested_bitness = $requestedInstallDetected
            install_path_64 = if ($installDetected64) { $installRoot64 } else { $null }
            install_path_32 = if ($installDetected32) { $installRoot32 } else { $null }
            report_path = $reportPathUsed
            report_path_canonical = $reportPathCanonical
            report_path_used = $reportPathUsed
            report_fallback_used = $reportFallbackUsed
            report_parse_source = $reportParseSource
            report_exists_canonical = $reportExistsCanonical
            legacy_report_path = $legacyReportPath
            legacy_report_written = $legacyReportWritten
            report_exists = $reportExists
            testcase_count = $testcaseCount
            runner_cli_exit_code = $runnerCliExitCode
            gcli_exit_code = $gcliExitCode
            parser_exit_code = $parserExitCode
            class_fallback_recovered = $classFallbackRecovered
            verbose_gcli_enabled = $verboseGcli
            lunit_log_path = $lunitLogPath
            pre_close_exit_code = $preCloseExitCode
            dotnet_build_server_shutdown_pre_exit_code = $buildServerShutdownBeforeExitCode
            dotnet_build_server_shutdown_post_exit_code = $buildServerShutdownAfterExitCode
            labview_temp_log_dir = $labviewTempLogDir
            labview_temp_logs_collected_count = @($labviewTempLogs).Count
            labview_temp_logs = @($labviewTempLogs)
            failure_classifications = @($failureClassifications)
            strict_mode = $strictMode
            strict_mode_raw = $strictModeRaw
            strict_mode_source = $strictModeSource
            source_test_mode_input = $sourceTestModeInputRaw
            mode = $sourceTestMode
            verdict = $verdict
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Path $evidencePath -Encoding utf8
          Write-Host ("Source test evidence written: {0}" -f $evidencePath)

          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Source Test Evidence (LV {0}-bit): mode={1}; verdict={2}; testcase_count={3}; runner_cli={4}; gcli={5}; parser={6}; install_detected_requested_bitness={7}; target_year={8}; source_year={9}; lv2020_compat_mapping={10}" -f $requestedBitness, $sourceTestMode, $verdict, $testcaseCount, $runnerCliExitCode, $gcliExitCode, $parserExitCode, $requestedInstallDetected, $unitTestYear, $unitTestYearSourceContract, $yearCompatMappingApplied)
          }
          if ($env:GITHUB_OUTPUT) {
            "source_test_verdict=$verdict" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "report_fallback_used=$([string]$reportFallbackUsed).ToLowerInvariant()" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_test_mode_effective=$sourceTestMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_test_mode_input=$sourceTestModeInputRaw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_test_year=$unitTestYear" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_test_year_source_contract=$unitTestYearSourceContract" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_test_year_override_applied=$([string]$yearOverrideApplied).ToLowerInvariant()" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "source_test_year_compat_mapping_applied=$([string]$yearCompatMappingApplied).ToLowerInvariant()" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          if ($failureReasons.Count -gt 0) {
            foreach ($reason in $failureReasons) {
              Write-Warning $reason
            }
            if ($strictMode) {
              $runnerCliExitCode = 1
            } else {
              Write-Warning ("Source-test canary mode active; keeping lane green with evidence verdict '{0}'." -f $verdict)
              $runnerCliExitCode = 0
            }
          }
          Write-Host ("runner-cli lunit run exit code: {0}" -f $runnerCliExitCode)
          exit $runnerCliExitCode
      - name: Summarize unit-test executor
        if: always()
        shell: pwsh
        run: |
          $summaryLine = "- Unit Tests (LV {0}-bit): runner={1}; mode={2}; LUnit executor=runner-cli (g-cli backend); target_year={3}; source_year={4}; lv2020_compat_mapping={5}" -f '${{ matrix.bitness }}', '${{ runner.name }}', '${{ steps.source_test.outputs.source_test_mode_effective }}', '${{ steps.source_test.outputs.source_test_year }}', '${{ steps.source_test.outputs.source_test_year_source_contract }}', '${{ steps.source_test.outputs.source_test_year_compat_mapping_applied }}'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryLine
      - name: Upload unit test report (LV ${{ matrix.bitness }}-bit)
        if: ${{ failure() || steps.source_test.outputs.source_test_verdict == 'fail' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ runner.os }}-${{ matrix.bitness }}-bit-report
          path: ${{ env.REPO_ROOT }}/.github/actions/run-unit-tests/UnitTestReport-${{ runner.os }}-${{ matrix.bitness }}.xml
          if-no-files-found: warn
      - name: Upload unit test report legacy alias (LV ${{ matrix.bitness }}-bit)
        if: ${{ failure() || steps.source_test.outputs.source_test_verdict == 'fail' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ runner.os }}-${{ matrix.bitness }}-bit-report-legacy
          path: ${{ env.REPO_ROOT }}/.github/actions/run-unit-tests/UnitTestReport.xml
          if-no-files-found: warn
      - name: Upload lunit run log (LV ${{ matrix.bitness }}-bit)
        if: ${{ failure() || steps.source_test.outputs.source_test_verdict == 'fail' }}
        uses: actions/upload-artifact@v4
        with:
          name: lunit-run-${{ runner.os }}-${{ matrix.bitness }}-bit-log
          path: ${{ env.REPO_ROOT }}/builds/status/lunit-run-${{ runner.os }}-${{ matrix.bitness }}.log
          if-no-files-found: warn
      - name: Upload LabVIEW temp logs (LV ${{ matrix.bitness }}-bit)
        if: ${{ failure() || steps.source_test.outputs.source_test_verdict == 'fail' }}
        uses: actions/upload-artifact@v4
        with:
          name: labview-temp-logs-${{ runner.os }}-${{ matrix.bitness }}-bit
          path: ${{ env.REPO_ROOT }}/builds/status/labview-temp-logs-${{ runner.os }}-${{ matrix.bitness }}
          if-no-files-found: warn
      - name: Upload source-test evidence (LV ${{ matrix.bitness }}-bit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-evidence-${{ runner.os }}-${{ matrix.bitness }}-bit
          path: ${{ env.REPO_ROOT }}/builds/status/source-test-evidence-${{ runner.os }}-${{ matrix.bitness }}.json
          if-no-files-found: warn
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          revert_bitness: ${{ matrix.bitness }}
          close_labview: 'true'
          close_bitness: ${{ matrix.bitness }}

  build-ppl-x86:
    name: Build 32-bit Packed Library
    if: ${{ needs.prerelease-context.outputs.ci_profile != 'release-priority' && needs.version-gate.outputs.year != '2020' }}
    needs: [run-metadata, prerelease-context, version-gate, build-ppl-x64, version]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 32
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Build PPL (LV 32-bit)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $runnerCliProject = Join-Path $env:REPO_ROOT 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          if (-not (Test-Path -Path $runnerCliProject -PathType Leaf)) {
            throw "runner-cli project not found at $runnerCliProject"
          }

          $runnerCliArgs = @(
            'ppl', 'build',
            '--repo-root', $env:REPO_ROOT,
            '--labview-version', $env:LABVIEW_VERSION_RAW,
            '--supported-bitness', '32',
            '--major', '${{ needs.version.outputs.MAJOR }}',
            '--minor', '${{ needs.version.outputs.MINOR }}',
            '--patch', '${{ needs.version.outputs.PATCH }}',
            '--build', '${{ needs.version.outputs.BUILD }}',
            '--commit', '${{ github.sha }}'
          )
          & dotnet run --project $runnerCliProject --configuration Release -- @runnerCliArgs
          $runnerCliExitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
          Write-Host ("runner-cli ppl build exit code: {0}" -f $runnerCliExitCode)
          exit $runnerCliExitCode
      - name: Rename PPL (LV 32-bit)
        shell: pwsh
        run: |
          & "$env:REPO_ROOT\\.github\\actions\\rename-file\\Rename-file.ps1" `
            -CurrentFilename "$env:REPO_ROOT\\resource\\plugins\\lv_icon.lvlibp" `
            -NewFilename "$env:REPO_ROOT\\resource\\plugins\\lv_icon_x86.lvlibp"
      - name: Write packed library report (32-bit)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDir = Join-Path $env:REPO_ROOT 'builds\status'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null

          $artifactPath = Join-Path $env:REPO_ROOT 'resource\plugins\lv_icon_x86.lvlibp'
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
            throw "Expected packed library output was not found: $artifactPath"
          }
          $artifact = Get-Item -LiteralPath $artifactPath

          $reportPath = Join-Path $reportDir ("lv_icon.lvlibp-{0}-32.xml" -f $env:RUNNER_OS)
          $xml = New-Object System.Xml.XmlDocument
          $declaration = $xml.CreateXmlDeclaration('1.0', 'utf-8', $null)
          $null = $xml.AppendChild($declaration)

          $root = $xml.CreateElement('ppl_build_report')
          $root.SetAttribute('schema_version', '1.0')
          $null = $xml.AppendChild($root)

          function Add-ReportField {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$Value
            )
            $node = $xml.CreateElement($Name)
            $node.InnerText = $Value
            $null = $root.AppendChild($node)
          }

          Add-ReportField -Name 'artifact_name' -Value $artifact.Name
          Add-ReportField -Name 'artifact_path' -Value $artifact.FullName
          Add-ReportField -Name 'artifact_bytes' -Value ([string]$artifact.Length)
          Add-ReportField -Name 'os' -Value $env:RUNNER_OS
          Add-ReportField -Name 'bitness' -Value '32'
          Add-ReportField -Name 'timestamp_utc' -Value ((Get-Date).ToUniversalTime().ToString('o'))

          $xml.Save($reportPath)
          Write-Host ("Packed library report written: {0}" -f $reportPath)
      - name: Upload packed library artifact (32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: lv_icon_x86.lvlibp
          path: ${{ env.REPO_ROOT }}/resource/plugins/lv_icon_x86.lvlibp
      - name: Upload packed library report artifact (32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: lv_icon.lvlibp-${{ runner.os }}-32-report
          path: ${{ env.REPO_ROOT }}/builds/status/lv_icon.lvlibp-${{ runner.os }}-32.xml
          if-no-files-found: error
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          revert_bitness: 32
          close_labview: 'true'
          close_executor: labviewcli
          close_bitness: 32

