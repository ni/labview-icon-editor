name: CODEOWNERS Guard

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
  push:
    branches:
      - main
      - develop
      - release/*

jobs:
  validate:
    name: Validate CODEOWNERS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CODEOWNERS exists and has required owners
        shell: bash
        run: |
          set -euo pipefail
          file=".github/CODEOWNERS"
          if [[ ! -f "$file" ]]; then
            echo "Missing $file" >&2
            exit 1
          fi
          if [[ ! -s "$file" ]]; then
            echo "$file is empty" >&2
            exit 1
          fi
          declare -a required=(
            '*'
            '/.github/'
            '/docs/'
          )
          for pat in "${required[@]}"; do
            if ! grep -Eq "^${pat}[[:space:]]+@" "$file"; then
              echo "Required pattern '${pat}' with at least one @owner is missing in $file" >&2
              exit 1
            fi
          done
          echo "$file looks valid (default owner and required scoped entries present)."
