name: CODEOWNERS Guard

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
  push:
    branches:
      - main
      - develop
      - release/*

jobs:
  validate:
    name: Validate CODEOWNERS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure CODEOWNERS exists and has default owner
        shell: bash
        run: |
          set -euo pipefail
          file=".github/CODEOWNERS"
          if [[ ! -f "$file" ]]; then
            echo "Missing $file" >&2
            exit 1
          fi
          if [[ ! -s "$file" ]]; then
            echo "$file is empty" >&2
            exit 1
          fi
          if ! grep -Eq '^\*\s+@' "$file"; then
            echo "Default owner entry (*) missing or malformed in $file" >&2
            exit 1
          fi
          echo "$file looks valid (default owner present)."
