name: Label Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes only (no mutation)"
        required: true
        default: true
        type: boolean
      include_aliases:
        description: "Include compatibility alias labels"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync Labels From Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: sync
        name: Create or update labels
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_ALIASES: ${{ inputs.include_aliases }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function normalizeColor(value) {
              return String(value || '').trim().replace(/^#/, '').toLowerCase();
            }

            function normalizeDescription(value) {
              return String(value || '').trim();
            }

            const dryRun = String(process.env.DRY_RUN || 'true').toLowerCase() === 'true';
            const includeAliases = String(process.env.INCLUDE_ALIASES || 'true').toLowerCase() === 'true';
            const contractPath = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), '.github', 'labels', 'label-contract.json');
            if (!fs.existsSync(contractPath)) {
              core.setFailed(`Label contract not found: ${contractPath}`);
              return;
            }

            const contract = JSON.parse(fs.readFileSync(contractPath, 'utf8'));
            const canonical = Array.isArray(contract.labels) ? contract.labels : [];
            const aliases = Array.isArray(contract.aliases) ? contract.aliases : [];
            const desired = includeAliases ? [...canonical, ...aliases] : [...canonical];

            const desiredByName = new Map();
            for (const label of desired) {
              const name = String(label.name || '').trim();
              if (!name) {
                core.setFailed('Every label entry in label-contract.json must include a non-empty name.');
                return;
              }

              const key = name.toLowerCase();
              if (desiredByName.has(key)) {
                core.setFailed(`Duplicate label in contract (case-insensitive): ${name}`);
                return;
              }

              const color = normalizeColor(label.color);
              if (!/^[0-9a-f]{6}$/.test(color)) {
                core.setFailed(`Label '${name}' has invalid color '${label.color}'. Expected 6-char hex without '#'.`);
                return;
              }

              desiredByName.set(key, {
                ...label,
                name,
                color,
                description: normalizeDescription(label.description),
              });
            }

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existingByName = new Map();
            for (const label of existing) {
              existingByName.set(String(label.name || '').trim().toLowerCase(), label);
            }

            const created = [];
            const updated = [];
            const unchanged = [];

            for (const [key, desiredLabel] of desiredByName.entries()) {
              const current = existingByName.get(key);
              if (!current) {
                created.push(desiredLabel.name);
                if (!dryRun) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: desiredLabel.name,
                    color: desiredLabel.color,
                    description: desiredLabel.description,
                  });
                }
                continue;
              }

              const currentColor = normalizeColor(current.color);
              const currentDescription = normalizeDescription(current.description);
              const colorChanged = currentColor !== desiredLabel.color;
              const descriptionChanged = currentDescription !== desiredLabel.description;

              if (colorChanged || descriptionChanged) {
                const detailParts = [];
                if (colorChanged) {
                  detailParts.push(`color ${currentColor} -> ${desiredLabel.color}`);
                }
                if (descriptionChanged) {
                  const fromDesc = currentDescription || '<empty>';
                  const toDesc = desiredLabel.description || '<empty>';
                  detailParts.push(`description '${fromDesc}' -> '${toDesc}'`);
                }

                updated.push({
                  name: desiredLabel.name,
                  details: detailParts.join('; '),
                });

                if (!dryRun) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: current.name,
                    new_name: desiredLabel.name,
                    color: desiredLabel.color,
                    description: desiredLabel.description,
                  });
                }
              } else {
                unchanged.push(desiredLabel.name);
              }
            }

            const operationLabel = dryRun ? 'planned' : 'applied';
            core.setOutput('created_count', String(created.length));
            core.setOutput('updated_count', String(updated.length));
            core.setOutput('unchanged_count', String(unchanged.length));

            const lines = [];
            lines.push(`## Label Sync (${operationLabel})`);
            lines.push('');
            lines.push(`- Contract: \`${path.relative(process.env.GITHUB_WORKSPACE || process.cwd(), contractPath)}\``);
            lines.push(`- Include aliases: \`${includeAliases}\``);
            lines.push(`- Dry run: \`${dryRun}\``);
            lines.push(`- Created (${operationLabel}): **${created.length}**`);
            lines.push(`- Updated (${operationLabel}): **${updated.length}**`);
            lines.push(`- Unchanged: **${unchanged.length}**`);
            lines.push('');
            lines.push('| Action | Label | Details |');
            lines.push('| --- | --- | --- |');

            for (const name of created.sort((a, b) => a.localeCompare(b))) {
              lines.push(`| Create (${operationLabel}) | \`${name}\` | Missing label |`);
            }
            for (const entry of updated.sort((a, b) => a.name.localeCompare(b.name))) {
              lines.push(`| Update (${operationLabel}) | \`${entry.name}\` | ${entry.details} |`);
            }
            for (const name of unchanged.sort((a, b) => a.localeCompare(b))) {
              lines.push(`| Unchanged | \`${name}\` | No drift |`);
            }

            await core.summary.addRaw(lines.join('\n') + '\n').write();

      - name: Log summary counts
        shell: pwsh
        run: |
          Write-Host ("created_count=${{ steps.sync.outputs.created_count }}")
          Write-Host ("updated_count=${{ steps.sync.outputs.updated_count }}")
          Write-Host ("unchanged_count=${{ steps.sync.outputs.unchanged_count }}")
