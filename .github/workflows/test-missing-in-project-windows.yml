name: Test Missing‑In‑Project Action on Windows
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  missing-in-project-check:
    runs-on: self-hosted-windows-lv
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lv-version: ["2021"]
        bitness:    ["32","64"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Development Mode (LV${{ matrix.lv-version }} ${{ matrix.bitness }}-bit)
        uses: ./.github/actions/set-development-mode
        with:
          minimum_supported_lv_version: ${{ matrix.lv-version }}
          supported_bitness: ${{ matrix.bitness }}
          repo_root: ${{ github.workspace }}

      # 1️⃣  Detect the first *.lvproj and expose its **absolute path**
      - name: Find .lvproj file
        id: find_proj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path $PWD -Filter *.lvproj |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $proj) {
            Write-Error 'No .lvproj file found in repo root'
            exit 1
          }
          Write-Host "🔍 Found project file: $proj"
          "project_file=$proj" >> $env:GITHUB_OUTPUT

      # 2️⃣  Pass that exact file path to the composite action
      - name: Missing In Project
        id: mip
        uses: ./.github/actions/missing-in-project
        with:
          lv-ver:       ${{ matrix.lv-version }}
          arch:         ${{ matrix.bitness }}
          project-file: ${{ steps.find_proj.outputs.project_file }}

      # 3️⃣  Surface results in the “Summary” tab
      - name: Summarize to run “Summary” tab
        if: always()
        shell: pwsh
        env:
          PROJ_FILE: ${{ steps.find_proj.outputs.project_file }}
        run: |
          echo "ℹ️  Using project file: $env:PROJ_FILE" >> $GITHUB_STEP_SUMMARY

          $artifact = 'missing-files.txt'
          if (Test-Path $artifact) {
            echo "### ❌ Missing files for ${{ matrix.lv-version }}‑${{ matrix.bitness }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            Get-Content $artifact -Raw | ForEach-Object { echo $_ } >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          } else {
            echo "✅ Nothing missing for ${{ matrix.lv-version }}‑${{ matrix.bitness }}" >> $GITHUB_STEP_SUMMARY
          }

      # 4️⃣  Keep the binary‑generated list as a downloadable artifact
      - name: Upload missing-files artifact
        if: always() && steps.mip.outputs.passed != 'True'
        uses: actions/upload-artifact@v4
        with:
          name: missing-files-${{ matrix.lv-version }}-${{ matrix.bitness }}
          path: missing-files.txt
          if-no-files-found: ignore
      # Cleanup
      - name: Revert Development Mode (LV${{ matrix.lv-version }} ${{ matrix.bitness }}-bit)
        if: always()
        uses: ./.github/actions/revert-development-mode
        with:
          minimum_supported_lv_version: ${{ matrix.lv-version }}
          supported_bitness: ${{ matrix.bitness }}
          repo_root: ${{ github.workspace }}
      - name: Close LabVIEW (LV${{ matrix.lv-version }} ${{ matrix.bitness }}-bit)
        if: always()
        uses: ./.github/actions/close-labview
        with:
          minimum_supported_lv_version: ${{ matrix.lv-version }}
          supported_bitness: ${{ matrix.bitness }}
      - name: Cleanup temp files (LV${{ matrix.lv-version }} ${{ matrix.bitness }}-bit)
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE 'missing-files.txt'),
            (Join-Path $env:GITHUB_WORKSPACE '.github\\actions\\missing-in-project\\missing_files.txt'),
            (Join-Path $env:TEMP 'labview-icon-editor-missing-in-project'),
            (Join-Path $env:TEMP 'missing-in-project')
          )

          foreach ($path in $paths) {
            if (Test-Path -Path $path) {
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
