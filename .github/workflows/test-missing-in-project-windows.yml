name: Test Missing?In?Project Action on Windows

permissions:
  actions: read

env:
  LVIE_FORCE_NO_LABVIEW_DEVMODE: 1

concurrency:
  group: labview-${{ github.repository }}-${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
  cancel-in-progress: false

on:
  workflow_call:
  workflow_dispatch:

jobs:
  missing-in-project-check:
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bitness:    ["32","64"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Runner bootstrap (stateless)
        uses: ./.github/actions/runner-bootstrap
        with:
          safe_directory_scope: System
      - name: Acquire LabVIEW runner lock
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\RunnerLock.ps1" -Mode Acquire
      - name: Create short-path worktree
        id: worktree
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\Tooling\New-CIWorktreeForJob.ps1" `
            -Bitness ${{ matrix.bitness }}

      - name: Enable Development Mode (LV ${{ matrix.bitness }}-bit)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & ".github\\actions\\set-development-mode\\Set_Development_Mode.ps1" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -SupportedBitness ${{ matrix.bitness }} `
            -RepoRoot "$env:REPO_ROOT"

      - name: Resolve LabVIEW project path
        id: proj
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROJECT_PATH)) {
            throw "PROJECT_PATH was not set."
          }
          if (-not (Test-Path -Path $env:PROJECT_PATH)) {
            throw "Project file not found: $env:PROJECT_PATH"
          }
          Write-Host "Using project file: $env:PROJECT_PATH"
          "project_file=$env:PROJECT_PATH" >> $env:GITHUB_OUTPUT

      - name: Missing?In?Project (LV ${{ matrix.bitness }}-bit)
        id: mip
        uses: ./.github/actions/missing-in-project
        with:
          repo-root: ${{ env.REPO_ROOT }}
          arch: ${{ matrix.bitness }}
          project-file: ${{ steps.proj.outputs.project_file }}
          lv-ver: ${{ env.LABVIEW_VERSION_YEAR }}
      - name: Summarize to run ?Summary? tab
        if: always()
        shell: pwsh
        env:
          PROJ_FILE: ${{ steps.proj.outputs.project_file }}
          MISSING_CSV: ${{ steps.mip.outputs.missing-files }}
        run: |
          echo "??  Using project file: $env:PROJ_FILE" >> $GITHUB_STEP_SUMMARY

          if ("${{ steps.mip.outputs.passed }}" -eq "true") {
            echo "? Nothing missing for $env:LABVIEW_VERSION_YEAR?${{ matrix.bitness }}" >> $GITHUB_STEP_SUMMARY
            exit 0
          }

          echo "### ? Missing files for $env:LABVIEW_VERSION_YEAR?${{ matrix.bitness }}" >> $GITHUB_STEP_SUMMARY
          if (-not [string]::IsNullOrWhiteSpace($env:MISSING_CSV)) {
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Missing files (CSV):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo $env:MISSING_CSV >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }

          $artifact = Join-Path $env:REPO_ROOT '.github\\actions\\missing-in-project\\missing_files.txt'
          if (Test-Path $artifact) {
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Missing files (from missing_files.txt):" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            Get-Content $artifact -Raw | ForEach-Object { echo $_ } >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }

      - name: Upload missing_files artifact
        if: always() && steps.mip.outputs.passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: missing-files-${{ matrix.bitness }}
          path: ${{ env.REPO_ROOT }}/.github/actions/missing-in-project/missing_files.txt
          if-no-files-found: ignore
      # Cleanup
      - name: Revert Development Mode (LV ${{ matrix.bitness }}-bit)
        if: always()
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & ".github\\actions\\revert-development-mode\\RevertDevelopmentMode.ps1" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -SupportedBitness ${{ matrix.bitness }} `
            -RepoRoot "$env:REPO_ROOT"
      - name: Close LabVIEW (LV ${{ matrix.bitness }}-bit)
        if: always()
        shell: pwsh
        run: |
          & "$env:REPO_ROOT\\.github\\actions\\close-labview\\Close_LabVIEW.ps1" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -SupportedBitness ${{ matrix.bitness }}
      - name: Cleanup temp files (LV ${{ matrix.bitness }}-bit)
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:REPO_ROOT '.github\\actions\\missing-in-project\\missing_files.txt'),
            (Join-Path $env:TEMP 'labview-icon-editor-missing-in-project'),
            (Join-Path $env:TEMP 'missing-in-project')
          )

          foreach ($path in $paths) {
            if (Test-Path -Path $path) {
              Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Cleanup worktree
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:REPO_ROOT)) {
            git -C "$env:GITHUB_WORKSPACE" worktree remove --force "$env:REPO_ROOT" 2>$null
            git -C "$env:GITHUB_WORKSPACE" worktree prune
          }
      - name: Release LabVIEW runner lock
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\RunnerLock.ps1" -Mode Release

