name: CLA Validation

on:
  pull_request:
    paths:
      - "docs/cla/**"
      - ".github/CODEOWNERS"
  workflow_dispatch: {}

jobs:
  validate-cla:
    name: Validate CLA manifest
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout

      - name: Validate CLA manifest schema
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate-cla.py
