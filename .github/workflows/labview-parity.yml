  parity-windows:
    name: Parity (Windows Container ${{ needs.resolve-parity-context.outputs.lvcontainer_windows_tag }})
    needs: [resolve-parity-context]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.418'

      - name: Resolve parity context via runner-cli
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contextPath = Join-Path $env:RUNNER_TEMP 'parity-context-windows.json'
          $lvReleaseInput = '${{ needs.resolve-parity-context.outputs.lv_release_windows }}'

          $args = @(
            'run', '--project', '.\Tooling\runner-cli\RunnerCli\RunnerCli.csproj', '--',
            'parity', 'context',
            '--mode', 'windows-container',
            '--repo-root', $env:GITHUB_WORKSPACE,
            '--output', $contextPath
          )
          if (-not [string]::IsNullOrWhiteSpace($lvReleaseInput)) {
            $args += @('--lv-release', $lvReleaseInput)
          }

          & dotnet @args
          if ($LASTEXITCODE -ne 0) {
            throw "runner-cli parity context failed with exit code $LASTEXITCODE."
          }

          "PARITY_CONTEXT_PATH=$contextPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate path contract for Windows container shell
        shell: pwsh
        run: |
          Write-Host 'Windows container parity script runs under powershell.exe (Windows PowerShell 5.1) inside the NI container.'
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\Tooling\Test-PathContract.ps1" -WriteSummary

      - name: Run parity lane via runner-cli (windows-container)
        shell: pwsh
        run: |
          dotnet run --project .\Tooling\runner-cli\RunnerCli\RunnerCli.csproj -- `
            parity run `
            --mode windows-container `
            --context "$env:PARITY_CONTEXT_PATH" `
            --build-spec true

          if ($LASTEXITCODE -ne 0) {
            throw "runner-cli parity run failed with exit code $LASTEXITCODE."
          }

      - name: Verify built specification output (Windows container)
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'resource\plugins\lv_icon.lvlibp'
          if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
            throw "Expected build output was not found: $outputPath"
          }
          $item = Get-Item -LiteralPath $outputPath
          Write-Host ("Built specification artifact: {0} ({1} bytes)" -f $item.FullName, $item.Length)

      - name: Upload built specification artifact (Windows container)
        uses: actions/upload-artifact@v4
        with:
          name: labview-container-editor-packed-library-windows
          path: resource/plugins/lv_icon.lvlibp
          if-no-files-found: error
          retention-days: 14

      - name: Upload LabVIEWCLI logs (Windows container)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: labview-container-logs-windows
          path: TestResults/container-parity/windows/logs
          if-no-files-found: warn
          retention-days: 14

  parity-summary:
    name: Parity Summary
    if: ${{ always() }}
    needs:
      - resolve-parity-context
      - self-hosted-policy-gate
      - parity-linux
      - vi-analyzer-linux
      - parity-windows
      - parity-self-hosted-64
      - parity-self-hosted-32
    runs-on: ubuntu-latest
    steps:
      - name: Write parity summary
        shell: pwsh
        env:
          LVIE_POLICY_GATE_RESULT: ${{ needs['self-hosted-policy-gate'].result }}
          LVIE_PARITY_LINUX_RESULT: ${{ needs['parity-linux'].result }}
          LVIE_VI_ANALYZER_RESULT: ${{ needs['vi-analyzer-linux'].result }}
          LVIE_PARITY_WINDOWS_RESULT: ${{ needs['parity-windows'].result }}
          LVIE_SELF_HOSTED_64_RESULT: ${{ needs['parity-self-hosted-64'].result }}
          LVIE_SELF_HOSTED_32_RESULT: ${{ needs['parity-self-hosted-32'].result }}
        run: |
          $mode = '${{ needs.resolve-parity-context.outputs.parity_mode_effective }}'
          $available = '${{ needs.resolve-parity-context.outputs.self_hosted_available }}'
          $availabilityReason = '${{ needs.resolve-parity-context.outputs.self_hosted_availability_reason }}'
          $onlineCount = '${{ needs.resolve-parity-context.outputs.self_hosted_online_count }}'
          $totalCount = '${{ needs.resolve-parity-context.outputs.self_hosted_total_count }}'
          $onlineRunners = '${{ needs.resolve-parity-context.outputs.self_hosted_online_runners }}'
          $label64 = '${{ needs.resolve-parity-context.outputs.self_hosted_runner_label_64 }}'
          $label32 = '${{ needs.resolve-parity-context.outputs.self_hosted_runner_label_32 }}'
          $available64 = '${{ needs.resolve-parity-context.outputs.self_hosted_64_available }}'
          $available32 = '${{ needs.resolve-parity-context.outputs.self_hosted_32_available }}'
          $availabilityReason64 = '${{ needs.resolve-parity-context.outputs.self_hosted_64_availability_reason }}'
          $availabilityReason32 = '${{ needs.resolve-parity-context.outputs.self_hosted_32_availability_reason }}'
          $onlineCount64 = '${{ needs.resolve-parity-context.outputs.self_hosted_64_online_count }}'
          $onlineCount32 = '${{ needs.resolve-parity-context.outputs.self_hosted_32_online_count }}'
          $onlineRunners64 = '${{ needs.resolve-parity-context.outputs.self_hosted_64_online_runners }}'
          $onlineRunners32 = '${{ needs.resolve-parity-context.outputs.self_hosted_32_online_runners }}'
          $requested64 = '${{ needs.resolve-parity-context.outputs.run_self_hosted_64 }}'
          $requested32 = '${{ needs.resolve-parity-context.outputs.run_self_hosted_32 }}'
          $effective64 = '${{ needs.resolve-parity-context.outputs.run_self_hosted_64_effective }}'
          $effective32 = '${{ needs.resolve-parity-context.outputs.run_self_hosted_32_effective }}'
          $windowsExceptionApplied = '${{ needs.resolve-parity-context.outputs.windows_release_exception_applied }}'
          $windowsExceptionNote = '${{ needs.resolve-parity-context.outputs.windows_release_exception_note }}'

          Write-Host ("Parity mode: {0}" -f $mode)
          Write-Host ("Self-hosted availability: {0}" -f $available)
          Write-Host ("Self-hosted availability reason: {0}" -f $availabilityReason)
          Write-Host ("Self-hosted online count: {0}" -f $onlineCount)
          Write-Host ("Self-hosted total count: {0}" -f $totalCount)
          Write-Host ("Self-hosted online runners: {0}" -f $onlineRunners)
          Write-Host ("Self-hosted label 64: {0}" -f $label64)
          Write-Host ("Self-hosted label 32: {0}" -f $label32)
          Write-Host ("Self-hosted 64 availability: {0} ({1})" -f $available64, $availabilityReason64)
          Write-Host ("Self-hosted 32 availability: {0} ({1})" -f $available32, $availabilityReason32)
          Write-Host ("Self-hosted 64 online count/runners: {0} / {1}" -f $onlineCount64, $onlineRunners64)
          Write-Host ("Self-hosted 32 online count/runners: {0} / {1}" -f $onlineCount32, $onlineRunners32)
          Write-Host ("Self-hosted requested lanes: 64={0}, 32={1}" -f $requested64, $requested32)
          Write-Host ("Self-hosted effective lanes: 64={0}, 32={1}" -f $effective64, $effective32)

          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            @(
              '## LabVIEW Parity Summary'
              ''
              ('- mode: `{0}`' -f $mode)
              ('- self_hosted_available: `{0}`' -f $available)
              ('- self_hosted_availability_reason: `{0}`' -f $availabilityReason)
              ('- self_hosted_online_count: `{0}`' -f $onlineCount)
              ('- self_hosted_total_count: `{0}`' -f $totalCount)
              ('- self_hosted_online_runners: `{0}`' -f $onlineRunners)
              ('- self_hosted_runner_label_64: `{0}`' -f $label64)
              ('- self_hosted_runner_label_32: `{0}`' -f $label32)
              ('- self_hosted_64_available/reason: `{0}` / `{1}`' -f $available64, $availabilityReason64)
              ('- self_hosted_32_available/reason: `{0}` / `{1}`' -f $available32, $availabilityReason32)
              ('- self_hosted_64_online_count/runners: `{0}` / `{1}`' -f $onlineCount64, $onlineRunners64)
              ('- self_hosted_32_online_count/runners: `{0}` / `{1}`' -f $onlineCount32, $onlineRunners32)
              ('- run_self_hosted_64 requested/effective: `{0}` / `{1}`' -f $requested64, $effective64)
              ('- run_self_hosted_32 requested/effective: `{0}` / `{1}`' -f $requested32, $effective32)
              ('- windows_release_exception_applied: `{0}`' -f $windowsExceptionApplied)
              ('- windows_release_exception_note: `{0}`' -f $windowsExceptionNote)
              ''
              '### Job Results'
              ''
              ('- self-hosted-policy-gate: `{0}`' -f $env:LVIE_POLICY_GATE_RESULT)
              ('- parity-linux: `{0}`' -f $env:LVIE_PARITY_LINUX_RESULT)
              ('- vi-analyzer-linux: `{0}`' -f $env:LVIE_VI_ANALYZER_RESULT)
              ('- parity-windows: `{0}`' -f $env:LVIE_PARITY_WINDOWS_RESULT)
              ('- parity-self-hosted-64: `{0}`' -f $env:LVIE_SELF_HOSTED_64_RESULT)
              ('- parity-self-hosted-32: `{0}`' -f $env:LVIE_SELF_HOSTED_32_RESULT)
            ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
