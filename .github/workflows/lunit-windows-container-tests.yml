name: LUnit Tests on Windows Container

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  LVIE_CONTAINER_NAME: lvie-lunit-windows-${{ github.run_id }}-${{ github.run_attempt }}
  LABVIEW_IMAGE: lvie-lunit-windows:${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lunit-tests:
    name: Run LUnit tests (Windows container)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build required LUnit dependency image
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          $os = docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0 -or $os -ne 'windows') {
            throw 'A running Docker engine in Windows-container mode is required.'
          }
          & .\Tooling\Build-LUnitWindowsImage.ps1 -Image $env:LABVIEW_IMAGE

      - name: Start container
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\lunit-results" -Force | Out-Null
          docker create --name $env:LVIE_CONTAINER_NAME --user ContainerAdministrator `
            --mount "type=bind,source=$env:GITHUB_WORKSPACE,target=C:\workspace" `
            --entrypoint powershell.exe $env:LABVIEW_IMAGE `
            -NoProfile -Command "Start-Sleep -Seconds 7200"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create Windows LUnit container.' }
          'LVIE_CONTAINER_CREATED=true' >> $env:GITHUB_ENV
          docker start $env:LVIE_CONTAINER_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start Windows LUnit container.' }

      - name: Read installed dependency manifest
        run: |
          docker cp "${env:LVIE_CONTAINER_NAME}:C:\lunit-dependency-manifest.json" "$env:GITHUB_WORKSPACE\lunit-results\dependency-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency image is missing its required installation manifest.' }

      - name: Run LUnit CLI
        timeout-minutes: 20
        run: |
          docker exec $env:LVIE_CONTAINER_NAME powershell.exe -NoProfile `
            -File C:\workspace\Tooling\Run-LUnitWindowsContainer.ps1 -Stage Test
          if ($LASTEXITCODE -ne 0) { throw 'Windows LUnit execution failed; see Test.log.' }

      - name: Summarize unit test failures
        if: always() && env.LVIE_CONTAINER_CREATED == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'lunit-results') 'lunit.xml'
          '## LUnit Test Diagnostics' >> $env:GITHUB_STEP_SUMMARY
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            'No JUnit report was produced. Download the LUnit reports and logs artifact and check Test.log and the LabVIEW logs.' >> $env:GITHUB_STEP_SUMMARY
            return
          }
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $settings.XmlResolver = $null
          $reader = [System.Xml.XmlReader]::Create($path, $settings)
          try {
            $report = [System.Xml.XmlDocument]::new()
            $report.XmlResolver = $null
            $report.Load($reader)
          } finally {
            $reader.Dispose()
          }
          $failedTests = $report.SelectNodes('//testcase[failure or error]')
          if ($failedTests.Count -eq 0) {
            'No failed test cases were recorded in the JUnit report.' >> $env:GITHUB_STEP_SUMMARY
          }
          foreach ($testCase in $failedTests) {
            "### $($testCase.GetAttribute('classname')) : $($testCase.GetAttribute('name'))" >> $env:GITHUB_STEP_SUMMARY
            foreach ($failure in $testCase.SelectNodes('failure | error')) {
              '````text' >> $env:GITHUB_STEP_SUMMARY
              $failure.GetAttribute('message') >> $env:GITHUB_STEP_SUMMARY
              $failure.InnerText >> $env:GITHUB_STEP_SUMMARY
              '````' >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Validate JUnit report and test discovery
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'lunit-results') 'lunit.xml'
          $settings = [System.Xml.XmlReaderSettings]::new()
          $settings.DtdProcessing = [System.Xml.DtdProcessing]::Prohibit
          $settings.XmlResolver = $null
          $reader = [System.Xml.XmlReader]::Create($path, $settings)
          try {
            $report = [System.Xml.XmlDocument]::new()
            $report.XmlResolver = $null
            $report.Load($reader)
          } finally {
            $reader.Dispose()
          }
          if ($report.DocumentElement.Name -notin @('testsuite', 'testsuites')) {
            throw 'Expected a testsuite or testsuites root element.'
          }
          # TEMPORARY known failure: in headless CLI runs, plain Library:Save keeps the NI_IconEditor tag instead of
          # renaming it to NI.Lib.VIIconTemplate (the IDE renames it). Tolerated only for this exact tag mismatch;
          # remove once the save behaviour is resolved with the maintainers.
          $knownFailures = @{
            'Library Icon Data::Test Write Read Library Icon Data.vi' = 'NI\.Lib\.VIIconTemplate[\s\S]*NI_IconEditor'
          }
          $unexpected = @()
          $tolerated = @()
          foreach ($testCase in $report.SelectNodes('//testcase[failure or error]')) {
            $key = '{0}::{1}' -f $testCase.GetAttribute('classname'), $testCase.GetAttribute('name')
            $pattern = $knownFailures[$key]
            $texts = @($testCase.SelectNodes('failure') | ForEach-Object {
              [pscustomobject]@{ Type = $_.GetAttribute('type'); Text = $_.GetAttribute('message') + "`n" + $_.InnerText }
            })
            # The 'Test Case' entry is LUnit's per-test summary; every assertion failure must be the tag mismatch.
            $isKnown = $pattern -and $testCase.SelectNodes('error').Count -eq 0 -and
              @($texts | Where-Object { $_.Type -ne 'Test Case' -and $_.Text -notmatch $pattern }).Count -eq 0 -and
              @($texts | Where-Object { $_.Text -match $pattern }).Count -gt 0
            if ($isKnown) { $tolerated += $key } else { $unexpected += $key }
          }
          if ($unexpected.Count -gt 0) {
            throw "LUnit reported test failures or errors: $($unexpected -join ', ')"
          }
          foreach ($suite in $report.SelectNodes('//testsuite | /testsuites')) {
            $total = 0
            foreach ($attribute in @('failures', 'errors')) {
              $value = $suite.GetAttribute($attribute)
              if ($value -and $value -notmatch '^\d+$') { throw "Invalid $attribute count: $value" }
              if ($value) { $total += [int]$value }
            }
            $failing = $suite.SelectNodes('.//testcase[failure or error]').Count
            if ($total -ne 0 -and $total -ne $failing) {
              throw "Inconsistent failures count: suite reports $total, report contains $failing failing test cases."
            }
          }
          foreach ($key in $tolerated) {
            Write-Output "::warning::Known failure tolerated temporarily: $key (NI.Lib.VIIconTemplate expected, NI_IconEditor saved)."
            "Known failure tolerated temporarily: $key" >> $env:GITHUB_STEP_SUMMARY
          }
          $skipped = $report.SelectNodes('//testcase[skipped]').Count
          $executed = $report.SelectNodes('//testcase').Count - $skipped
          if ($executed -lt 10) { throw "LUnit executed $executed tests; expected at least 10." }
          "LUnit (Windows): $executed tests executed; $skipped skipped." >> $env:GITHUB_STEP_SUMMARY

      - name: Collect container logs
        if: always() && env.LVIE_CONTAINER_CREATED == 'true'
        run: |
          docker logs $env:LVIE_CONTAINER_NAME *> "$env:GITHUB_WORKSPACE\lunit-results\docker.log"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to collect container logs.' }

      - name: Upload LUnit reports and logs
        if: always() && env.LVIE_CONTAINER_CREATED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lunit-windows-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lunit-results
          if-no-files-found: error
          retention-days: 7

      - name: Remove container
        if: always() && env.LVIE_CONTAINER_CREATED == 'true'
        run: |
          docker rm -f $env:LVIE_CONTAINER_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Failed to remove Windows LUnit container.' }
