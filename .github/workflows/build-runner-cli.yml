name: Build Runner CLI

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
      - integrate/*
    paths:
      - 'Tooling/runner-cli/**'
      - '.github/workflows/build-runner-cli.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Tooling/runner-cli/**'
      - '.github/workflows/build-runner-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Runner CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tooling/runner-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build RunnerCli/RunnerCli.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test RunnerCli.Tests/RunnerCli.Tests.csproj --configuration Release --verbosity normal
      - name: Shutdown dotnet build servers
        if: always()
        run: dotnet build-server shutdown

  publish:
    name: Publish Runner CLI (${{ matrix.rid }})
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    defaults:
      run:
        working-directory: Tooling/runner-cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file
        run: >
          dotnet publish RunnerCli/RunnerCli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          --output ./publish/${{ matrix.rid }}
      - name: Shutdown dotnet build servers
        if: always()
        run: dotnet build-server shutdown

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-cli-${{ matrix.rid }}
          path: Tooling/runner-cli/publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Smoke Runner CLI (${{ matrix.rid }} on ${{ matrix.os }})
    needs: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download runner-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: runner-cli-${{ matrix.rid }}
          path: runner-cli
      - name: Ensure Rosetta for x64 on arm64
        if: ${{ matrix.rid == 'osx-x64' && runner.os == 'macOS' }}
        shell: bash
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Smoke test runner-cli
        shell: pwsh
        run: |
          $cli = if ($IsWindows) {
            Join-Path $PWD 'runner-cli' 'runner-cli.exe'
          } else {
            Join-Path $PWD 'runner-cli' 'runner-cli'
          }
          if (-not (Test-Path $cli)) {
            Write-Error "runner-cli not found at $cli"
            Get-ChildItem -Path $PWD -Recurse -File | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          if (-not $IsWindows) {
            chmod +x $cli
          }
          & $cli --help
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            throw "runner-cli --help failed with exit code $LASTEXITCODE"
          }
          & $cli version-gate --repo-root $env:GITHUB_WORKSPACE --json
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            throw "runner-cli version-gate failed with exit code $LASTEXITCODE"
          }

          $fixture = Join-Path $env:GITHUB_WORKSPACE 'Tooling' 'pylavi' 'fixtures' 'pylavi-offenders.sample.json'
          if (-not (Test-Path $fixture)) {
            throw "Pylavi fixture not found at $fixture"
          }

          $summaryPath = Join-Path $env:RUNNER_TEMP 'pylavi-summary.json'
          $output = & $cli pylavi summarize --path $fixture --json --output-path $summaryPath | Out-String
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            throw "runner-cli pylavi summarize failed with exit code $LASTEXITCODE"
          }

          $report = $output | ConvertFrom-Json
          if (-not $report.label) { throw "pylavi summarize JSON missing label" }
          if ($report.total_fails -lt 1) { throw "pylavi summarize JSON missing total_fails" }
          if (-not $report.top_offenders -or $report.top_offenders.Count -lt 1) { throw "pylavi summarize JSON missing top_offenders" }
          if (-not $report.top_absolute_offenders -or $report.top_absolute_offenders.Count -lt 1) { throw "pylavi summarize JSON missing top_absolute_offenders" }

          if (-not (Test-Path $summaryPath)) {
            throw "pylavi summarize output file not found at $summaryPath"
          }
          $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
          if (-not $summary.label) { throw "pylavi summarize output missing label" }
          if (-not $summary.file -or ($summary.file -notlike "*pylavi-offenders.sample.json")) {
            throw "pylavi summarize output missing file path"
          }
          if (-not $summary.has_findings) { throw "pylavi summarize output missing has_findings" }
