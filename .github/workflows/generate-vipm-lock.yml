name: Generate Initial VIPM Lock File

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST_PATH: .github/actions/apply-vipc/runner_dependencies.toml
  VIPM_WORK_DIR: vipm-lock-work

jobs:
  generate-lock:
    runs-on: self-hosted-windows-lv
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifest and VIPM CLI
        run: |
          if (-not (Test-Path $env:MANIFEST_PATH)) { throw "$env:MANIFEST_PATH not found." }
          if (-not (Get-Command vipm -ErrorAction SilentlyContinue)) { throw 'vipm CLI not found on PATH.' }
          vipm --version

      # vipm expects the manifest to be named vipm.toml
      - name: Stage manifest as vipm.toml
        run: |
          New-Item -ItemType Directory -Force -Path $env:VIPM_WORK_DIR | Out-Null
          Copy-Item $env:MANIFEST_PATH (Join-Path $env:VIPM_WORK_DIR 'vipm.toml') -Force

      - name: Activate VIPM
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: |
          vipm activate --serial-number "$env:VIPM_SERIAL_NUMBER" --name "$env:VIPM_FULL_NAME" --email "$env:VIPM_EMAIL"
          if ($LASTEXITCODE -ne 0) { throw "vipm activate failed ($LASTEXITCODE)" }

      - name: vipm refresh
        working-directory: ${{ env.VIPM_WORK_DIR }}
        run: |
          vipm refresh
          if ($LASTEXITCODE -ne 0) { throw "vipm refresh failed ($LASTEXITCODE)" }

      - name: vipm lock
        working-directory: ${{ env.VIPM_WORK_DIR }}
        run: |
          vipm lock
          if ($LASTEXITCODE -ne 0) { throw "vipm lock failed ($LASTEXITCODE)" }
          if (-not (Test-Path 'vipm.lock')) { throw 'vipm.lock was not generated.' }
          Get-Content 'vipm.lock'

      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: vipm-lock-lv2020-64bit
          path: ${{ env.VIPM_WORK_DIR }}/vipm.lock
          if-no-files-found: error
