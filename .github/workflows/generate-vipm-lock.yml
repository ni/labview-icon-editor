name: Generate Initial VIPM Lock File

on:
  workflow_dispatch:
  # TEMPORARY: remove before merging
  push:
    branches:
      - users/amrutha/dependancy-update

permissions:
  contents: read

env:
  MANIFEST_PATH: .github/actions/apply-vipc/runner_dependencies.toml
  VIPM_WORK_DIR: vipm-lock-work

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    container:
      image: nationalinstruments/labview:2026q1-linux
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifest and VIPM CLI
        run: |
          set -euo pipefail
          test -f "$MANIFEST_PATH" || { echo "$MANIFEST_PATH not found."; exit 1; }
          command -v vipm >/dev/null || { echo "vipm CLI not found on PATH in container."; exit 1; }
          vipm --version

      # vipm expects the manifest to be named vipm.toml
      - name: Stage manifest as vipm.toml
        run: |
          set -euo pipefail
          mkdir -p "$VIPM_WORK_DIR"
          cp "$MANIFEST_PATH" "$VIPM_WORK_DIR/vipm.toml"

      - name: Activate VIPM
        env:
          VIPM_SERIAL_NUMBER: ${{ secrets.VIPM_SERIAL_NUMBER }}
          VIPM_FULL_NAME: ${{ secrets.VIPM_FULL_NAME }}
          VIPM_EMAIL: ${{ secrets.VIPM_EMAIL }}
        run: |
          set -euo pipefail
          vipm activate --serial-number "$VIPM_SERIAL_NUMBER" --name "$VIPM_FULL_NAME" --email "$VIPM_EMAIL"

      - name: vipm refresh
        working-directory: ${{ env.VIPM_WORK_DIR }}
        run: vipm refresh

      - name: vipm lock
        working-directory: ${{ env.VIPM_WORK_DIR }}
        run: |
          set -euo pipefail
          vipm lock
          test -f vipm.lock || { echo "vipm.lock was not generated."; exit 1; }
          cat vipm.lock

      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: vipm-lock-lv2020-64bit
          path: ${{ env.VIPM_WORK_DIR }}/vipm.lock
          if-no-files-found: error
