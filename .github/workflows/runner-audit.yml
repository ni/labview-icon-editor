name: Runner Audit

permissions:
  actions: read

env:
  LVIE_EXPECTED_RUNNER_LABEL: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
  LVIE_CANONICAL_RUNNER_LABEL: self-hosted-windows-lv
  LVIE_REQUIRE_RUNNER_CLI: ${{ vars.LVIE_REQUIRE_RUNNER_CLI || '0' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

concurrency:
  group: runner-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download runner-cli (optional)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cliDir = Join-Path $env:RUNNER_TEMP 'runner-cli'
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($IsWindows) {
            $rid = 'win-x64'
            $cliFile = 'runner-cli.exe'
          } elseif ($IsLinux) {
            $rid = if ($arch -eq 'Arm64') { 'linux-arm64' } else { 'linux-x64' }
            $cliFile = 'runner-cli'
          } elseif ($IsMacOS) {
            $rid = if ($arch -eq 'Arm64') { 'osx-arm64' } else { 'osx-x64' }
            $cliFile = 'runner-cli'
          } else {
            $rid = 'win-x64'
            $cliFile = 'runner-cli.exe'
          }
          $cliPath = Join-Path $cliDir $cliFile
          if (Test-Path $cliPath) {
            Write-Host "runner-cli already present at $cliPath"
            exit 0
          }
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            Write-Warning 'gh CLI not found; skipping runner-cli download.'
            exit 0
          }
          $repo = if ($env:GITHUB_REPOSITORY) { $env:GITHUB_REPOSITORY } else { '${{ github.repository }}' }
          $branch = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { '${{ github.ref_name }}' }
          Write-Host "Finding latest successful build-runner-cli run for $repo@$branch ..."
          try {
            $runs = gh run list -R $repo -w build-runner-cli.yml -b $branch -s success -L 1 --json databaseId | ConvertFrom-Json
          } catch {
            Write-Warning ("Failed to query workflow runs: {0}" -f $_.Exception.Message)
            exit 0
          }
          $runId = if ($runs -is [array]) { $runs[0].databaseId } else { $runs.databaseId }
          if (-not $runId) {
            Write-Warning 'No successful build-runner-cli run found; skipping download.'
            exit 0
          }
          New-Item -Path $cliDir -ItemType Directory -Force | Out-Null
          try {
            gh run download $runId -R $repo -n ("runner-cli-{0}" -f $rid) -D $cliDir | Out-Null
          } catch {
            Write-Warning ("Failed to download runner-cli artifact: {0}" -f $_.Exception.Message)
            exit 0
          }
          if (Test-Path $cliPath) {
            Write-Host "Downloaded runner-cli to $cliPath"
          } else {
            Write-Warning ("runner-cli artifact downloaded but {0} not found in {1}" -f $cliFile, $cliDir)
          }
      - name: Resolve LabVIEW version from .lvversion
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw "GITHUB_WORKSPACE is required to resolve RepoRoot."
          }
          $repoRoot = (Resolve-Path -Path $env:GITHUB_WORKSPACE -ErrorAction Stop).Path
          $cliName = if ($IsWindows) { 'runner-cli.exe' } else { 'runner-cli' }
          $cli = Join-Path $env:RUNNER_TEMP 'runner-cli' $cliName
          if (Test-Path $cli) {
            Write-Host "Using runner-cli version-gate (incremental migration)."
            $json = & $cli version-gate --repo-root $repoRoot --json
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              exit $exitCode
            }
            $lvInfo = $json | ConvertFrom-Json
          } else {
            if ($env:LVIE_REQUIRE_RUNNER_CLI -eq '1') {
              throw "LVIE_REQUIRE_RUNNER_CLI=1 but runner-cli was not available."
            }
            Write-Warning "runner-cli not available; falling back to Assert-LabVIEWVersion.ps1."
            $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
            if (-not (Test-Path -Path $assertScript)) {
              throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
            }
            $lvInfo = & $assertScript -RepoRoot $repoRoot -Context 'runner-audit'
          }
          Write-Warning ("labview_version not provided; using .lvversion ({0})." -f $lvInfo.Raw)
          Write-Host ("LabVIEW version gate passed: {0}" -f $lvInfo.Raw)
      - name: Runner bootstrap (stateless)
        uses: ./.github/actions/runner-bootstrap
        with:
          safe_directory_scope: System
      - name: Validate runner contract
        shell: pwsh
        run: |
          # Try CLI first, fall back to PowerShell
          $cliName = if ($IsWindows) { 'runner-cli.exe' } else { 'runner-cli' }
          $cli = Join-Path $env:RUNNER_TEMP 'runner-cli' $cliName
          if (Test-Path $cli) {
            Write-Host 'Validating contract with runner-cli …'
            & $cli validate-contract --contract-path $env:LVIE_RUNNER_CONTRACT_PATH
          } else {
            if ($env:LVIE_REQUIRE_RUNNER_CLI -eq '1') {
              throw "LVIE_REQUIRE_RUNNER_CLI=1 but runner-cli was not available."
            }
            Write-Host 'runner-cli not found; using PowerShell fallback.'
            pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\Validate-RunnerContract.ps1"
          }
