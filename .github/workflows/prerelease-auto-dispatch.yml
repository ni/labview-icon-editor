name: Prerelease Auto Dispatch

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  dispatch-prerelease:
    name: Dispatch deterministic prerelease publish
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: eligibility
        name: Evaluate merged-PR merge-commit eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const sha = String(context.payload.workflow_run.head_sha || '').toLowerCase();
            if (!sha) {
              core.setOutput('should_dispatch', 'false');
              core.setOutput('reason', 'missing-sha');
              return;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const parentCount = Array.isArray(commit.data.parents) ? commit.data.parents.length : 0;
            if (parentCount < 2) {
              core.setOutput('should_dispatch', 'false');
              core.setOutput('reason', 'not-merge-commit');
              return;
            }

            const pullResponse = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            const mergedDevelopPr = (pullResponse.data || []).find((pr) => {
              const merged = !!pr.merged_at;
              const baseRef = pr.base && pr.base.ref;
              const mergeSha = String(pr.merge_commit_sha || '').toLowerCase();
              return merged && baseRef === 'develop' && mergeSha === sha;
            });

            if (!mergedDevelopPr) {
              core.setOutput('should_dispatch', 'false');
              core.setOutput('reason', 'no-merged-develop-pr-association');
              return;
            }

            core.setOutput('should_dispatch', 'true');
            core.setOutput('reason', 'eligible-merged-develop-pr-merge-commit');
            core.setOutput('merged_pr_number', String(mergedDevelopPr.number));

      - name: Skip ineligible source run
        if: ${{ steps.eligibility.outputs.should_dispatch != 'true' }}
        shell: pwsh
        run: |
          Write-Host ("Skipping auto dispatch: {0}" -f '${{ steps.eligibility.outputs.reason }}')

      - name: Dispatch CI Pipeline prerelease publish
        if: ${{ steps.eligibility.outputs.should_dispatch == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $result = & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Invoke-DeterministicPrereleasePublish.ps1" `
            -RepoRoot "$env:GITHUB_WORKSPACE" `
            -Repo "$env:REPO_NAME" `
            -Sha "$env:SOURCE_SHA" `
            -ReleasePriority

          if ($null -eq $result) {
            throw 'Deterministic prerelease dispatch did not return a result object.'
          }

          Write-Host ("Auto dispatch complete. Source SHA: {0}" -f $result.sha)
          if (-not [string]::IsNullOrWhiteSpace([string]$result.run_url)) {
            Write-Host ("Dispatched run URL: {0}" -f $result.run_url)
          } else {
            Write-Warning 'Dispatched run URL was not resolved within lookup window.'
          }

