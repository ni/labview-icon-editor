          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Audit VIPC apply (LV x86)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & "$env:REPO_ROOT\\Tooling\\Assert-VipcApplied.ps1" `
            -RepoRoot "$env:REPO_ROOT" `
            -VIPCPath ".github/actions/apply-vipc/runner_dependencies.vipc" `
            -SupportedBitness 32 `
            -OutputPath "$env:REPO_ROOT\\builds\\status\\vipc-audit-32.json"
      - name: Report VIPC change status (LV x86)
        shell: pwsh
        run: |
          if ('${{ needs.changes.outputs.vipc }}' -eq 'true') {
            Write-Host ".vipc changes detected for this run."
          } else {
            Write-Host "No .vipc changes detected; audit-first policy still enforced."
          }
      - name: Apply VIPC (LV x86, informational)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $logPath = Join-Path $env:REPO_ROOT 'builds\status\vipc-apply-32.log'
          $logDir = Split-Path -Path $logPath -Parent
          if (-not (Test-Path -Path $logDir)) {
            New-Item -Path $logDir -ItemType Directory -Force | Out-Null
          }

          '' | Set-Content -Path $logPath -Encoding utf8
          $output = & ".github\\actions\\apply-vipc\\ApplyVIPC.ps1" `
            -SupportedBitness 32 `
            -RepoRoot "$env:REPO_ROOT" `
            -VIPCPath ".github/actions/apply-vipc/runner_dependencies.vipc" *>&1
          $exitCode = $LASTEXITCODE

          if ($output) {
            $output |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $logPath -Append |
              ForEach-Object { Write-Host $_ }
          }

          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - name: Upload VIPC audit artifact (LV x86)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-audit-32
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-audit-32.json
          if-no-files-found: warn
      - name: Upload VIPC apply log artifact (LV x86)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-apply-log-32
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-apply-32.log
          if-no-files-found: warn
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown

  version:
    name: Compute Version
    needs: [run-metadata, version-gate, prerelease-context]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    outputs:
      VERSION:       ${{ steps.compute.outputs.VERSION }}
      MAJOR:         ${{ steps.compute.outputs.MAJOR }}
      MINOR:         ${{ steps.compute.outputs.MINOR }}
      PATCH:         ${{ steps.compute.outputs.PATCH }}
      BUILD:         ${{ steps.compute.outputs.BUILD }}
      IS_PRERELEASE: ${{ steps.compute.outputs.IS_PRERELEASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          create_worktree: 'false'
      - name: Fail on conflicting merged PR release labels
        if: ${{ needs.prerelease-context.outputs.bump_conflict == 'true' }}
        shell: pwsh
        run: |
          $labels = '${{ needs.prerelease-context.outputs.bump_conflict_labels }}'
          $prNumber = '${{ needs.prerelease-context.outputs.merged_pr_number }}'
          if ([string]::IsNullOrWhiteSpace($prNumber)) {
            throw ("Conflicting merged PR release labels detected: {0}" -f $labels)
          }
          throw ("Conflicting merged PR release labels detected on merged PR #{0}: {1}" -f $prNumber, $labels)
      - id: compute
        uses: ./.github/actions/compute-version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bump_type_override: ${{ needs.prerelease-context.outputs.bump_type_override }}
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          cleanup_worktree: 'false'

  # Stage 3: Self-hosted LabVIEW validation/build chain (profile-gated).
  unit-tests:
    name: Test Source Using LV ${{ matrix.bitness }}-bit
    if: ${{ needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
    needs: [run-metadata, prerelease-context, version-gate, apply-deps-x86]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bitness: ${{ fromJson('["64"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: ${{ matrix.bitness }}
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Test Source Using LV ${{ matrix.bitness }}-bit
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $reportPath = Join-Path $env:REPO_ROOT '.github/actions/run-unit-tests/UnitTestReport.xml'
          if (Test-Path -Path $reportPath) {
            Remove-Item -Path $reportPath -Force -ErrorAction SilentlyContinue
          }

          & g-cli --lv-ver $env:LABVIEW_VERSION_YEAR --arch ${{ matrix.bitness }} lunit -- -r $reportPath "$env:PROJECT_PATH"
          $gcliExitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
          Write-Host ("g-cli lunit exit code: {0}" -f $gcliExitCode)

          & pwsh -NoProfile -File ".github/actions/run-unit-tests/RunUnitTests.ps1" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -SupportedBitness ${{ matrix.bitness }} `
            -ReportPath $reportPath
          $parserExitCode = if ($null -eq $LASTEXITCODE) { 0 } else { [int]$LASTEXITCODE }
          Write-Host ("RunUnitTests parser exit code: {0}" -f $parserExitCode)

          if ($gcliExitCode -ne 0) {
            exit $gcliExitCode
          }

          exit $parserExitCode
      - name: Summarize unit-test executor
        if: always()
        shell: pwsh
        run: |
          $summaryLine = "- Unit Tests (LV {0}-bit): LUnit executor = g-cli" -f '${{ matrix.bitness }}'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryLine
      - name: Upload unit test report (LV ${{ matrix.bitness }}-bit)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.bitness }}-bit-report
          path: ${{ env.REPO_ROOT }}/.github/actions/run-unit-tests/UnitTestReport.xml
          if-no-files-found: warn
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          revert_bitness: ${{ matrix.bitness }}
          close_labview: 'true'
          close_bitness: ${{ matrix.bitness }}

  build-ppl-x86:
    name: Build 32-bit Packed Library
    if: ${{ needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
    needs: [run-metadata, prerelease-context, version-gate, build-ppl-x64, version]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 32
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Build PPL (LV 32-bit)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & ".github/actions/build-lvlibp/BuildProjectSpec.ps1" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -SupportedBitness 32 `
            -RepoRoot "$env:REPO_ROOT" `
            -Major ${{ needs.version.outputs.MAJOR }} `
            -Minor ${{ needs.version.outputs.MINOR }} `
            -Patch ${{ needs.version.outputs.PATCH }} `
            -Build ${{ needs.version.outputs.BUILD }} `
            -Commit "${{ github.sha }}"
      - name: Rename PPL (LV 32-bit)
        shell: pwsh
        run: |
          & "$env:REPO_ROOT\\.github\\actions\\rename-file\\Rename-file.ps1" `
            -CurrentFilename "$env:REPO_ROOT\\resource\\plugins\\lv_icon.lvlibp" `
            -NewFilename "$env:REPO_ROOT\\resource\\plugins\\lv_icon_x86.lvlibp"
      - name: Upload packed library artifact (32-bit)
        uses: actions/upload-artifact@v4
        with:
          name: lv_icon_x86.lvlibp
          path: ${{ env.REPO_ROOT }}/resource/plugins/lv_icon_x86.lvlibp
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          revert_bitness: 32
          close_labview: 'true'
          close_bitness: 32

  build-ppl-x64:
    name: Build 64-bit Packed Library
    if: ${{ needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
    needs: [run-metadata, prerelease-context, version-gate, unit-tests, version]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 64
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Build PPL (LV 64-bit)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & ".github/actions/build-lvlibp/BuildProjectSpec.ps1" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -SupportedBitness 64 `
            -RepoRoot "$env:REPO_ROOT" `
            -Major ${{ needs.version.outputs.MAJOR }} `
            -Minor ${{ needs.version.outputs.MINOR }} `
            -Patch ${{ needs.version.outputs.PATCH }} `
            -Build ${{ needs.version.outputs.BUILD }} `
            -Commit "${{ github.sha }}"
      - name: Rename PPL (LV 64-bit)
        shell: pwsh
        run: |
          & "$env:REPO_ROOT\\.github\\actions\\rename-file\\Rename-file.ps1" `
            -CurrentFilename "$env:REPO_ROOT\\resource\\plugins\\lv_icon.lvlibp" `
            -NewFilename "$env:REPO_ROOT\\resource\\plugins\\lv_icon_x64.lvlibp"
      - name: Upload packed library artifact (64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: lv_icon_x64.lvlibp
          path: ${{ env.REPO_ROOT }}/resource/plugins/lv_icon_x64.lvlibp
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          revert_bitness: 64
          close_labview: 'true'
          close_bitness: 64

  build-vip:
    name: Build VI Package
    if: ${{ needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
    # Chain after 32-bit PPL build (which depends on 64-bit PPL build).
    needs: [run-metadata, prerelease-context, version-gate, build-ppl-x86, version]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    outputs:
      vip_status_exists: ${{ steps.vip-status.outputs.exists }}
      vip_artifact_name: ${{ steps.locate-vip.outputs.vip_artifact }}
      vip_file_name: ${{ steps.locate-vip.outputs.vip_name }}
      release_notes_artifact_name: ${{ steps.release-notes.outputs.artifact_name }}
      release_notes_file_name: ${{ steps.release-notes.outputs.asset_name }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_VIPM_TIMEOUT_SECONDS: 900
      LVIE_VIPM_MAX_ATTEMPTS: 2
      LVIE_VIPM_RETRY_DELAY_SECONDS: 30
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 64
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Generate release notes
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & ".github/actions/generate-release-notes/GenerateReleaseNotes.ps1" -OutputPath "Tooling/deployment/release_notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: lv_icon_x86.lvlibp
          path: ${{ env.REPO_ROOT }}/resource/plugins
      - uses: actions/download-artifact@v4
        with:
          name: lv_icon_x64.lvlibp
          path: ${{ env.REPO_ROOT }}/resource/plugins
      - name: Generate display information JSON
        id: display-info
        shell: pwsh
        env:
          RELEASE_NOTES_PATH: ${{ env.REPO_ROOT }}/Tooling/deployment/release_notes.md
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESCRIPTION: ${{ github.event.repository.description }}
          REPO_URL: ${{ github.event.repository.html_url }}
          COMPANY: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $releaseNotes = if (Test-Path $Env:RELEASE_NOTES_PATH) {
            Get-Content -Raw -Path $Env:RELEASE_NOTES_PATH
          } else {
            "Release notes file not generated."
          }

          $productName = if ([string]::IsNullOrWhiteSpace($Env:REPO_NAME)) {
            $Env:REPOSITORY
          } else {
            $Env:REPO_NAME
          }

          $description = if ([string]::IsNullOrWhiteSpace($Env:REPO_DESCRIPTION)) {
            "$($Env:REPO_NAME) VI Package build for $($Env:REPOSITORY)."
          } else {
            $Env:REPO_DESCRIPTION
          }

          $info = @{
            "Package Version" = @{
              "major" = ${{ needs.version.outputs.MAJOR }}
              "minor" = ${{ needs.version.outputs.MINOR }}
              "patch" = ${{ needs.version.outputs.PATCH }}
              "build" = ${{ needs.version.outputs.BUILD }}
            }
            "Product Name" = $productName
            "Company Name" = $Env:COMPANY
            "Author Name (Person or Company)" = $Env:REPOSITORY
            "Product Homepage (URL)" = if ([string]::IsNullOrWhiteSpace($Env:REPO_URL)) {
              "https://github.com/$($Env:REPOSITORY)"
            } else {
              $Env:REPO_URL
            }
            "Legal Copyright" = "? $(Get-Date -Format yyyy) $($Env:COMPANY)"
            "Product Description Summary" = $description
            "Product Description" = $description
            "Release Notes - Change Log" = $releaseNotes
          }

          $json = $info | ConvertTo-Json -Depth 5 -Compress
          "json=$json" >> $Env:GITHUB_OUTPUT
      - name: Modify VIPB display info (LV 64-bit)
        shell: pwsh
        env:
          DISPLAY_INFORMATION_JSON: |
            ${{ steps.display-info.outputs.json }}
        run: |
          $displayInformationJson = $Env:DISPLAY_INFORMATION_JSON
          & "$env:REPO_ROOT\\.github\\actions\\modify-vipb-display-info\\ModifyVIPBDisplayInfo.ps1" `
            -SupportedBitness 64 `
            -RepoRoot "$env:REPO_ROOT" `
            -VIPBPath "Tooling/deployment/NI Icon editor.vipb" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -LabVIEWMinorRevision $env:LABVIEW_MINOR_REVISION `
            -Major ${{ needs.version.outputs.MAJOR }} `
            -Minor ${{ needs.version.outputs.MINOR }} `
            -Patch ${{ needs.version.outputs.PATCH }} `
            -Build ${{ needs.version.outputs.BUILD }} `
            -Commit "${{ github.sha }}" `
            -ReleaseNotesFile "$env:REPO_ROOT\\Tooling\\deployment\\release_notes.md" `
            -DisplayInformationJSON $displayInformationJson
      - name: Build VI Package (LV 64-bit)
        shell: pwsh
        env:
          DISPLAY_INFORMATION_JSON: |
            ${{ steps.display-info.outputs.json }}
        run: |
          $displayInformationJson = $Env:DISPLAY_INFORMATION_JSON
          & "$env:REPO_ROOT\\Tooling\\Invoke-VipBuild.ps1" `
            -SupportedBitness 64 `
            -RepoRoot "$env:REPO_ROOT" `
            -VIPBPath "Tooling/deployment/NI Icon editor.vipb" `
            -LabVIEWVersion $env:LABVIEW_VERSION_YEAR `
            -LabVIEWMinorRevision $env:LABVIEW_MINOR_REVISION `
            -Major ${{ needs.version.outputs.MAJOR }} `
            -Minor ${{ needs.version.outputs.MINOR }} `
            -Patch ${{ needs.version.outputs.PATCH }} `
            -Build ${{ needs.version.outputs.BUILD }} `
            -Commit "${{ github.sha }}" `
            -ReleaseNotesFile "$env:REPO_ROOT\\Tooling\\deployment\\release_notes.md" `
            -DisplayInformationJSON $displayInformationJson `
            -VipmTimeoutSeconds $env:LVIE_VIPM_TIMEOUT_SECONDS
      - name: Check VIP build status file
        id: vip-status
        shell: pwsh
        run: |
          $statusRoot = if (-not [string]::IsNullOrWhiteSpace($env:LVIE_ARTIFACT_ROOT)) { $env:LVIE_ARTIFACT_ROOT } else { $env:REPO_ROOT }
          $statusPath = Join-Path $statusRoot 'builds/status/vip-build.json'
          $exists = Test-Path -Path $statusPath
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
      - name: Upload VIP build status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-build-status
          path: ${{ env.LVIE_ARTIFACT_ROOT || env.REPO_ROOT }}/builds/status/vip-build.json
          if-no-files-found: warn
      - name: Prepare release notes artifact
        id: release-notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:REPO_ROOT\\Tooling\\deployment\\release_notes.md"
          if (-not (Test-Path $source)) {
            Write-Error "Release notes file not found at $source."
            exit 1
          }

          $version = "{0}.{1}.{2}.{3}" -f "${{ needs.version.outputs.MAJOR }}", "${{ needs.version.outputs.MINOR }}", "${{ needs.version.outputs.PATCH }}", "${{ needs.version.outputs.BUILD }}"
          $destName = "release_notes_{0}.md" -f $version
          $artifactName = "release_notes_{0}" -f $version
          $destPath = Join-Path -Path (Split-Path -Parent $source) -ChildPath $destName

          Copy-Item -LiteralPath $source -Destination $destPath -Force
          Write-Host ("Release notes artifact prepared at {0}" -f $destPath)

          "artifact_path=$destPath" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "artifact_name=$artifactName" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "asset_name=$destName" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
      - name: Locate built VI package
        id: locate-vip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vipDir = Join-Path -Path $env:REPO_ROOT -ChildPath "builds/VI Package"
          if (-not (Test-Path $vipDir)) {
            Write-Error "VI Package directory not found at '$vipDir'."
            exit 1
          }

          $vipFiles = Get-ChildItem -Path $vipDir -Filter *.vip -File -Recurse | Sort-Object LastWriteTime -Descending
          if (-not $vipFiles) {
            Write-Error "No .vip file found under '$vipDir'."
            exit 1
          }

          if ($vipFiles.Count -gt 1) {
            Write-Warning ("Multiple .vip files found; selecting most recent (by LastWriteTime). Files:`n{0}" -f ($vipFiles | ForEach-Object { " - $($_.FullName)" } | Out-String))
          }

          $vip = $vipFiles[0]
          Write-Host ("Selected .vip: {0}" -f $vip.FullName)

          "vip_path=$($vip.FullName)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "vip_name=$($vip.Name)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "vip_artifact=$([System.IO.Path]::GetFileNameWithoutExtension($vip.Name))" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
      - name: Inspect VI Package contents (zip paths)
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:REPO_ROOT\\Tooling\\Inspect-VipPackage.ps1" `
            -VipPath "${{ steps.locate-vip.outputs.vip_path }}" `
            -WriteSummary
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-notes.outputs.artifact_name }}
          path: ${{ steps.release-notes.outputs.artifact_path }}
          compression-level: 0
          if-no-files-found: error
      - name: Upload VI Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate-vip.outputs.vip_artifact }}
          path: ${{ steps.locate-vip.outputs.vip_path }}
          if-no-files-found: error
      - name: Ensure LabVIEWCLI logs evidence exists
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logsDir = Join-Path $env:REPO_ROOT 'builds/logs'
          New-Item -Path $logsDir -ItemType Directory -Force | Out-Null

          $existingFiles = Get-ChildItem -Path $logsDir -Recurse -File -ErrorAction SilentlyContinue
          if (-not $existingFiles) {
            $placeholderPath = Join-Path $logsDir 'labviewcli-logs-placeholder.txt'
            $runUrl = "{0}/{1}/actions/runs/{2}" -f $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_RUN_ID
            @(
              'No LabVIEWCLI log files were produced by this run.'
              'This placeholder preserves the prerelease labviewcli-logs asset contract.'
              ("Run URL: {0}" -f $runUrl)
              ("Generated UTC: {0}" -f (Get-Date).ToUniversalTime().ToString('o'))
            ) | Out-File -FilePath $placeholderPath -Encoding utf8
            Write-Host ("Created LabVIEWCLI logs placeholder at {0}" -f $placeholderPath)
          }
      - name: Upload LabVIEWCLI logs (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labviewcli-logs
          path: ${{ env.REPO_ROOT }}/builds/logs
          if-no-files-found: error
      - name: Validate tag matches computed version (if provided)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.dispatch_tag != ''
        shell: pwsh
        env:
          EXPECTED_TAG: v${{ needs.version.outputs.MAJOR }}.${{ needs.version.outputs.MINOR }}.${{ needs.version.outputs.PATCH }}.${{ needs.version.outputs.BUILD }}
          REF_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          INPUT_TAG: ${{ github.event.inputs.dispatch_tag || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $provided = if (-not [string]::IsNullOrWhiteSpace($Env:INPUT_TAG)) { $Env:INPUT_TAG } else { $Env:REF_TAG }
          if ([string]::IsNullOrWhiteSpace($provided)) {
            Write-Host 'No tag provided; skipping validation.'
            exit 0
          }
          if ($provided -ne $Env:EXPECTED_TAG) {
            Write-Error ("Provided tag '{0}' does not match computed tag '{1}'." -f $provided, $Env:EXPECTED_TAG)
          } else {
            Write-Host ("Tag validation ok: {0}" -f $provided)
          }
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown
        with:
          close_labview: 'true'
          close_bitness: 64

  build-ppl-linux-container:
    name: Build Linux Container Packed Library
    needs: [run-metadata, prerelease-context, version]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.asset-meta.outputs.artifact_name }}
      asset_name: ${{ steps.asset-meta.outputs.asset_name }}
    steps:
      - id: asset-meta
        name: Resolve Linux packed library artifact names
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.VERSION }}'
          if [[ -z "$version" ]]; then
            echo "Version output is required to name Linux packed library asset." >&2
            exit 1
          fi

          asset_name="lv_icon_linux_${version}.lvlibp"
          artifact_name="lv_icon_linux_container"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Skip Linux packed library build when publish intent is disabled
        if: ${{ needs.prerelease-context.outputs.should_publish != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping Linux packed library build because prerelease publish intent is disabled."
          echo "- Linux packed library build: skipped (prerelease publish disabled)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/checkout@v4

      - name: Pull LabVIEW Linux image
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: bash
        env:
          LV_RELEASE: 2026q1
        run: |
          set -euo pipefail
          image="nationalinstruments/labview:${LV_RELEASE}-linux"
          echo "Using image: ${image}"
          docker pull "${image}"
          echo "LABVIEW_LINUX_IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Build Linux packed library via LabVIEWCLI container parity script
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Tooling/container-parity/runlabview-linux.sh

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e LVIE_REPO_ROOT=/workspace \
            -e WORKSPACE_ROOT=/workspace \
            -e REPO_ROOT=/workspace \
            -e "LVIE_PROJECT_RELATIVE_PATH=lv_icon_editor.lvproj" \
            -e "PROJECT_PATH_REL=lv_icon_editor.lvproj" \
            -e "LVIE_PROJECT_PATH=/workspace/lv_icon_editor.lvproj" \
            -e "PROJECT_PATH=/workspace/lv_icon_editor.lvproj" \
            -e "TARGET_DIR_REL=Test/Templates" \
            -e "CONTAINER_PARITY_EXCLUDE_FILES=Polymorphic Template.vi" \
            -e "CONTAINER_PARITY_BUILD_SPEC=true" \
            -e "CONTAINER_PARITY_BUILD_SPEC_NAME=Editor Packed Library" \
            -e "CONTAINER_PARITY_TARGET_NAME=My Computer" \
            -e "CONTAINER_PARITY_BUILD_OUTPUT_RELATIVE_PATH=resource/plugins/lv_icon.lvlibp" \
            -e "CONTAINER_PARITY_LABVIEW_VERSION=2026" \
            "$LABVIEW_LINUX_IMAGE" \
            bash -lc "chmod +x /workspace/Tooling/container-parity/runlabview-linux.sh && /workspace/Tooling/container-parity/runlabview-linux.sh"

      - id: prepare-linux-ppl
        name: Prepare Linux packed library release asset
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          source_path="${GITHUB_WORKSPACE}/resource/plugins/lv_icon.lvlibp"
          if [[ ! -f "$source_path" ]]; then
            echo "Expected Linux packed library not found: $source_path" >&2
            exit 1
          fi

          asset_name='${{ steps.asset-meta.outputs.asset_name }}'
          if [[ -z "$asset_name" ]]; then
            echo "Linux packed library asset_name output is empty." >&2
            exit 1
          fi

          dest_dir="${RUNNER_TEMP}/prerelease-linux-ppl"
          mkdir -p "$dest_dir"
          dest_path="${dest_dir}/${asset_name}"
          cp "$source_path" "$dest_path"

          bytes="$(wc -c < "$dest_path" | xargs)"
          echo "Prepared Linux packed library release asset: $dest_path ($bytes bytes)"
          echo "asset_path=$dest_path" >> "$GITHUB_OUTPUT"

      - name: Upload Linux packed library artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset-meta.outputs.artifact_name }}
          path: ${{ steps.prepare-linux-ppl.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload Linux container logs
        if: ${{ always() && needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-container-ppl-logs
          path: TestResults/container-parity/linux/logs
          if-no-files-found: warn

  build-ppl-windows-container:
    name: Build Windows Container Packed Library
    needs: [run-metadata, prerelease-context, version]
    runs-on: windows-latest
    outputs:
      artifact_name: ${{ steps.asset-meta.outputs.artifact_name }}
      asset_name: ${{ steps.asset-meta.outputs.asset_name }}
    steps:
      - id: asset-meta
        name: Resolve Windows packed library artifact names
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.VERSION }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version output is required to name Windows packed library asset."
          }

          $assetName = "lv_icon_windows_{0}.lvlibp" -f $version
          $artifactName = 'lv_icon_windows_container'

          "asset_name=$assetName" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "artifact_name=$artifactName" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Skip Windows packed library build when publish intent is disabled
        if: ${{ needs.prerelease-context.outputs.should_publish != 'true' }}
        shell: pwsh
        run: |
          Write-Host "Skipping Windows packed library build because prerelease publish intent is disabled."
          "- Windows packed library build: skipped (prerelease publish disabled)." | Out-File -FilePath $Env:GITHUB_STEP_SUMMARY -Append

      - name: Checkout code
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/checkout@v4

      - name: Pull LabVIEW Windows image
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          $image = 'nationalinstruments/labview:2026q1-windows'
          Write-Host "Using image: $image"
          docker pull $image
          "LABVIEW_WINDOWS_IMAGE=$image" | Out-File -FilePath $Env:GITHUB_ENV -Append

      - name: Validate path contract for Windows container shell
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          Write-Host 'Windows container parity script runs under powershell.exe (Windows PowerShell 5.1) inside the NI container.'
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\Tooling\Test-PathContract.ps1" -WriteSummary

      - name: Build Windows packed library via LabVIEWCLI container parity script
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          docker run --rm `
            -v "${env:GITHUB_WORKSPACE}:C:\workspace" `
            -e LVIE_REPO_ROOT=C:\workspace `
            -e WORKSPACE_ROOT=C:\workspace `
            -e REPO_ROOT=C:\workspace `
            -e "LVIE_PROJECT_RELATIVE_PATH=lv_icon_editor.lvproj" `
            -e "PROJECT_PATH_REL=lv_icon_editor.lvproj" `
            -e "LVIE_PROJECT_PATH=C:\workspace\lv_icon_editor.lvproj" `
            -e "PROJECT_PATH=C:\workspace\lv_icon_editor.lvproj" `
            -e "TARGET_DIR_REL=Test\Templates" `
            -e "CONTAINER_PARITY_EXCLUDE_FILES=Polymorphic Template.vi" `
            -e "CONTAINER_PARITY_BUILD_SPEC=true" `
            -e "CONTAINER_PARITY_BUILD_SPEC_NAME=Editor Packed Library" `
            -e "CONTAINER_PARITY_TARGET_NAME=My Computer" `
            -e "CONTAINER_PARITY_BUILD_OUTPUT_RELATIVE_PATH=resource\plugins\lv_icon.lvlibp" `
            -e "CONTAINER_PARITY_LABVIEW_VERSION=2026" `
            $env:LABVIEW_WINDOWS_IMAGE `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\workspace\Tooling\container-parity\runlabview-windows.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Windows container parity run failed with exit code $LASTEXITCODE."
          }

      - id: prepare-windows-ppl
        name: Prepare Windows packed library release asset
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: pwsh
        run: |
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE 'resource\plugins\lv_icon.lvlibp'
          if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
            throw "Expected Windows packed library not found: $sourcePath"
          }

          $assetName = '${{ steps.asset-meta.outputs.asset_name }}'
          if ([string]::IsNullOrWhiteSpace($assetName)) {
            throw 'Windows packed library asset_name output is empty.'
          }

          $destDir = Join-Path $env:RUNNER_TEMP 'prerelease-windows-ppl'
          New-Item -Path $destDir -ItemType Directory -Force | Out-Null
          $destPath = Join-Path $destDir $assetName
          Copy-Item -LiteralPath $sourcePath -Destination $destPath -Force

          $item = Get-Item -LiteralPath $destPath
          Write-Host ("Prepared Windows packed library release asset: {0} ({1} bytes)" -f $item.FullName, $item.Length)
          "asset_path=$destPath" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Upload Windows packed library artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset-meta.outputs.artifact_name }}
          path: ${{ steps.prepare-windows-ppl.outputs.asset_path }}
          if-no-files-found: error

      - name: Upload Windows container logs
        if: ${{ always() && needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-container-ppl-logs
          path: TestResults/container-parity/windows/logs
          if-no-files-found: warn

  codex-skill-layer-asset:
    name: Resolve Codex Skill Layer Asset
    needs: [run-metadata, prerelease-context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      asset_file_name: ${{ steps.meta.outputs.asset_file_name }}
    steps:
      - id: meta
        name: Resolve artifact metadata
        shell: pwsh
        run: |
          "artifact_name=codex-skill-layer" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "asset_file_name=lvie-codex-skill-layer.zip" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Checkout code
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/checkout@v4

      - id: resolve
        name: Download and validate pinned skill layer
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lockPath = Join-Path $env:GITHUB_WORKSPACE 'Tooling/codex-skill-layer.lock.json'
          if (-not (Test-Path -Path $lockPath -PathType Leaf)) {
            throw "Codex skill lock file not found: $lockPath"
          }

          $lock = Get-Content -Raw -Path $lockPath | ConvertFrom-Json
          foreach ($key in @('repo', 'tag', 'asset_name', 'sha256', 'required_files', 'license_spdx')) {
            if (-not ($lock.PSObject.Properties.Name -contains $key)) {
              throw "Codex skill lock file is missing required key '$key'."
            }
          }

          $destDir = Join-Path $env:RUNNER_TEMP 'prerelease-codex-skill-layer'
          New-Item -Path $destDir -ItemType Directory -Force | Out-Null

          gh release download $lock.tag --repo $lock.repo --pattern $lock.asset_name --dir $destDir --clobber
          if ($LASTEXITCODE -ne 0) {
            throw ("Failed to download codex skill layer asset '{0}' from {1} tag {2}." -f $lock.asset_name, $lock.repo, $lock.tag)
          }

          $assetPath = Join-Path $destDir $lock.asset_name
          if (-not (Test-Path -Path $assetPath -PathType Leaf)) {
            throw "Downloaded codex skill layer asset is missing at $assetPath"
          }

          $actualHash = (Get-FileHash -Path $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = ([string]$lock.sha256).ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw ("Codex skill layer hash mismatch. expected={0} actual={1}" -f $expectedHash, $actualHash)
          }

          $extractDir = Join-Path $destDir 'extract'
          Expand-Archive -Path $assetPath -DestinationPath $extractDir -Force

          $manifestPath = Join-Path $extractDir 'manifest.json'
          if (-not (Test-Path -Path $manifestPath -PathType Leaf)) {
            throw "Codex skill layer manifest missing: $manifestPath"
          }

          $manifest = Get-Content -Raw -Path $manifestPath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$manifest.license_spdx) -or [string]$manifest.license_spdx -ne [string]$lock.license_spdx) {
            throw ("Codex skill layer license mismatch. expected={0} actual={1}" -f [string]$lock.license_spdx, [string]$manifest.license_spdx)
          }

          foreach ($relative in @($lock.required_files)) {
            $requiredPath = Join-Path $extractDir ([string]$relative)
            if (-not (Test-Path -Path $requiredPath)) {
              throw ("Codex skill layer required file missing: {0}" -f $relative)
            }
          }

          "asset_path=$assetPath" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Upload codex skill layer artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.resolve.outputs.asset_path }}
          if-no-files-found: error

  publish-gate:
    name: Publish Gate
    if: always()
    needs:
      - run-metadata
      - prerelease-context
      - version-gate
      - powershell-lint
      - vip-prerelease-requirements-lint
      - pylavi-validate
      - changes
      - apply-deps-lv-x64
      - apply-deps-x86
      - unit-tests
      - build-ppl-x64
      - build-ppl-x86
      - build-ppl-linux-container
      - build-ppl-windows-container
      - codex-skill-layer-asset
      - build-vip
      - version
      - conformance-full
    runs-on: ubuntu-latest
    outputs:
      gate_reason: ${{ steps.gate.outputs.gate_reason }}
      ci_profile: ${{ steps.gate.outputs.ci_profile }}
    steps:
      - id: gate
        name: Evaluate profile-required prepublish jobs
        shell: pwsh
        run: |
          $shouldPublish = '${{ needs.prerelease-context.outputs.should_publish }}' -eq 'true'
          $ciProfile = '${{ needs.prerelease-context.outputs.ci_profile }}'
          if ([string]::IsNullOrWhiteSpace($ciProfile)) {
            Write-Warning 'ci_profile output was empty; defaulting to full for prepublish gating.'
            $ciProfile = 'full'
          }

          "ci_profile=$ciProfile" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

          if (-not $shouldPublish) {
            "gate_reason=publish-intent-disabled" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
            Write-Host 'Publish intent is disabled for this run; prepublish gate passes by policy.'
            exit 0
          }

          $requiredCommon = @(
            'run-metadata',
            'prerelease-context',
            'version-gate',
            'powershell-lint',
            'vip-prerelease-requirements-lint',
            'pylavi-validate',
            'build-ppl-linux-container',
            'build-ppl-windows-container',
            'codex-skill-layer-asset',
            'version',
            'conformance-full'
          )
          $requiredFullValidation = @(
            'changes',
            'apply-deps-lv-x64',
            'apply-deps-x86',
            'unit-tests',
            'build-ppl-x64',
            'build-ppl-x86',
            'build-vip'
          )
          $requiredByProfile = @{
            'full' = @($requiredCommon + $requiredFullValidation)
            'pr-fast' = @($requiredCommon + $requiredFullValidation)
            'release-priority' = @($requiredCommon)
          }
          if (-not $requiredByProfile.ContainsKey($ciProfile)) {
            Write-Warning ("Unknown ci_profile '{0}'; defaulting to full prepublish contract." -f $ciProfile)
            $ciProfile = 'full'
            "ci_profile=$ciProfile" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          }

          $required = $requiredByProfile[$ciProfile]
          $needs = ConvertFrom-Json -InputObject '${{ toJson(needs) }}'
          $needsProps = $needs.PSObject.Properties

          $missing = @()
          $failing = @()
          foreach ($job in $required) {
            $entryProp = $needsProps[$job]
            if (-not $entryProp) {
              $missing += "$job:missing"
              continue
            }
            $result = [string]$entryProp.Value.result
            if ($result -ne 'success') {
              $failing += "{0}:{1}" -f $job, $result
            }
          }

          $gatePasses = ($missing.Count -eq 0 -and $failing.Count -eq 0)
          $gateReason = if ($gatePasses) { 'prepublish-required-jobs-satisfied' } else { 'prepublish-required-jobs-failed' }
          "gate_reason=$gateReason" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

          $missingLabel = if ($missing.Count -gt 0) { $missing -join ', ' } else { '<none>' }
          $failingLabel = if ($failing.Count -gt 0) { $failing -join ', ' } else { '<none>' }
          Write-Host ("Prepublish gate profile: {0}" -f $ciProfile)
          Write-Host ("Prepublish gate reason: {0}" -f $gateReason)
          Write-Host ("Missing required jobs: {0}" -f $missingLabel)
          Write-Host ("Failing/non-success required jobs: {0}" -f $failingLabel)

          if (-not $gatePasses) {
            throw ("Publish gate blocked prerelease publication for profile '{0}': missing={1}; failing={2}" -f $ciProfile, $missingLabel, $failingLabel)
          }

  publish-prerelease:
    name: Publish Pre-Release
    if: ${{ always() && needs.publish-gate.result == 'success' && needs.run-metadata.result == 'success' && needs.prerelease-context.result == 'success' && needs.version.result == 'success' && needs.build-ppl-linux-container.result == 'success' && needs.build-ppl-windows-container.result == 'success' && needs.codex-skill-layer-asset.result == 'success' && (needs.prerelease-context.outputs.ci_profile == 'release-priority' || needs.build-vip.result == 'success') }}
    needs: [run-metadata, prerelease-context, version, build-vip, build-ppl-linux-container, build-ppl-windows-container, codex-skill-layer-asset, publish-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_url: ${{ steps.publish.outputs.release_url }}
      release_id: ${{ steps.publish.outputs.release_id }}
      publish_status: ${{ steps.publish.outputs.publish_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Report publish gate decision
        shell: pwsh
        run: |
          Write-Host ("Publish gate reason: {0}" -f '${{ needs.publish-gate.outputs.gate_reason }}')

      - name: Download VI package artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' && needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-vip.outputs.vip_artifact_name }}
          path: ${{ runner.temp }}/prerelease-assets/vip

      - name: Download release notes artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' && needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-vip.outputs.release_notes_artifact_name }}
          path: ${{ runner.temp }}/prerelease-assets/release-notes

      - name: Download LabVIEWCLI logs artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' && needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: labviewcli-logs
          path: ${{ runner.temp }}/prerelease-assets/labviewcli-logs

      - name: Download VIP build status artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' && needs.prerelease-context.outputs.ci_profile != 'release-priority' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vip-build-status
          path: ${{ runner.temp }}/prerelease-assets/vip-build-status

      - name: Download Linux packed library artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ppl-linux-container.outputs.artifact_name }}
          path: ${{ runner.temp }}/prerelease-assets/linux-ppl

      - name: Download Windows packed library artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ppl-windows-container.outputs.artifact_name }}
          path: ${{ runner.temp }}/prerelease-assets/windows-ppl

      - name: Download Codex skill layer artifact
        if: ${{ needs.prerelease-context.outputs.should_publish == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.codex-skill-layer-asset.outputs.artifact_name }}
          path: ${{ runner.temp }}/prerelease-assets/codex-skill-layer

      - id: publish
        name: Publish prerelease and write status
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $statusDir = Join-Path $env:GITHUB_WORKSPACE 'builds/status'
          New-Item -Path $statusDir -ItemType Directory -Force | Out-Null
          $statusPath = Join-Path $statusDir 'prerelease-publish.json'

          $shouldPublish = '${{ needs.prerelease-context.outputs.should_publish }}' -eq 'true'
          $ciProfile = '${{ needs.prerelease-context.outputs.ci_profile }}'
          $releasePriorityMode = $ciProfile -eq 'release-priority'
          $publishMode = '${{ needs.prerelease-context.outputs.publish_mode }}'
          $publishReason = '${{ needs.prerelease-context.outputs.publish_reason }}'
          $publishGateReason = '${{ needs.publish-gate.outputs.gate_reason }}'
          $mergedPrNumber = '${{ needs.prerelease-context.outputs.merged_pr_number }}'
          $tag = '${{ needs.version.outputs.VERSION }}'
          $expectedVipFileName = '${{ needs.build-vip.outputs.vip_file_name }}'
          $expectedReleaseNotesFileName = '${{ needs.build-vip.outputs.release_notes_file_name }}'
          $expectedLinuxPackedLibraryFileName = '${{ needs.build-ppl-linux-container.outputs.asset_name }}'
          $expectedWindowsPackedLibraryFileName = '${{ needs.build-ppl-windows-container.outputs.asset_name }}'
          $expectedCodexSkillLayerFileName = '${{ needs.codex-skill-layer-asset.outputs.asset_file_name }}'

          $publishStatus = 'skipped'
          $releaseUrl = ''
          $releaseId = ''
          $attachedAssets = @()
          $requiredAssets = @()
          $errorMessage = ''

          try {
            if ($shouldPublish) {
              $assetRoot = Join-Path $env:RUNNER_TEMP 'prerelease-assets'
              if ($releasePriorityMode) {
                $requiredAssets = @('linux-packed-library', 'windows-packed-library', 'codex-skill-layer')
              } else {
                $requiredAssets = @('vip', 'release_notes', 'labviewcli-logs', 'vip-build-status', 'linux-packed-library', 'windows-packed-library', 'codex-skill-layer')
              }
              if (-not $releasePriorityMode -and [string]::IsNullOrWhiteSpace($expectedVipFileName)) {
                throw 'Required build-vip output missing: vip_file_name.'
              }
              if (-not $releasePriorityMode -and [string]::IsNullOrWhiteSpace($expectedReleaseNotesFileName)) {
                throw 'Required build-vip output missing: release_notes_file_name.'
              }
              if ([string]::IsNullOrWhiteSpace($expectedLinuxPackedLibraryFileName)) {
                throw 'Required build-ppl-linux-container output missing: asset_name.'
              }
              if ([string]::IsNullOrWhiteSpace($expectedWindowsPackedLibraryFileName)) {
                throw 'Required build-ppl-windows-container output missing: asset_name.'
              }
              if ([string]::IsNullOrWhiteSpace($expectedCodexSkillLayerFileName)) {
                throw 'Required codex-skill-layer-asset output missing: asset_file_name.'
              }

              $vipFile = $null
              $notesFile = $null
              $vipStatusFile = $null
              $labviewcliZip = $null
              $codexSkillLayerFile = $null

              if (-not $releasePriorityMode) {
                $vipFiles = Get-ChildItem -Path (Join-Path $assetRoot 'vip') -Filter $expectedVipFileName -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
                if (-not $vipFiles) { throw ("Required asset missing: expected VIP file '{0}'." -f $expectedVipFileName) }
                $vipFile = $vipFiles[0]

                $notesFiles = Get-ChildItem -Path (Join-Path $assetRoot 'release-notes') -Filter $expectedReleaseNotesFileName -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
                if (-not $notesFiles) { throw ("Required asset missing: expected release notes file '{0}'." -f $expectedReleaseNotesFileName) }
                $notesFile = $notesFiles[0]

                $vipStatusFile = Get-ChildItem -Path (Join-Path $assetRoot 'vip-build-status') -Filter vip-build.json -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if (-not $vipStatusFile) { throw 'Required asset missing: vip-build-status/vip-build.json.' }
              }

              $linuxPackedLibraryFiles = Get-ChildItem -Path (Join-Path $assetRoot 'linux-ppl') -Filter $expectedLinuxPackedLibraryFileName -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
              if (-not $linuxPackedLibraryFiles) { throw ("Required asset missing: expected Linux packed library '{0}'." -f $expectedLinuxPackedLibraryFileName) }
              $linuxPackedLibraryFile = $linuxPackedLibraryFiles[0]

              $windowsPackedLibraryFiles = Get-ChildItem -Path (Join-Path $assetRoot 'windows-ppl') -Filter $expectedWindowsPackedLibraryFileName -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
              if (-not $windowsPackedLibraryFiles) { throw ("Required asset missing: expected Windows packed library '{0}'." -f $expectedWindowsPackedLibraryFileName) }
              $windowsPackedLibraryFile = $windowsPackedLibraryFiles[0]

              $codexSkillLayerFiles = Get-ChildItem -Path (Join-Path $assetRoot 'codex-skill-layer') -Filter $expectedCodexSkillLayerFileName -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
              if (-not $codexSkillLayerFiles) { throw ("Required asset missing: expected codex skill layer '{0}'." -f $expectedCodexSkillLayerFileName) }
              $codexSkillLayerFile = $codexSkillLayerFiles[0]

              if (-not $releasePriorityMode) {
                $labviewcliDir = Join-Path $assetRoot 'labviewcli-logs'
                if (-not (Test-Path $labviewcliDir)) { throw 'Required asset missing: labviewcli-logs artifact.' }
                $labviewcliFiles = Get-ChildItem -Path $labviewcliDir -Recurse -File -ErrorAction SilentlyContinue
                if (-not $labviewcliFiles) { throw 'Required asset missing: labviewcli-logs artifact content.' }
                $labviewcliZip = Join-Path $assetRoot 'labviewcli-logs.zip'
                if (Test-Path $labviewcliZip) {
                  Remove-Item -Path $labviewcliZip -Force
                }
                Compress-Archive -Path (Join-Path $labviewcliDir '*') -DestinationPath $labviewcliZip -Force
              }

              $null = gh --version

              if ($releasePriorityMode) {
                $releaseBody = @(
                  "# Release Priority Prerelease"
                  ''
                  "This prerelease was published in release-priority mode."
                  "Included assets:"
                  "- $($linuxPackedLibraryFile.Name)"
                  "- $($windowsPackedLibraryFile.Name)"
                  "- $($codexSkillLayerFile.Name)"
                ) -join [Environment]::NewLine
              } else {
                $releaseBody = Get-Content -Raw -Path $notesFile.FullName
              }
              $payloadPath = Join-Path $assetRoot 'release-payload.json'
              $payload = [ordered]@{
                tag_name = $tag
                target_commitish = $env:GITHUB_SHA
                name = $tag
                body = $releaseBody
                draft = $false
                prerelease = $true
              }
              $payload | ConvertTo-Json -Depth 8 | Out-File -FilePath $payloadPath -Encoding utf8

              $repo = $env:GITHUB_REPOSITORY
              $existing = $null
              try {
                $existingRaw = gh api --method GET -H "Accept: application/vnd.github+json" "/repos/$repo/releases/tags/$tag" 2>$null
                if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($existingRaw)) {
                  $existing = $existingRaw | ConvertFrom-Json
                }
              } catch {
                $existing = $null
              }

              if ($existing) {
                $releaseRaw = gh api --method PATCH -H "Accept: application/vnd.github+json" "/repos/$repo/releases/$($existing.id)" --input $payloadPath
              } else {
                $releaseRaw = gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$repo/releases" --input $payloadPath
              }

              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseRaw)) {
                throw "Failed to create or update release metadata for tag '$tag'."
              }

              $release = $releaseRaw | ConvertFrom-Json
              $releaseUrl = [string]$release.html_url
              $releaseId = [string]$release.id

              $uploadAssets = @($linuxPackedLibraryFile.FullName, $windowsPackedLibraryFile.FullName, $codexSkillLayerFile.FullName)
              if (-not $releasePriorityMode) {
                $uploadAssets = @($vipFile.FullName, $notesFile.FullName, $labviewcliZip, $vipStatusFile.FullName) + $uploadAssets
              }

              & gh release upload $tag @uploadAssets --clobber
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to upload release assets for tag '$tag'."
              }

              $publishStatus = 'published'
              if ($releasePriorityMode) {
                $attachedAssets = @($linuxPackedLibraryFile.Name, $windowsPackedLibraryFile.Name, $codexSkillLayerFile.Name)
              } else {
                $attachedAssets = @($vipFile.Name, $notesFile.Name, (Split-Path -Path $labviewcliZip -Leaf), $vipStatusFile.Name, $linuxPackedLibraryFile.Name, $windowsPackedLibraryFile.Name, $codexSkillLayerFile.Name)
              }
            } else {
              if ($releasePriorityMode) {
                $requiredAssets = @('linux-packed-library', 'windows-packed-library', 'codex-skill-layer')
              } else {
                $requiredAssets = @('vip', 'release_notes', 'labviewcli-logs', 'vip-build-status', 'linux-packed-library', 'windows-packed-library', 'codex-skill-layer')
              }
            }
          } catch {
            $publishStatus = 'failed'
            $errorMessage = $_.Exception.Message
          } finally {
            $status = [ordered]@{
              run_id = '${{ github.run_id }}'
              run_attempt = '${{ github.run_attempt }}'
              sha = '${{ github.sha }}'
              ref = '${{ github.ref }}'
              event = '${{ github.event_name }}'
              publish_mode = $publishMode
              publish_reason = $publishReason
              publish_gate_reason = $publishGateReason
              ci_profile = $ciProfile
              release_priority_mode = $releasePriorityMode
              should_publish = $shouldPublish
              publish_status = $publishStatus
              version = $tag
              release_tag = $tag
              release_url = $releaseUrl
              release_id = $releaseId
              merged_pr_number = $mergedPrNumber
              required_assets = $requiredAssets
              attached_assets = $attachedAssets
              error = $errorMessage
              generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            }
            $status | ConvertTo-Json -Depth 8 | Out-File -FilePath $statusPath -Encoding utf8

            "release_tag=$tag" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
            "release_url=$releaseUrl" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
            "release_id=$releaseId" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
            "publish_status=$publishStatus" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          }

          if ($publishStatus -eq 'failed') {
            throw $errorMessage
          }

      - name: Upload prerelease publish status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-publish-status
          path: builds/status/prerelease-publish.json
          if-no-files-found: error

      - name: Upload solo release evidence (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-release-evidence
          path: builds/status/solo-release-evidence.json
          if-no-files-found: warn

  pipeline-contract:
    name: Pipeline Contract
    if: always()
    needs:
      - run-metadata
      - prerelease-context
      - version-gate
      - powershell-lint
      - vip-prerelease-requirements-lint
      - pylavi-validate
      - changes
      - apply-deps-lv-x64
      - apply-deps-x86
      - unit-tests
      - build-ppl-x64
      - build-ppl-x86
      - build-ppl-linux-container
      - build-ppl-windows-container
      - codex-skill-layer-asset
      - build-vip
      - publish-gate
      - publish-prerelease
      - version
      - conformance-full
    runs-on: ubuntu-latest
    steps:
      - name: Download VIP build status (if available)
        if: ${{ needs.build-vip.outputs.vip_status_exists == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: vip-build-status
          path: vip-build-status
      - name: Validate required jobs
        shell: pwsh
        run: |
          $requiredCommon = @(
            'run-metadata',
            'prerelease-context',
            'version-gate',
            'powershell-lint',
            'vip-prerelease-requirements-lint',
            'pylavi-validate',
            'build-ppl-linux-container',
            'build-ppl-windows-container',
            'codex-skill-layer-asset',
            'publish-gate',
            'publish-prerelease',
            'version',
            'conformance-full'
          )
          $requiredFullValidation = @(
            'changes',
            'apply-deps-lv-x64',
            'apply-deps-x86',
            'unit-tests',
            'build-ppl-x64',
            'build-ppl-x86',
            'build-vip'
          )
          $requiredByProfile = @{
            'full' = @($requiredCommon + $requiredFullValidation)
            'pr-fast' = @($requiredCommon + $requiredFullValidation)
            'release-priority' = @($requiredCommon)
          }

          $ciProfile = '${{ needs.prerelease-context.outputs.ci_profile }}'
          if ([string]::IsNullOrWhiteSpace($ciProfile)) {
            Write-Warning 'ci_profile output was empty; defaulting to full profile contract.'
            $ciProfile = 'full'
          }
          if (-not $requiredByProfile.ContainsKey($ciProfile)) {
            Write-Warning ("Unknown ci_profile '{0}'; defaulting to full profile contract." -f $ciProfile)
            $ciProfile = 'full'
          }

          $required = $requiredByProfile[$ciProfile]
          Write-Host ("CI profile: {0}" -f $ciProfile)
          Write-Host ("Required jobs ({0}): {1}" -f $required.Count, ($required -join ', '))

          $needs = ConvertFrom-Json -InputObject '${{ toJson(needs) }}'
          $needsProps = $needs.PSObject.Properties
          $missing = @()
          $rootCauseFailures = @()
          $cascaded = @()

          $vipStatus = $null
          $vipStatusPath = Join-Path -Path $PWD -ChildPath 'vip-build-status/vip-build.json'
          if (Test-Path $vipStatusPath) {
            try {
              $vipStatus = Get-Content -Raw -Path $vipStatusPath | ConvertFrom-Json
            } catch {
              Write-Warning "Failed to parse VIP build status file at ${vipStatusPath}: $($_.Exception.Message)"
            }
          }

          function Get-JobEntryLabel {
            param(
              [string]$JobName,
              [string]$Result,
              [object]$VipStatusObject
            )

            if ($JobName -eq 'build-vip' -and $VipStatusObject) {
              $label = if ($VipStatusObject.reason) { $VipStatusObject.reason } elseif ($VipStatusObject.status) { $VipStatusObject.status } else { $null }
              if ($label) {
                return "{0}:{1} ({2})" -f $JobName, $Result, $label
              }
            }

            return "{0}:{1}" -f $JobName, $Result
          }

          foreach ($job in $required) {
            $entryProp = $needsProps[$job]
            if (-not $entryProp) {
              $missing += "$($job):missing"
              continue
            }
            $result = $entryProp.Value.result
            if ($result -ne 'success') {
              $entry = Get-JobEntryLabel -JobName $job -Result $result -VipStatusObject $vipStatus
              if ($result -in @('failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure')) {
                $rootCauseFailures += $entry
              } elseif ($result -eq 'skipped') {
                $cascaded += $entry
              } else {
                $rootCauseFailures += $entry
              }
            }
          }

          $requiredJobVerdict = if ($missing.Count -eq 0 -and $rootCauseFailures.Count -eq 0 -and $cascaded.Count -eq 0) { 'pass' } else { 'fail' }
          $rootCauseLabel = if ($rootCauseFailures.Count -gt 0) { $rootCauseFailures -join ', ' } else { '<none>' }
          $cascadedLabel = if ($cascaded.Count -gt 0) { $cascaded -join ', ' } else { '<none>' }
          $missingLabel = if ($missing.Count -gt 0) { $missing -join ', ' } else { '<none>' }

          Write-Host ("Required job verdict: {0}" -f $requiredJobVerdict)
          Write-Host ("Root-cause failures: {0}" -f $rootCauseLabel)
          Write-Host ("Cascaded/skipped jobs: {0}" -f $cascadedLabel)
          Write-Host ("Missing required jobs: {0}" -f $missingLabel)

          if ($requiredJobVerdict -eq 'fail') {
            Write-Error ("Pipeline contract failed: required-job verdict={0}; root-cause failures={1}; cascaded/skipped={2}; missing={3}" -f $requiredJobVerdict, $rootCauseLabel, $cascadedLabel, $missingLabel)
          } else {
            Write-Host 'Pipeline contract satisfied.'
          }













