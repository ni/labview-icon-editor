name: CI Pipeline (Composite)

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      dispatch_tag:
        description: "Expected tag for this run (optional, for dispatched builds)"
        required: false
        type: string

jobs:
  dev-mode-gate:
    name: Verify IE Paths Gate (2021 ${{ matrix.bitness }}-bit)
    runs-on: self-hosted-windows-lv
    strategy:
      fail-fast: false
      matrix:
        bitness: ["64", "32"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize VerifyIEPaths archive folder
        shell: pwsh
        run: |
          New-Item -Path "$env:RUNNER_TEMP\\verify-iepaths" -ItemType Directory -Force | Out-Null
      - name: Verify IE Paths (2021 ${{ matrix.bitness }}-bit)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ${{ github.workspace }}\Tooling\Invoke-MissingIEFilesFromLVInstall.ps1 `
            -MinimumSupportedLVVersion 2021 `
            -SupportedBitness ${{ matrix.bitness }} `
            -RepoRoot ${{ github.workspace }} `
            -ConnectTimeoutMs 180000 `
            -ProcessTimeoutMs 300000 `
            -StatusFileTimeoutMs 60000 `
            -StatusFileArchiveDirectory "$env:RUNNER_TEMP\\verify-iepaths"
      - name: Upload VerifyIEPaths status (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-iepaths-${{ matrix.bitness }}-bit
          path: ${{ runner.temp }}\verify-iepaths

  changes:
    name: Detect VIPC changes
    needs: dev-mode-gate
    runs-on: ubuntu-latest
    outputs:
      vipc: ${{ steps.filter.outputs.vipc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vipc:
              - '**/*.vipc'

  apply-deps-2021-x64:
    name: Apply VIPC (2021 x64)
    needs: changes
    runs-on: self-hosted-windows-lv
    steps:
      - uses: ./.github/actions/apply-vipc
        if: needs.changes.outputs.vipc == 'true'
        with:
          minimum_supported_lv_version: 2021
          vip_lv_version:               2021
          supported_bitness:            64
          repo_root:                ${{ github.workspace }}
          vipc_path:                    ".github/actions/apply-vipc/runner_dependencies.vipc"
      - run: echo "No .vipc changes detected; skipping dependency application."
        if: needs.changes.outputs.vipc != 'true'

  apply-deps-2021-x86:
    name: Apply VIPC (2021 x86)
    needs: [apply-deps-2021-x64, changes]
    runs-on: self-hosted-windows-lv
    steps:
      - uses: ./.github/actions/apply-vipc
        if: needs.changes.outputs.vipc == 'true'
        with:
          minimum_supported_lv_version: 2021
          vip_lv_version:               2021
          supported_bitness:            32
          repo_root:                ${{ github.workspace }}
          vipc_path:                    ".github/actions/apply-vipc/runner_dependencies.vipc"
      - run: echo "No .vipc changes detected; skipping dependency application."
        if: needs.changes.outputs.vipc != 'true'

  version:
    name: Compute Version
    needs: dev-mode-gate
    runs-on: self-hosted-windows-lv
    outputs:
      VERSION:       ${{ steps.compute.outputs.VERSION }}
      MAJOR:         ${{ steps.compute.outputs.MAJOR }}
      MINOR:         ${{ steps.compute.outputs.MINOR }}
      PATCH:         ${{ steps.compute.outputs.PATCH }}
      BUILD:         ${{ steps.compute.outputs.BUILD }}
      IS_PRERELEASE: ${{ steps.compute.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compute
        uses: ./.github/actions/compute-version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  missing-in-project:
    name: Test Missing-In-Project (2021)
    needs: apply-deps-2021-x86
    uses: ./.github/workflows/test-missing-in-project-windows.yml

  test-2021:
    name: Run Unit Tests (2021 ${{ matrix.bitness }}-bit)
    needs: missing-in-project
    runs-on: self-hosted-windows-lv
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bitness: ["64", "32"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Development Mode (2021 ${{ matrix.bitness }}-bit)
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/actions/set-development-mode/Set_Development_Mode.ps1" `
            -MinimumSupportedLVVersion 2021 `
            -SupportedBitness ${{ matrix.bitness }} `
            -RepoRoot "${{ github.workspace }}"
      - name: Run Unit Tests (2021 ${{ matrix.bitness }}-bit)
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/actions/run-unit-tests/RunUnitTests.ps1" `
            -MinimumSupportedLVVersion 2021 `
            -SupportedBitness ${{ matrix.bitness }} `
            -ProjectPath "${{ github.workspace }}/lv_icon_editor.lvproj"
      - name: Upload unit test report (2021 ${{ matrix.bitness }}-bit)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.bitness }}-bit-report
          path: .github/actions/run-unit-tests/UnitTestReport.xml
          if-no-files-found: warn
      - if: always()
        name: Revert Development Mode (2021 ${{ matrix.bitness }}-bit)
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/actions/revert-development-mode/RevertDevelopmentMode.ps1" `
            -MinimumSupportedLVVersion 2021 `
            -SupportedBitness ${{ matrix.bitness }} `
            -RepoRoot "${{ github.workspace }}"
      - if: always()
        name: Close LabVIEW 2021 ${{ matrix.bitness }}-bit after unit tests
        uses: ./.github/actions/close-labview
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: ${{ matrix.bitness }}

  build-ppl-x86:
    name: Build 32-bit Packed Library
    needs: [build-ppl-x64, version]
    runs-on: self-hosted-windows-lv
    steps:
      - name: Enable Development Mode (2021 32-bit)
        uses: ./.github/actions/set-development-mode
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 32
          repo_root: ${{ github.workspace }}
      - uses: ./.github/actions/build-lvlibp
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 32
          repo_root: ${{ github.workspace }}
          major: ${{ needs.version.outputs.MAJOR }}
          minor: ${{ needs.version.outputs.MINOR }}
          patch: ${{ needs.version.outputs.PATCH }}
          build: ${{ needs.version.outputs.BUILD }}
          commit: ${{ github.sha }}
      - uses: ./.github/actions/rename-file
        with:
          current_filename: ${{ github.workspace }}/resource/plugins/lv_icon.lvlibp
          new_filename: ${{ github.workspace }}/resource/plugins/lv_icon_x86.lvlibp
      - uses: actions/upload-artifact@v4
        with:
          name: lv_icon_x86.lvlibp
          path: resource/plugins/lv_icon_x86.lvlibp
      - name: Revert Development Mode (2021 32-bit)
        if: always()
        uses: ./.github/actions/revert-development-mode
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 32
          repo_root: ${{ github.workspace }}
      - name: Close LabVIEW (2021 32-bit)
        if: always()
        uses: ./.github/actions/close-labview
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 32

  build-ppl-x64:
    name: Build 64-bit Packed Library
    needs: [test-2021, version]
    runs-on: self-hosted-windows-lv
    steps:
      - name: Enable Development Mode (2021 64-bit)
        uses: ./.github/actions/set-development-mode
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 64
          repo_root: ${{ github.workspace }}
      - uses: ./.github/actions/build-lvlibp
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 64
          repo_root: ${{ github.workspace }}
          major: ${{ needs.version.outputs.MAJOR }}
          minor: ${{ needs.version.outputs.MINOR }}
          patch: ${{ needs.version.outputs.PATCH }}
          build: ${{ needs.version.outputs.BUILD }}
          commit: ${{ github.sha }}
      - uses: ./.github/actions/rename-file
        with:
          current_filename: ${{ github.workspace }}/resource/plugins/lv_icon.lvlibp
          new_filename: ${{ github.workspace }}/resource/plugins/lv_icon_x64.lvlibp
      - uses: actions/upload-artifact@v4
        with:
          name: lv_icon_x64.lvlibp
          path: resource/plugins/lv_icon_x64.lvlibp
      - name: Revert Development Mode (2021 64-bit)
        if: always()
        uses: ./.github/actions/revert-development-mode
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 64
          repo_root: ${{ github.workspace }}
      - name: Close LabVIEW (2021 64-bit)
        if: always()
        uses: ./.github/actions/close-labview
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 64

  build-vip:
    name: Build VI Package
    # Chain after 32-bit PPL build (which depends on 64-bit PPL build).
    needs: [build-ppl-x86, version]
    runs-on: self-hosted-windows-lv
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: ./.github/actions/generate-release-notes
        # output_path defaults to Tooling/deployment/release_notes.md
      - uses: actions/download-artifact@v4
        with:
          name: lv_icon_x86.lvlibp
          path: resource/plugins
      - uses: actions/download-artifact@v4
        with:
          name: lv_icon_x64.lvlibp
          path: resource/plugins
      - name: Generate display information JSON
        id: display-info
        shell: pwsh
        env:
          RELEASE_NOTES_PATH: ${{ github.workspace }}/Tooling/deployment/release_notes.md
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESCRIPTION: ${{ github.event.repository.description }}
          REPO_URL: ${{ github.event.repository.html_url }}
          COMPANY: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $releaseNotes = if (Test-Path $Env:RELEASE_NOTES_PATH) {
            Get-Content -Raw -Path $Env:RELEASE_NOTES_PATH
          } else {
            "Release notes file not generated."
          }

          $productName = if ([string]::IsNullOrWhiteSpace($Env:REPO_NAME)) {
            $Env:REPOSITORY
          } else {
            $Env:REPO_NAME
          }

          $description = if ([string]::IsNullOrWhiteSpace($Env:REPO_DESCRIPTION)) {
            "$($Env:REPO_NAME) VI Package build for $($Env:REPOSITORY)."
          } else {
            $Env:REPO_DESCRIPTION
          }

          $info = @{
            "Package Version" = @{
              "major" = ${{ needs.version.outputs.MAJOR }}
              "minor" = ${{ needs.version.outputs.MINOR }}
              "patch" = ${{ needs.version.outputs.PATCH }}
              "build" = ${{ needs.version.outputs.BUILD }}
            }
            "Product Name" = $productName
            "Company Name" = $Env:COMPANY
            "Author Name (Person or Company)" = $Env:REPOSITORY
            "Product Homepage (URL)" = if ([string]::IsNullOrWhiteSpace($Env:REPO_URL)) {
              "https://github.com/$($Env:REPOSITORY)"
            } else {
              $Env:REPO_URL
            }
            "Legal Copyright" = "© $(Get-Date -Format yyyy) $($Env:COMPANY)"
            "License Agreement Name" = "See LICENSE.md"
            "Product Description Summary" = $description
            "Product Description" = $description
            "Release Notes - Change Log" = $releaseNotes
          }

          $json = $info | ConvertTo-Json -Depth 5 -Compress
          "json=$json" >> $Env:GITHUB_OUTPUT
      - uses: ./.github/actions/modify-vipb-display-info
        with:
          supported_bitness: 64
          repo_root: ${{ github.workspace }}
          vipb_path: Tooling/deployment/NI Icon editor.vipb
          minimum_supported_lv_version: 2021
          labview_minor_revision: 0
          major: ${{ needs.version.outputs.MAJOR }}
          minor: ${{ needs.version.outputs.MINOR }}
          patch: ${{ needs.version.outputs.PATCH }}
          build: ${{ needs.version.outputs.BUILD }}
          commit: ${{ github.sha }}
          release_notes_file: ${{ github.workspace }}/Tooling/deployment/release_notes.md
          display_information_json: ${{ steps.display-info.outputs.json }}
      - uses: ./.github/actions/build-vip
        with:
          supported_bitness: 64
          repo_root: ${{ github.workspace }}
          vipb_path: Tooling/deployment/NI Icon editor.vipb
          minimum_supported_lv_version: 2021
          labview_minor_revision: 0
          major: ${{ needs.version.outputs.MAJOR }}
          minor: ${{ needs.version.outputs.MINOR }}
          patch: ${{ needs.version.outputs.PATCH }}
          build: ${{ needs.version.outputs.BUILD }}
          commit: ${{ github.sha }}
          release_notes_file: ${{ github.workspace }}/Tooling/deployment/release_notes.md
          display_information_json: ${{ steps.display-info.outputs.json }}
      - if: always()
        uses: ./.github/actions/close-labview
        with:
          minimum_supported_lv_version: 2021
          supported_bitness: 64
      - name: Validate tag matches computed version (if provided)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.dispatch_tag != ''
        shell: pwsh
        env:
          EXPECTED_TAG: v${{ needs.version.outputs.MAJOR }}.${{ needs.version.outputs.MINOR }}.${{ needs.version.outputs.PATCH }}.${{ needs.version.outputs.BUILD }}
          REF_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          INPUT_TAG: ${{ github.event.inputs.dispatch_tag || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $provided = if (-not [string]::IsNullOrWhiteSpace($Env:INPUT_TAG)) { $Env:INPUT_TAG } else { $Env:REF_TAG }
          if ([string]::IsNullOrWhiteSpace($provided)) {
            Write-Host 'No tag provided; skipping validation.'
            exit 0
          }
          if ($provided -ne $Env:EXPECTED_TAG) {
            Write-Error ("Provided tag '{0}' does not match computed tag '{1}'." -f $provided, $Env:EXPECTED_TAG)
          } else {
            Write-Host ("Tag validation ok: {0}" -f $provided)
          }

