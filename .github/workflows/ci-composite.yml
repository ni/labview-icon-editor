name: CI Pipeline (Composite)
run-name: "CI ${{ github.sha }} (#${{ github.run_id }}.${{ github.run_attempt }})"

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  LVIE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
  LVIE_EXPECTED_RUNNER_LABEL: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
  LVIE_CANONICAL_RUNNER_LABEL: self-hosted-windows-lv
  LVIE_FORCE_NO_LABVIEW_DEVMODE: 1
  LVIE_RUNNER_ACL_CHECK: 1
  LVIE_RUNNER_ACL_AUTOFIX: 1
  LVIE_RUNNER_ACL_WARN_ONLY: 1
  LVIE_REQUIRE_RUNNER_CLI: ${{ vars.LVIE_REQUIRE_RUNNER_CLI || '0' }}
  LVIE_PYLAVI_BASELINE_PATH: ${{ vars.LVIE_PYLAVI_BASELINE_PATH || '' }}
  LVIE_PYLAVI_BASELINE_REQUIRED: ${{ vars.LVIE_PYLAVI_BASELINE_REQUIRED || '0' }}
  LVIE_PYLAVI_FAIL_ON_DELTA: ${{ vars.LVIE_PYLAVI_FAIL_ON_DELTA || '0' }}

concurrency:
  group: labview-${{ github.repository }}-${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
      - develop
      - 456-2020-migration
      - release/*
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - main
      - develop
      - 456-2020-migration
      - release/*
      - feature/*
      - hotfix/*
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      dispatch_tag:
        description: "Expected tag for this run (optional, for dispatched builds)"
        required: false
        type: string
      allow_baseline_update:
        description: "Allow PSScriptAnalyzer baseline updates (manual runs only)"
        required: false
        type: boolean
      expected_sha:
        description: "Expected commit SHA for this run (optional, for dispatched builds)"
        required: false
        type: string
      strict_sha:
        description: "Require expected_sha to be provided and matched"
        required: false
        type: boolean
      publish_prerelease:
        description: "Publish prerelease for this dispatch run"
        required: false
        default: false
        type: boolean
      force_gcli_lunit:
        description: "Selects the release-priority CI profile for workflow_dispatch routing"
        required: false
        default: false
        type: boolean
      vipc_apply_info:
        description: "Run informational VIPC apply diagnostics after audit (non-blocking)"
        required: false
        default: false
        type: boolean

jobs:
  # Stage 1: Run identity and publish-eligibility context.
  run-metadata:
    name: Run Metadata
    runs-on: ubuntu-latest
    outputs:
      run_uid: ${{ steps.meta.outputs.run_uid }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - id: meta
        name: Generate run manifest
        shell: pwsh
        run: |
          $runId = '${{ github.run_id }}'
          $runAttempt = '${{ github.run_attempt }}'
          $sha = '${{ github.sha }}'
          $ref = '${{ github.ref }}'
          $headRef = '${{ github.head_ref }}'
          $eventName = '${{ github.event_name }}'
          $actor = '${{ github.actor }}'
          $repo = '${{ github.repository }}'
          $workflow = '${{ github.workflow }}'
          $expectedSha = '${{ github.event.inputs.expected_sha }}'
          $strictSha = '${{ github.event.inputs.strict_sha }}'
          $publishPrerelease = '${{ github.event.inputs.publish_prerelease }}'
          $runUid = "{0}-{1}-{2}" -f $runId, $runAttempt, $sha

          if ($eventName -eq 'workflow_dispatch' -and $publishPrerelease -eq 'true' -and $strictSha -ne 'true') {
            throw "strict_sha=true is required when publish_prerelease=true."
          }
          if ($eventName -eq 'workflow_dispatch' -and $publishPrerelease -eq 'true' -and [string]::IsNullOrWhiteSpace($expectedSha)) {
            throw "expected_sha is required when publish_prerelease=true."
          }
          if ($strictSha -eq 'true' -and [string]::IsNullOrWhiteSpace($expectedSha)) {
            throw "expected_sha is required when strict_sha=true."
          }
          if (-not [string]::IsNullOrWhiteSpace($expectedSha) -and $expectedSha -ne $sha) {
            throw ("expected_sha '{0}' does not match github.sha '{1}'." -f $expectedSha, $sha)
          }

          $manifest = [pscustomobject]@{
            run_id        = $runId
            run_attempt   = $runAttempt
            run_uid       = $runUid
            sha           = $sha
            ref           = $ref
            head_ref      = $headRef
            event         = $eventName
            actor         = $actor
            repository    = $repo
            workflow      = $workflow
            timestamp_utc = (Get-Date).ToUniversalTime().ToString('o')
          }

          $path = Join-Path $env:RUNNER_TEMP 'run-manifest.json'
          $manifest | ConvertTo-Json -Depth 6 | Out-File -FilePath $path -Encoding ascii
          "run_uid=$runUid" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "sha=$sha" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "manifest_path=$path" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Upload run manifest
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest
          path: ${{ steps.meta.outputs.manifest_path }}

  prerelease-context:
    name: Pre-Release Context
    needs: run-metadata
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.ctx.outputs.should_publish }}
      publish_mode: ${{ steps.ctx.outputs.publish_mode }}
      publish_reason: ${{ steps.ctx.outputs.publish_reason }}
      ci_profile: ${{ steps.ctx.outputs.ci_profile }}
      release_priority_mode: ${{ steps.ctx.outputs.release_priority_mode }}
      bump_type_override: ${{ steps.ctx.outputs.bump_type_override }}
      merged_pr_number: ${{ steps.ctx.outputs.merged_pr_number }}
      bump_conflict: ${{ steps.ctx.outputs.bump_conflict }}
      bump_conflict_labels: ${{ steps.ctx.outputs.bump_conflict_labels }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: ctx
        name: Resolve publish eligibility and bump override
        uses: actions/github-script@v7
        env:
          PUBLISH_PRERELEASE: ${{ github.event.inputs.publish_prerelease || 'false' }}
          FORCE_GCLI_LUNIT: ${{ github.event.inputs.force_gcli_lunit || 'false' }}
        with:
          script: |
            const path = require('path');
            const {
              loadLabelContract,
              buildReleaseLabelMap,
              normalizeLabels,
            } = require(path.join(process.env.GITHUB_WORKSPACE || process.cwd(), '.github', 'scripts', 'label-metadata.js'));
            const contractPath = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), '.github', 'labels', 'label-contract.json');
            const labelContract = loadLabelContract(contractPath);
            const releaseLabelMap = buildReleaseLabelMap(labelContract);
            const publishInput = (process.env.PUBLISH_PRERELEASE || 'false').toLowerCase() === 'true';
            const forceGcliLunitInput = (process.env.FORCE_GCLI_LUNIT || 'false').toLowerCase() === 'true';
            const ciProfile = context.eventName === 'workflow_dispatch' && forceGcliLunitInput
              ? 'release-priority'
              : (context.eventName === 'pull_request' ? 'pr-fast' : 'full');
            const releasePriorityMode = ciProfile === 'release-priority';

            async function getCommitParentCount() {
              const response = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });
              const parents = Array.isArray(response.data.parents) ? response.data.parents : [];
              return parents.length;
            }

            async function findMergedPrsTargetingDevelop() {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const mergedDevelopPrs = response.data
                .filter((pr) => pr.merged_at && pr.base && pr.base.ref === 'develop')
                .sort((a, b) => new Date(b.merged_at) - new Date(a.merged_at));
              return mergedDevelopPrs;
            }

            async function findRecentSuccessfulFullProfileRun(maxAgeHours) {
              const cutoffMs = Date.now() - (maxAgeHours * 60 * 60 * 1000);
              let page = 1;
              while (page <= 5) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'ci-composite.yml',
                  branch: 'develop',
                  event: 'push',
                  status: 'completed',
                  per_page: 100,
                  page,
                });
                const runs = Array.isArray(response.data.workflow_runs) ? response.data.workflow_runs : [];
                if (!runs.length) {
                  break;
                }

                for (const run of runs) {
                  const createdMs = Date.parse(run.created_at || '');
                  if (!Number.isFinite(createdMs)) {
                    continue;
                  }
                  if (createdMs < cutoffMs) {
                    return null;
                  }
                  if (run.id === context.runId) {
                    continue;
                  }
                  if (String(run.conclusion || '') === 'success') {
                    return run;
                  }
                }

                const datedRuns = runs
                  .map((run) => Date.parse(run.created_at || ''))
                  .filter((value) => Number.isFinite(value));
                if (datedRuns.length > 0 && Math.min(...datedRuns) < cutoffMs) {
                  break;
                }
                page += 1;
              }

              return null;
            }

            function findMergedPrForCurrentSha(mergedDevelopPrs) {
              const sha = String(context.sha || '').toLowerCase();
              for (const pr of mergedDevelopPrs) {
                const mergeSha = String(pr.merge_commit_sha || '').toLowerCase();
                if (mergeSha === sha) {
                  return pr;
                }
              }
              return null;
            }

            function deriveBumpFromLabels(pr) {
              const labels = (pr.labels || []).map((l) => String(l.name || ''));
              const found = normalizeLabels(labels, releaseLabelMap);
              if (found.normalized.length > 1) {
                return {
                  conflict: true,
                  conflictLabels: found.matchedRaw.join(', '),
                  bumpTypeOverride: '',
                };
              }
              return {
                conflict: false,
                conflictLabels: '',
                bumpTypeOverride: found.normalized[0] || 'patch',
              };
            }

            let shouldPublish = false;
            let publishMode = 'none';
            let publishReason = 'not-eligible';
            let bumpTypeOverride = '';
            let mergedPrNumber = '';
            let bumpConflict = false;
            let bumpConflictLabels = '';

            const commitParentCount = await getCommitParentCount();
            const isMergeCommit = commitParentCount > 1;
            const mergedDevelopPrs = await findMergedPrsTargetingDevelop();
            const hasMergedDevelopPrAssociation = mergedDevelopPrs.length > 0;
            const mergedPr = findMergedPrForCurrentSha(mergedDevelopPrs);
            if (mergedPr) {
              mergedPrNumber = String(mergedPr.number);
            }

            if (context.eventName === 'push' && context.ref === 'refs/heads/develop') {
              publishMode = 'manual-intent';
              shouldPublish = false;
              if (!isMergeCommit) {
                publishReason = 'manual-intent-required-develop-push-not-merge-commit';
              } else if (mergedPr) {
                publishReason = 'manual-intent-required-develop-push-merged-pr-detected';
              } else if (hasMergedDevelopPrAssociation) {
                publishReason = 'manual-intent-required-develop-push-merged-pr-sha-mismatch';
              } else {
                publishReason = 'manual-intent-required-develop-push-no-merged-pr';
              }
            } else if (context.eventName === 'workflow_dispatch') {
              publishMode = 'manual';
              if (!publishInput) {
                shouldPublish = false;
                publishReason = 'manual-intent-false';
              } else if (!isMergeCommit) {
                core.setFailed('Manual prerelease publish requires expected_sha to reference a merged develop merge commit.');
                return;
              } else if (!mergedPr) {
                if (hasMergedDevelopPrAssociation) {
                  core.setFailed('Manual prerelease publish requires expected_sha to match the merged develop PR merge SHA.');
                } else {
                  core.setFailed('Manual prerelease publish requires expected_sha to be associated with a merged PR targeting develop.');
                }
                return;
              } else {
                if (ciProfile === 'release-priority') {
                  const freshnessHours = 24;
                  let recentFullRun = null;
                  try {
                    recentFullRun = await findRecentSuccessfulFullProfileRun(freshnessHours);
                  } catch (error) {
                    core.setFailed(`Release-priority prerelease publish could not verify recent full-profile run freshness: ${error.message}`);
                    return;
                  }
                  if (!recentFullRun) {
                    core.setFailed(`Release-priority prerelease publish requires a successful full profile run on develop within the last ${freshnessHours} hours.`);
                    return;
                  }
                }
                shouldPublish = true;
                publishReason = 'manual-intent-eligible-merged-pr-merge-commit';
              }
            } else if (context.eventName === 'pull_request') {
              publishMode = 'pull-request';
              shouldPublish = false;
              publishReason = 'pull-request-events-never-publish';
            } else {
              publishMode = context.eventName;
              shouldPublish = false;
              publishReason = 'event-not-eligible';
            }

            const shouldDeriveMergedPrBump =
              (context.eventName === 'push' && context.ref === 'refs/heads/develop' && !!mergedPr) ||
              (context.eventName === 'workflow_dispatch' && publishInput && shouldPublish && !!mergedPr);
            if (shouldDeriveMergedPrBump) {
              const bumpInfo = deriveBumpFromLabels(mergedPr);
              bumpConflict = bumpInfo.conflict;
              bumpConflictLabels = bumpInfo.conflictLabels;
              bumpTypeOverride = bumpInfo.bumpTypeOverride;
            }

            core.setOutput('should_publish', shouldPublish ? 'true' : 'false');
            core.setOutput('publish_mode', publishMode);
            core.setOutput('publish_reason', publishReason);
            core.setOutput('ci_profile', ciProfile);
            core.setOutput('release_priority_mode', releasePriorityMode ? 'true' : 'false');
            core.setOutput('bump_type_override', bumpTypeOverride);
            core.setOutput('merged_pr_number', mergedPrNumber);
            core.setOutput('bump_conflict', bumpConflict ? 'true' : 'false');
            core.setOutput('bump_conflict_labels', bumpConflictLabels);

  runner-cli-build:
    name: Build runner-cli (linux-x64)
    needs: run-metadata
    uses: ./.github/workflows/runner-cli-reusable.yml
    permissions:
      actions: read
      contents: read
    with:
      rid: linux-x64
      artifact_name: runner-cli-linux-x64

  runner-cli-build-win:
    name: Build runner-cli (win-x64)
    needs: run-metadata
    uses: ./.github/workflows/runner-cli-reusable.yml
    permissions:
      actions: read
      contents: read
    with:
      rid: win-x64
      artifact_name: runner-cli-win-x64

  version-gate:
    name: LabVIEW Version Gate
    needs: [run-metadata, runner-cli-build]
    runs-on: ubuntu-latest
    outputs:
      raw: ${{ steps.lv.outputs.raw }}
      year: ${{ steps.lv.outputs.year }}
      minor: ${{ steps.lv.outputs.minor }}
      numeric: ${{ steps.lv.outputs.numeric }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download runner-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.runner-cli-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/runner-cli
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - id: lv
        name: Assert .lvversion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = $env:GITHUB_WORKSPACE
          $cliPath = Join-Path $env:RUNNER_TEMP 'runner-cli' 'runner-cli'
          if (Test-Path $cliPath) {
            Write-Host "Using prebuilt runner-cli artifact (incremental migration)."
            chmod +x $cliPath
            $json = & $cliPath version-gate --repo-root $repoRoot --json
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              exit $exitCode
            }
            $info = $json | ConvertFrom-Json
          } else {
            $runnerCliProject = Join-Path $repoRoot 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
            $canUseRunnerCli = (Get-Command dotnet -ErrorAction SilentlyContinue) -and (Test-Path $runnerCliProject)
            if ($canUseRunnerCli) {
            Write-Host "Using runner-cli version-gate (incremental migration)."
            dotnet build $runnerCliProject --configuration Release | Out-Host
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            $runnerCliDll = Join-Path (Split-Path $runnerCliProject) 'bin/Release/net8.0/runner-cli.dll'
            if (-not (Test-Path $runnerCliDll)) {
              throw "Runner CLI build succeeded but binary not found: $runnerCliDll"
            }
            $json = & dotnet $runnerCliDll version-gate --repo-root $repoRoot --json
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              exit $exitCode
            }
            $info = $json | ConvertFrom-Json
            } else {
              if ($env:LVIE_REQUIRE_RUNNER_CLI -eq '1') {
                throw "LVIE_REQUIRE_RUNNER_CLI=1 but runner-cli was not available."
              }
              Write-Warning "runner-cli unavailable; falling back to Assert-LabVIEWVersion.ps1."
              $info = & "$repoRoot/Tooling/Assert-LabVIEWVersion.ps1" -RepoRoot $repoRoot -Context 'ci-version-gate' -WriteSummary
            }
          }
          Write-Warning ("labview_version not provided; using .lvversion ({0})." -f $info.Raw)
          "raw=$($info.Raw)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "year=$($info.Year)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "minor=$($info.MinorRevision)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          "numeric=$($info.NumericVersion)" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
          Write-Host ("LabVIEW version gate passed: {0}" -f $info.Raw)

  core-conformance-hosted-linux:
    name: Core Conformance Evidence (Hosted Linux)
    needs: [run-metadata, version-gate, runner-cli-build]
    runs-on: ubuntu-latest
    outputs:
      evidence: ${{ steps.evidence.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download runner-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.runner-cli-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/runner-cli
      - id: evidence
        name: Run Core JSON checks (linux)
        shell: bash
        run: |
          set -euo pipefail
          cli="${RUNNER_TEMP}/runner-cli/runner-cli"
          if [ ! -x "$cli" ]; then
            chmod +x "$cli"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          evidence="core-linux:${run_url}:attempt-${GITHUB_RUN_ATTEMPT}"
          "$cli" version-gate --repo-root "$GITHUB_WORKSPACE" --json > "${RUNNER_TEMP}/core-linux-version-gate.json"
          "$cli" pylavi summarize --path "$GITHUB_WORKSPACE/Tooling/pylavi/fixtures/pylavi-offenders.sample.json" --json > "${RUNNER_TEMP}/core-linux-pylavi-summarize.json"
          cat > "${RUNNER_TEMP}/core-conformance-linux-evidence.json" <<JSON
          {
            "platform": "linux",
            "run_url": "${run_url}",
            "evidence": "${evidence}",
            "version_gate_json": "${RUNNER_TEMP}/core-linux-version-gate.json",
            "pylavi_summarize_json": "${RUNNER_TEMP}/core-linux-pylavi-summarize.json"
          }
          JSON
          echo "value=${evidence}" >> "$GITHUB_OUTPUT"
      - name: Upload Core conformance linux evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-conformance-linux-evidence
          path: |
            ${{ runner.temp }}/core-linux-version-gate.json
            ${{ runner.temp }}/core-linux-pylavi-summarize.json
            ${{ runner.temp }}/core-conformance-linux-evidence.json
          if-no-files-found: error

  core-conformance-hosted-windows:
    name: Core Conformance Evidence (Hosted Windows)
    needs: [run-metadata, version-gate, runner-cli-build-win]
    runs-on: windows-latest
    outputs:
      evidence: ${{ steps.evidence.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download runner-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.runner-cli-build-win.outputs.artifact_name }}
          path: ${{ runner.temp }}/runner-cli
      - id: evidence
        name: Run Core JSON checks (windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'runner-cli/runner-cli.exe'
          if (-not (Test-Path $cli)) {
            throw "runner-cli artifact missing at $cli"
          }
          $runUrl = "{0}/{1}/actions/runs/{2}" -f $env:GITHUB_SERVER_URL, $env:GITHUB_REPOSITORY, $env:GITHUB_RUN_ID
          $evidence = "core-windows:${runUrl}:attempt-$($env:GITHUB_RUN_ATTEMPT)"
          $versionOut = Join-Path $env:RUNNER_TEMP 'core-windows-version-gate.json'
          $pylaviOut = Join-Path $env:RUNNER_TEMP 'core-windows-pylavi-summarize.json'
          $evidenceOut = Join-Path $env:RUNNER_TEMP 'core-conformance-windows-evidence.json'
          & $cli version-gate --repo-root $env:GITHUB_WORKSPACE --json | Out-File -FilePath $versionOut -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "runner-cli version-gate failed with exit code $LASTEXITCODE"
          }
          $sample = Join-Path $env:GITHUB_WORKSPACE 'Tooling/pylavi/fixtures/pylavi-offenders.sample.json'
          & $cli pylavi summarize --path $sample --json | Out-File -FilePath $pylaviOut -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "runner-cli pylavi summarize failed with exit code $LASTEXITCODE"
          }
          $payload = [ordered]@{
            platform = 'windows'
            run_url = $runUrl
            evidence = $evidence
            version_gate_json = $versionOut
            pylavi_summarize_json = $pylaviOut
          }
          $payload | ConvertTo-Json -Depth 5 | Out-File -FilePath $evidenceOut -Encoding utf8
          "value=$evidence" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload Core conformance windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-conformance-windows-evidence
          path: |
            ${{ runner.temp }}/core-windows-version-gate.json
            ${{ runner.temp }}/core-windows-pylavi-summarize.json
            ${{ runner.temp }}/core-conformance-windows-evidence.json
          if-no-files-found: error

  conformance-full:
    name: Conformance Check (Full, Strict)
    needs: [run-metadata, core-conformance-hosted-linux, core-conformance-hosted-windows, runner-cli-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download runner-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.runner-cli-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/runner-cli
      - name: Run full conformance gate
        shell: pwsh
        env:
          RC_HOSTED_LINUX_EVIDENCE: ${{ needs.core-conformance-hosted-linux.outputs.evidence }}
          RC_HOSTED_WINDOWS_EVIDENCE: ${{ needs.core-conformance-hosted-windows.outputs.evidence }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'runner-cli/runner-cli'
          if (-not (Test-Path $cli)) {
            throw "runner-cli artifact missing at $cli"
          }
          chmod +x $cli
          $outDir = Join-Path $env:RUNNER_TEMP 'conformance-full'
          New-Item -Path $outDir -ItemType Directory -Force | Out-Null
          $jsonPath = Join-Path $outDir 'conformance-full.json'
          $json = & $cli conformance check --profile full --json --strict --repo-root $env:GITHUB_WORKSPACE
          $exitCode = $LASTEXITCODE
          $json | Out-File -FilePath $jsonPath -Encoding utf8
          if ($exitCode -ne 0) {
            throw "runner-cli conformance check failed with exit code $exitCode"
          }
          $result = $json | ConvertFrom-Json
          Write-Host ("Conformance profile: {0}" -f $result.profile)
          Write-Host ("Conformance totals: total={0}, pass={1}, warn={2}, fail={3}" -f $result.summary.total, $result.summary.pass, $result.summary.warn, $result.summary.fail)
      - name: Upload full conformance artifact
        uses: actions/upload-artifact@v4
        with:
          name: conformance-full
          path: ${{ runner.temp }}/conformance-full/conformance-full.json
          if-no-files-found: error

  powershell-lint:
    name: PowerShell Lint
    needs: run-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard PSScriptAnalyzer baseline
        shell: pwsh
        env:
          ALLOW_BASELINE_UPDATE: ${{ github.event.inputs.allow_baseline_update }}
        run: |
          $baselinePath = 'Tooling/PSScriptAnalyzerBaseline.json'
          $eventName = '${{ github.event_name }}'
          $branchName = if ($eventName -eq 'pull_request') { '${{ github.head_ref }}' } else { '${{ github.ref_name }}' }
          $allowInput = $env:ALLOW_BASELINE_UPDATE -eq 'true'
          $allowBranch = $branchName -match '^lint-baseline/' -or $branchName -match '^chore/lint-baseline/'
          if ($allowInput -or $allowBranch) {
            Write-Host ("Baseline guard: update allowed (allow_input={0}, branch={1})." -f $allowInput, $branchName)
            exit 0
          }

          $baseSha = if ($eventName -eq 'pull_request') { '${{ github.event.pull_request.base.sha }}' } else { '${{ github.event.before }}' }
          $headSha = '${{ github.sha }}'
          if ([string]::IsNullOrWhiteSpace($baseSha) -or $baseSha -eq '0000000000000000000000000000000000000000') {
            $revList = @(git rev-list --max-count=2 $headSha)
            if ($revList.Count -gt 1) { $baseSha = $revList[1] }
          }
          if ([string]::IsNullOrWhiteSpace($baseSha)) {
            throw "Baseline guard: unable to determine base commit for comparison."
          }

          $baselineInBase = & git ls-tree -r --name-only $baseSha -- $baselinePath
          if (-not $baselineInBase) {
            Write-Host ("Baseline guard: baseline missing in base {0}; allowing initial baseline addition." -f $baseSha)
            exit 0
          }

          $changed = git diff --name-only $baseSha $headSha -- $baselinePath
          if ($changed) {
            throw ("PSScriptAnalyzer baseline change detected in {0}. Use branch prefix 'lint-baseline/' or workflow_dispatch input allow_baseline_update=true." -f $baselinePath)
          }

          Write-Host "Baseline guard: no changes detected."
      - name: Validate path root contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Test-PathContract.ps1" -WriteSummary
      - name: Validate CI selector/dev-mode contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Test-CiPipelineSelectorDevModeContract.ps1" -WriteSummary
      - name: Validate solo-maintainer workflow contract
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Test-SoloMaintainerWorkflowContract.ps1" -WriteSummary
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Invoke-PSScriptAnalyzer.ps1" -WriteSummary

  vip-prerelease-requirements-lint:
    name: VIP Prerelease Requirements Lint
    needs: run-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint VIP prerelease requirements v1
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/Tooling/Test-VipPrereleaseRequirementsV1.ps1" -WriteSummary
      - name: Upload VIP prerelease requirements lint status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vip-prerelease-requirements-lint
          path: builds/status/vip-prerelease-requirements-lint.json
          if-no-files-found: error

  pylavi-validate:
    name: Validate LabVIEW Files (pylavi, report-only)
    needs: [run-metadata, version-gate, runner-cli-build-win]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download runner-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.runner-cli-build-win.outputs.artifact_name }}
          path: ${{ runner.temp }}/runner-cli
      - name: Export runner-cli path
        shell: pwsh
        run: |
          $cliPath = Join-Path $env:RUNNER_TEMP 'runner-cli' 'runner-cli.exe'
          if (Test-Path $cliPath) {
            "LVIE_RUNNER_CLI_PATH=$cliPath" | Out-File -FilePath $Env:GITHUB_ENV -Append -Encoding ascii
            Write-Host ("Using runner-cli at {0}" -f $cliPath)
          } else {
            Write-Warning ("runner-cli artifact missing at {0}" -f $cliPath)
            if ($env:LVIE_REQUIRE_RUNNER_CLI -eq '1') {
              throw "LVIE_REQUIRE_RUNNER_CLI=1 but runner-cli was not found."
            }
          }
      - name: Run vi_validate (strict, report-only)
        uses: ./.github/actions/pylavi-validate
        with:
          config_path: Tooling/pylavi/vi-validate.yml
          label: strict
          log_name: pylavi-validate-strict-log
          report_only: 'true'
          absolute_roots: ${{ vars.LVIE_PYLAVI_ABSOLUTE_PATH_ROOTS }}
      - name: Run vi_validate (legacy, report-only)
        uses: ./.github/actions/pylavi-validate
        with:
          config_path: Tooling/pylavi/vi-validate-legacy.yml
          label: legacy
          log_name: pylavi-validate-legacy-log
          report_only: 'true'
          absolute_roots: ${{ vars.LVIE_PYLAVI_ABSOLUTE_PATH_ROOTS }}

  # Stage 2: Baseline hosted/static checks.
  changes:
    name: Detect VIPC changes
    needs: [run-metadata, prerelease-context, version-gate, pylavi-validate]
    runs-on: ubuntu-latest
    env:
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    outputs:
      vipc: ${{ steps.filter.outputs.vipc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Runner sanity
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\Check-Runner.ps1" -SafeDirectoryScope System
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            vipc:
              - '**/*.vipc'

  apply-deps-lv-x64:
    name: Apply VIPC (LV x64)
    needs: [run-metadata, version-gate, changes]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      LVIE_REQUIRED_LABVIEW_VERSION: ${{ needs.version-gate.outputs.raw }}
      LVIE_REQUIRED_LABVIEW_VERSION_YEAR: ${{ needs.version-gate.outputs.year }}
      LVIE_REQUIRED_LABVIEW_MINOR_REVISION: ${{ needs.version-gate.outputs.minor }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Job setup
        uses: ./.github/actions/lvie-job-setup
        with:
          checkout: 'false'
          bitness: 64
          create_worktree: 'true'
          worktree_root_mode: runner_temp
      - name: Audit VIPC apply (LV x64)
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          & "$env:REPO_ROOT\\Tooling\\Assert-VipcApplied.ps1" `
            -RepoRoot "$env:REPO_ROOT" `
            -VIPCPath ".github/actions/apply-vipc/runner_dependencies.vipc" `
            -SupportedBitness 64 `
            -OutputPath "$env:REPO_ROOT\\builds\\status\\vipc-audit-64.json"
      - name: Report VIPC change status (LV x64)
        shell: pwsh
        run: |
          if ('${{ needs.changes.outputs.vipc }}' -eq 'true') {
            Write-Host ".vipc changes detected for this run."
          } else {
            Write-Host "No .vipc changes detected; audit-first policy still enforced."
          }
      - name: Apply VIPC (LV x64, informational)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ env.REPO_ROOT }}
        run: |
          $logPath = Join-Path $env:REPO_ROOT 'builds\status\vipc-apply-64.log'
          $logDir = Split-Path -Path $logPath -Parent
          if (-not (Test-Path -Path $logDir)) {
            New-Item -Path $logDir -ItemType Directory -Force | Out-Null
          }

          '' | Set-Content -Path $logPath -Encoding utf8
          $output = & ".github\\actions\\apply-vipc\\ApplyVIPC.ps1" `
            -SupportedBitness 64 `
            -RepoRoot "$env:REPO_ROOT" `
            -VIPCPath ".github/actions/apply-vipc/runner_dependencies.vipc" *>&1
          $exitCode = $LASTEXITCODE

          if ($output) {
            $output |
              ForEach-Object { $_.ToString() } |
              Tee-Object -FilePath $logPath -Append |
              ForEach-Object { Write-Host $_ }
          }

          if ($exitCode -ne 0) {
            exit $exitCode
          }
      - name: Upload VIPC audit artifact (LV x64)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-audit-64
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-audit-64.json
          if-no-files-found: warn
      - name: Upload VIPC apply log artifact (LV x64)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.vipc_apply_info == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vipc-apply-log-64
          path: ${{ env.REPO_ROOT }}/builds/status/vipc-apply-64.log
          if-no-files-found: warn
      - name: Job teardown
        if: always()
        uses: ./.github/actions/lvie-job-teardown

  apply-deps-x86:
    name: Apply VIPC (LV x86)
    needs: [run-metadata, version-gate, apply-deps-lv-x64, changes]
    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
