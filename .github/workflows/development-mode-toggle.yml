name: "Toggle Development Mode"

permissions:
  actions: read

on:
  workflow_call:
    inputs:
      mode:
        description: "Enable or disable dev mode (reusable)."
        type: string
        required: true
        default: "enable"
      labview_version:
        description: "LabVIEW version to target (year or numeric)."
        type: string
        required: false
        default: ""
      bitness:
        description: "LabVIEW bitness to target (32 or 64)."
        type: string
        required: true
      sequence_id:
        description: "Optional sequence identifier for deterministic run tracking."
        type: string
        required: false
        default: ""

  workflow_dispatch:
    inputs:
      mode:
        description: "Enable or disable dev mode (manual)."
        required: true
        default: "enable"
        type: choice
        options:
          - enable
          - disable
      labview_version:
        description: "LabVIEW version (year or numeric)."
        required: false
        default: ""
        type: string
      bitness:
        description: "LabVIEW bitness."
        required: true
        default: "64"
        type: choice
        options:
          - "64"
          - "32"
      sequence_id:
        description: "Optional sequence identifier for deterministic run tracking."
        required: false
        default: ""
        type: string

run-name: ${{
  github.event_name == 'workflow_dispatch' &&
    format('DevMode blocked {0} {1}-bit LV{2} seq={3}',
      github.event.inputs.mode == 'enable' && 'enable' || 'disable',
      github.event.inputs.bitness || '64',
      github.event.inputs.labview_version || 'auto',
      github.event.inputs.sequence_id || 'none') ||
    format('DevMode blocked {0} {1}-bit LV{2} seq={3}',
      inputs.mode == 'enable' && 'enable' || 'disable',
      inputs.bitness || '64',
      inputs.labview_version || 'auto',
      inputs.sequence_id || 'none') }}

jobs:
  dev-mode-policy-block:
    name: Dev Mode Invocation Disabled
    runs-on: ubuntu-latest
    steps:
      - name: Fail fast on dev mode policy
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $mode = '${{ github.event.inputs.mode }}'
            $bitness = '${{ github.event.inputs.bitness }}'
            $version = '${{ github.event.inputs.labview_version }}'
            $sequence = '${{ github.event.inputs.sequence_id }}'
          } else {
            $mode = '${{ inputs.mode }}'
            $bitness = '${{ inputs.bitness }}'
            $version = '${{ inputs.labview_version }}'
            $sequence = '${{ inputs.sequence_id }}'
          }

          Write-Host ("Requested mode={0}, bitness={1}, version={2}, sequence_id={3}" -f $mode, $bitness, $version, $sequence)
          throw "Dev mode invocation is disabled by repository policy. No automation flow may toggle dev mode via LabVIEW or filesystem/INI edits."
