name: "Toggle Development Mode"

permissions:
  actions: read

env:
  LVIE_FORCE_NO_LABVIEW_DEVMODE: 1

concurrency:
  group: labview-${{ github.repository }}-${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
  cancel-in-progress: false

on:
  # 1) Called by other workflows
  workflow_call:
    inputs:
      mode:
        description: "Enable or disable dev mode (reusable)."
        type: string
        required: true
        default: "enable"
      labview_version:
        description: "LabVIEW version to target (year or numeric)."
        type: string
        required: false
        default: ""
      bitness:
        description: "LabVIEW bitness to target (32 or 64)."
        type: string
        required: true
      sequence_id:
        description: "Optional sequence identifier for deterministic run tracking."
        type: string
        required: false
        default: ""

  # 2) Triggered manually from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Enable or disable dev mode (manual)."
        required: true
        default: "enable"
        type: choice
        options:
          - enable
          - disable
      labview_version:
        description: "LabVIEW version (year or numeric)."
        required: false
        default: ""
        type: string
      bitness:
        description: "LabVIEW bitness."
        required: true
        default: "64"
        type: choice
        options:
          - "64"
          - "32"
      sequence_id:
        description: "Optional sequence identifier for deterministic run tracking."
        required: false
        default: ""
        type: string

run-name: ${{ 
  github.event_name == 'workflow_dispatch' && 
    format('DevMode {0} {1}-bit LV{2} seq={3}', 
      github.event.inputs.mode == 'enable' && 'enable' || 'disable',
      github.event.inputs.bitness || '64',
      github.event.inputs.labview_version || 'auto',
      github.event.inputs.sequence_id || 'none') || 
    format('DevMode {0} {1}-bit LV{2} seq={3}', 
      inputs.mode == 'enable' && 'enable' || 'disable',
      inputs.bitness || '64',
      inputs.labview_version || 'auto',
      inputs.sequence_id || 'none') }}

jobs:
  toggle-dev-mode:
    #
    # -- FULLY DYNAMIC JOB NAME --
    #
    # If triggered by 'workflow_dispatch', read `github.event.inputs.*`.
    # Otherwise (workflow_call), read `inputs.*`.
    # Then display "Enable 32-bit Dev Mode LV2021" (or the equivalent values).
    #
    name: ${{ 
      github.event_name == 'workflow_dispatch' && 
        format('{0} {1}-bit Dev Mode LV{2}', 
          github.event.inputs.mode == 'enable' && 'Enable' || 'Disable',
          github.event.inputs.bitness || '64',
          github.event.inputs.labview_version || 'auto') || 
        format('{0} {1}-bit Dev Mode LV{2}', 
          inputs.mode == 'enable' && 'Enable' || 'Disable',
          inputs.bitness || '64',
          inputs.labview_version || 'auto') }}

    runs-on: ${{ vars.LVIE_RUNNER_LABEL || 'self-hosted-windows-lv' }}
    env:
      LVIE_WORKTREE_ROOT: '${{ github.workspace }}\..\..\lvie\w'
      selected_bitness: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bitness || inputs.bitness }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Runner bootstrap (stateless)
        uses: ./.github/actions/runner-bootstrap
        with:
          safe_directory_scope: System
      - name: Acquire LabVIEW runner lock
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\RunnerLock.ps1" -Mode Acquire

      - name: Log context
        shell: pwsh
        run: |
          Write-Host "Actor: ${{ github.actor }}"
          Write-Host "Reference: ${{ github.ref }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "Sequence ID: ${{ github.event.inputs.sequence_id }}"
          } else {
            Write-Host "Sequence ID: ${{ inputs.sequence_id }}"
          }
          if ("${{ github.event_name }}" -eq "pull_request") {
            Write-Host "Pull Request Number: ${{ github.event.pull_request.number }}"
          } else {
            Write-Host "Not triggered by a pull request."
          }

      - name: Resolve LabVIEW version from .lvversion
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw "GITHUB_WORKSPACE is required to resolve RepoRoot."
          }
          $repoRoot = (Resolve-Path -Path $env:GITHUB_WORKSPACE -ErrorAction Stop).Path
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $lvVersionInput = '${{ github.event.inputs.labview_version }}'
          } else {
            $lvVersionInput = '${{ inputs.labview_version }}'
          }

          $runnerCliProject = Join-Path $repoRoot 'Tooling/runner-cli/RunnerCli/RunnerCli.csproj'
          $canUseRunnerCli = (Get-Command dotnet -ErrorAction SilentlyContinue) -and (Test-Path $runnerCliProject)
          if ($canUseRunnerCli) {
            Write-Host "Using runner-cli version-gate (incremental migration)."
            dotnet build $runnerCliProject --configuration Release | Out-Host
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            $runnerCliDll = Join-Path (Split-Path $runnerCliProject) 'bin/Release/net8.0/runner-cli.dll'
            if (-not (Test-Path $runnerCliDll)) {
              throw "Runner CLI build succeeded but binary not found: $runnerCliDll"
            }
            $args = @('version-gate', '--repo-root', $repoRoot, '--json')
            if (-not [string]::IsNullOrWhiteSpace($lvVersionInput)) {
              $args += '--version'
              $args += $lvVersionInput
            }
            $json = & dotnet $runnerCliDll @args
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              exit $exitCode
            }
            $lvInfo = $json | ConvertFrom-Json
          } else {
            Write-Warning "runner-cli unavailable; falling back to Assert-LabVIEWVersion.ps1."
            $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
            if (-not (Test-Path -Path $assertScript)) {
              throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
            }
            $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $lvVersionInput -Context 'development-mode-toggle'
          }
          if ([string]::IsNullOrWhiteSpace($lvVersionInput)) {
            Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
          }
          Write-Host ("LabVIEW version gate passed: {0}" -f $lvInfo.Raw)
          "LVIE_DEV_MODE_VERSION=$($lvInfo.Year)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Toggle dev mode (64-bit)
        if: ${{ env.selected_bitness == '64' && success() }}
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = '${{ github.event.inputs.mode }}'
          } else {
            $mode = '${{ inputs.mode }}'
          }

          $lvVersion = $env:LVIE_DEV_MODE_VERSION

          $scriptArgs = @{
            LabVIEWVersion = $lvVersion
            SupportedBitness          = '64'
          }

          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw "GITHUB_WORKSPACE is required to resolve RepoRoot."
          }

          $scriptArgs.RepoRoot = $env:GITHUB_WORKSPACE

          if ($mode -eq 'enable') {
            & ./.github/actions/set-development-mode/Set_Development_Mode.ps1 @scriptArgs
          } else {
            & ./.github/actions/revert-development-mode/RevertDevelopmentMode.ps1 @scriptArgs
          }

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            exit $LASTEXITCODE
          }

      - name: Release LabVIEW runner lock
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\\Tooling\\RunnerLock.ps1" -Mode Release

      - name: Toggle dev mode (32-bit)
        if: ${{ env.selected_bitness == '32' && success() }}
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = '${{ github.event.inputs.mode }}'
          } else {
            $mode = '${{ inputs.mode }}'
          }

          $lvVersion = $env:LVIE_DEV_MODE_VERSION

          $scriptArgs = @{
            LabVIEWVersion = $lvVersion
            SupportedBitness          = '32'
          }

          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw "GITHUB_WORKSPACE is required to resolve RepoRoot."
          }

          $scriptArgs.RepoRoot = $env:GITHUB_WORKSPACE

          if ($mode -eq 'enable') {
            & ./.github/actions/set-development-mode/Set_Development_Mode.ps1 @scriptArgs
          } else {
            & ./.github/actions/revert-development-mode/RevertDevelopmentMode.ps1 @scriptArgs
          }

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            exit $LASTEXITCODE
          }

