name: "Modify VIPB Display Info"
description: "Runs ModifyVIPBDisplayInfo.ps1 to update display information in a VIPB file."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: false

    - name: Run ModifyVIPBDisplayInfo.ps1
      shell: pwsh
      env:
        DISPLAY_INFORMATION_JSON: |
          ${{ inputs.display_information_json }}
      run: |
        $repoRoot = "${{ inputs.repo_root }}"
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:GITHUB_WORKSPACE
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "repo_root is required."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        $lvVersionInput = "${{ inputs.labview_version }}"
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $lvVersionInput -Context 'modify-vipb-display-info'
        if ([string]::IsNullOrWhiteSpace($lvVersionInput)) {
          Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
        }
        $lvVersion = $lvInfo.Year
        $minorInput = "${{ inputs.labview_minor_revision }}"
        if (-not [string]::IsNullOrWhiteSpace($minorInput)) {
          if ([int]$minorInput -ne [int]$lvInfo.MinorRevision) {
            throw "labview_minor_revision '$minorInput' does not match .lvversion minor '$($lvInfo.MinorRevision)'."
          }
        }
        $lvMinor = if ([string]::IsNullOrWhiteSpace($minorInput)) { $lvInfo.MinorRevision } else { [int]$minorInput }
        $displayInformationJson = $Env:DISPLAY_INFORMATION_JSON
        & "${{ github.action_path }}/ModifyVIPBDisplayInfo.ps1" `
          -SupportedBitness ${{ inputs.supported_bitness }} `
          -RepoRoot $repoRoot `
          -VIPBPath "${{ inputs.vipb_path }}" `
          -LabVIEWVersion $lvVersion `
          -LabVIEWMinorRevision $lvMinor `
          -Major ${{ inputs.major }} `
          -Minor ${{ inputs.minor }} `
          -Patch ${{ inputs.patch }} `
          -Build ${{ inputs.build }} `
          -Commit "${{ inputs.commit }}" `
          -ReleaseNotesFile "${{ inputs.release_notes_file }}" `
          -DisplayInformationJSON $displayInformationJson
inputs:
  labview_version:
    description: 'LabVIEW version to target (year or numeric).'
    required: false
  supported_bitness:
    description: '32 or 64'
    required: true
  repo_root:
    description: 'Workspace root path'
    required: true
  vipb_path:
    description: 'Path to the VIPB file (relative to workspace)'
    required: true
  labview_minor_revision:
    description: 'LabVIEW minor revision (e.g., 0 for 21.0)'
    required: false
    default: ''
  major:
    description: 'Major version component'
    required: true
  minor:
    description: 'Minor version component'
    required: true
  patch:
    description: 'Patch version component'
    required: true
  build:
    description: 'Build number'
    required: true
  commit:
    description: 'Commit identifier'
    required: true
  release_notes_file:
    description: 'Path to release notes file'
    required: true
  display_information_json:
    description: 'DisplayInformation JSON string'
    required: true



