name: "Build Packed Library"
description: "Runs Build_lvlibp.ps1 to create the editor packed library."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Build_lvlibp.ps1
      shell: pwsh
      run: |
        $lvVersion = "${{ inputs.labview_version }}"
        if ([string]::IsNullOrWhiteSpace($lvVersion)) {
          throw "labview_version is required."
        }

        & "${{ github.action_path }}/Build_lvlibp.ps1" `
          -MinimumSupportedLVVersion $lvVersion `
          -SupportedBitness ${{ inputs.supported_bitness }} `
          -RepoRoot "${{ inputs.repo_root }}" `
          -Major ${{ inputs.major }} `
          -Minor ${{ inputs.minor }} `
          -Patch ${{ inputs.patch }} `
          -Build ${{ inputs.build }} `
          -Commit "${{ inputs.commit }}"
inputs:
  labview_version:
    description: 'LabVIEW version to target (year or numeric).'
    required: true
  supported_bitness:
    description: '32 or 64'
    required: true
  repo_root:
    description: 'Workspace root path'
    required: true
  major:
    description: 'Major version component'
    required: true
  minor:
    description: 'Minor version component'
    required: true
  patch:
    description: 'Patch version component'
    required: true
  build:
    description: 'Build number'
    required: true
  commit:
    description: 'Commit identifier'
    required: true


