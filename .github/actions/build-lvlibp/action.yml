name: "Build Packed Library"
description: "Runs Build_lvlibp.ps1 to create the editor packed library."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: LabVIEW cache diagnostics (pre)
      shell: pwsh
      run: |
        Write-Host "User: $(whoami)"
        $userProfile = [Environment]::GetFolderPath('UserProfile')
        Write-Host "UserProfile: $userProfile"
        $lvData = Join-Path $userProfile 'Documents\LabVIEW Data'
        Write-Host "LabVIEW Data: $lvData"
        if (Test-Path $lvData) {
          Get-ChildItem -Path $lvData -Directory |
            Select-Object Name, LastWriteTime |
            Sort-Object Name |
            Format-Table -AutoSize
          foreach ($cacheName in @('VIObjCache', 'AppBuilderCache')) {
            $cachePath = Join-Path $lvData $cacheName
            if (Test-Path $cachePath) {
              Get-Item -Path $cachePath | Select-Object FullName, LastWriteTime | Format-Table -AutoSize
            } else {
              Write-Host "Cache not found: $cachePath"
            }
          }
        } else {
          Write-Host "LabVIEW Data folder not found."
        }

    - name: Run Build_lvlibp.ps1
      shell: pwsh
      run: |
        & "${{ github.action_path }}/Build_lvlibp.ps1" `
          -MinimumSupportedLVVersion ${{ inputs.minimum_supported_lv_version }} `
          -SupportedBitness ${{ inputs.supported_bitness }} `
          -RelativePath "${{ inputs.relative_path }}" `
          -Major ${{ inputs.major }} `
          -Minor ${{ inputs.minor }} `
          -Patch ${{ inputs.patch }} `
          -Build ${{ inputs.build }} `
          -Commit "${{ inputs.commit }}"

    - name: LabVIEW cache diagnostics (post)
      shell: pwsh
      run: |
        Write-Host "User: $(whoami)"
        $userProfile = [Environment]::GetFolderPath('UserProfile')
        Write-Host "UserProfile: $userProfile"
        $lvData = Join-Path $userProfile 'Documents\LabVIEW Data'
        Write-Host "LabVIEW Data: $lvData"
        if (Test-Path $lvData) {
          Get-ChildItem -Path $lvData -Directory |
            Select-Object Name, LastWriteTime |
            Sort-Object Name |
            Format-Table -AutoSize
          foreach ($cacheName in @('VIObjCache', 'AppBuilderCache')) {
            $cachePath = Join-Path $lvData $cacheName
            if (Test-Path $cachePath) {
              Get-Item -Path $cachePath | Select-Object FullName, LastWriteTime | Format-Table -AutoSize
            } else {
              Write-Host "Cache not found: $cachePath"
            }
          }
        } else {
          Write-Host "LabVIEW Data folder not found."
        }
inputs:
  minimum_supported_lv_version:
    description: 'LabVIEW major version'
    required: true
  supported_bitness:
    description: '32 or 64'
    required: true
  relative_path:
    description: 'Workspace root path'
    required: true
  major:
    description: 'Major version component'
    required: true
  minor:
    description: 'Minor version component'
    required: true
  patch:
    description: 'Patch version component'
    required: true
  build:
    description: 'Build number'
    required: true
  commit:
    description: 'Commit identifier'
    required: true
