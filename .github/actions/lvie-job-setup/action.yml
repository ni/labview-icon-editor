name: LVIE Job Setup
description: Standard setup for self-hosted LabVIEW jobs (checkout, runner bootstrap, optional lock/worktree).
inputs:
  checkout:
    description: Run actions/checkout.
    required: false
    default: 'true'
  fetch_depth:
    description: Fetch depth for actions/checkout.
    required: false
    default: '0'
  runner_sanity:
    description: Run runner sanity checks (via runner-bootstrap).
    required: false
    default: 'true'
  runner_label_check:
    description: Validate runner labels (via runner-bootstrap).
    required: false
    default: 'true'
  safe_directory_scope:
    description: Git safe.directory scope (System or Global).
    required: false
    default: System
  download_runner_cli:
    description: Attempt to download runner-cli artifact for this branch (optional; worktree builds are preferred).
    required: false
    default: 'false'
  acquire_lock:
    description: Acquire LabVIEW runner lock when RunnerLock.ps1 is available.
    required: false
    default: 'false'
  create_worktree:
    description: Create a short-path worktree when New-CIWorktreeForJob.ps1 is available.
    required: false
    default: 'false'
  bitness:
    description: LabVIEW bitness (required when create_worktree is true).
    required: false
  variant:
    description: Optional variant label for worktree naming.
    required: false
  worktree_root:
    description: Optional override for worktree root.
    required: false
  worktree_root_mode:
    description: Worktree root resolution mode (`contract` or `runner_temp`).
    required: false
    default: contract
  repo_root:
    description: Optional override for base repo root.
    required: false
runs:
  using: composite
  steps:
    - name: Checkout code
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch_depth }}

    - name: Download runner-cli (optional)
      if: ${{ inputs.download_runner_cli == 'true' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $cliDir = Join-Path $env:RUNNER_TEMP 'runner-cli'
        $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
        if ($IsWindows) {
          $rid = 'win-x64'
          $cliFile = 'runner-cli.exe'
        } elseif ($IsLinux) {
          $rid = if ($arch -eq 'Arm64') { 'linux-arm64' } else { 'linux-x64' }
          $cliFile = 'runner-cli'
        } elseif ($IsMacOS) {
          $rid = if ($arch -eq 'Arm64') { 'osx-arm64' } else { 'osx-x64' }
          $cliFile = 'runner-cli'
        } else {
          $rid = 'win-x64'
          $cliFile = 'runner-cli.exe'
        }
        $cliPath = Join-Path $cliDir $cliFile
        if (Test-Path $cliPath) {
          Write-Host "runner-cli already present at $cliPath"
          exit 0
        }
        if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
          Write-Warning 'gh CLI not found; skipping runner-cli download.'
          exit 0
        }
        $repo = if ($env:GITHUB_REPOSITORY) { $env:GITHUB_REPOSITORY } else { '${{ github.repository }}' }
        $branch = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { '${{ github.ref_name }}' }
        Write-Host "Finding latest successful runner-cli run for $repo@$branch ..."
        try {
          $runs = gh run list -R $repo -w runner-cli.yml -b $branch -s success -L 1 --json databaseId | ConvertFrom-Json
        } catch {
          Write-Warning ("Failed to query workflow runs: {0}" -f $_.Exception.Message)
          exit 0
        }
        $runId = if ($runs -is [array]) { $runs[0].databaseId } else { $runs.databaseId }
        if (-not $runId) {
          Write-Warning 'No successful runner-cli workflow run found; skipping download.'
          exit 0
        }
        New-Item -Path $cliDir -ItemType Directory -Force | Out-Null
        try {
          gh run download $runId -R $repo -n ("runner-cli-{0}" -f $rid) -D $cliDir | Out-Null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            Write-Warning ("runner-cli artifact download failed (exit {0})." -f $LASTEXITCODE)
            exit 0
          }
        } catch {
          Write-Warning ("Failed to download runner-cli artifact: {0}" -f $_.Exception.Message)
          exit 0
        }
        if (Test-Path $cliPath) {
          Write-Host "Downloaded runner-cli to $cliPath"
        } else {
          Write-Warning ("runner-cli artifact downloaded but {0} not found in {1}" -f $cliFile, $cliDir)
        }
        exit 0

    - name: Runner bootstrap (stateless)
      uses: ./.github/actions/runner-bootstrap
      with:
        initialize_runner: 'true'
        runner_sanity: ${{ inputs.runner_sanity }}
        runner_label_check: ${{ inputs.runner_label_check }}
        safe_directory_scope: ${{ inputs.safe_directory_scope }}

    - name: Export repo root (non-worktree)
      if: ${{ inputs.create_worktree != 'true' }}
      shell: pwsh
      run: |
        $repoRoot = '${{ inputs.repo_root }}'
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:GITHUB_WORKSPACE
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "REPO_ROOT could not be resolved."
        }
        if (-not (Test-Path -Path $repoRoot)) {
          throw "Repo root not found: $repoRoot"
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path
        $projectPath = Join-Path $repoRoot 'lv_icon_editor.lvproj'
        if (-not (Test-Path -Path $projectPath)) {
          throw "Project file not found at $projectPath"
        }
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -Context 'ci-job-setup'
        if ([string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
          throw "GITHUB_ENV not set; cannot export REPO_ROOT."
        }
        "REPO_ROOT=$repoRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        "PROJECT_PATH=$projectPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        "LABVIEW_VERSION_RAW=$($lvInfo.Raw)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        "LABVIEW_VERSION_YEAR=$($lvInfo.Year)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        "LABVIEW_MINOR_REVISION=$($lvInfo.MinorRevision)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        "LABVIEW_NUMERIC_VERSION=$($lvInfo.NumericVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

    - name: Acquire LabVIEW runner lock
      if: ${{ inputs.acquire_lock == 'true' }}
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LVIE_RUNNER_LOCK_GITHUB_CHECK: 1
      run: |
        $lockScript = Join-Path $env:GITHUB_WORKSPACE 'Tooling\RunnerLock.ps1'
        if (-not (Test-Path $lockScript)) {
          Write-Warning "RunnerLock.ps1 not found at $lockScript; skipping lock acquisition."
          exit 0
        }
        pwsh -NoProfile -File $lockScript -Mode Acquire

    - name: Create short-path worktree
      if: ${{ inputs.create_worktree == 'true' }}
      shell: pwsh
      run: |
        $worktreeScript = Join-Path $env:GITHUB_WORKSPACE 'Tooling\New-CIWorktreeForJob.ps1'
        $resolverScript = Join-Path $env:GITHUB_WORKSPACE 'Tooling\Resolve-CIWorktreeRoot.ps1'
        if (-not (Test-Path $worktreeScript)) {
          Write-Warning "New-CIWorktreeForJob.ps1 not found at $worktreeScript; skipping worktree creation."
          exit 0
        }
        if (-not (Test-Path $resolverScript)) {
          throw "Resolve-CIWorktreeRoot.ps1 not found at $resolverScript"
        }
        $bitness = '${{ inputs.bitness }}'
        if ([string]::IsNullOrWhiteSpace($bitness)) {
          throw "bitness input is required when create_worktree is true."
        }
        $worktreeRootMode = '${{ inputs.worktree_root_mode }}'
        if ([string]::IsNullOrWhiteSpace($worktreeRootMode)) {
          $worktreeRootMode = 'contract'
        }
        $variant = '${{ inputs.variant }}'
        $worktreeRoot = '${{ inputs.worktree_root }}'
        $repoRoot = '${{ inputs.repo_root }}'
        $worktreeResolution = & $resolverScript `
          -Mode $worktreeRootMode `
          -ExplicitWorktreeRoot $worktreeRoot `
          -RunnerTemp $env:RUNNER_TEMP `
          -ContractWorktreeRoot $env:LVIE_WORKTREE_ROOT
        $resolvedWorktreeRoot = $worktreeResolution.Path
        $worktreeRootSource = $worktreeResolution.Source
        if ([string]::IsNullOrWhiteSpace($resolvedWorktreeRoot)) {
          throw "Resolved worktree root was empty."
        }
        New-Item -Path $resolvedWorktreeRoot -ItemType Directory -Force | Out-Null
        Write-Host ("Resolved worktree root: {0} (source: {1})" -f $resolvedWorktreeRoot, $worktreeRootSource)
        if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_ENV)) {
          "LVIE_WORKTREE_ROOT=$resolvedWorktreeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "LVIE_WORKTREE_ROOT_SOURCE=$worktreeRootSource" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
        }
        & $worktreeScript `
          -Bitness $bitness `
          -Variant $variant `
          -WorktreeRoot $resolvedWorktreeRoot `
          -RepoRoot $repoRoot
