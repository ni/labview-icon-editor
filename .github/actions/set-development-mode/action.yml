name: "Set Development Mode"
description: "Runs Set_Development_Mode.ps1 to configure the repo for development."
inputs:
  labview_version:
    description: 'LabVIEW version to target (year or numeric).'
    required: false
  supported_bitness:
    description: 'LabVIEW bitness (32 or 64).'
    required: true
  repo_root:
    description: 'Workspace root path'
    required: false
  use_labview:
    description: 'Use LabVIEW + g-cli instead of the no-LabVIEW path.'
    required: false
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Set_Development_Mode.ps1
      shell: pwsh
      run: |
        $repoRoot = "${{ inputs.repo_root }}"
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:GITHUB_WORKSPACE
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "repo_root is required."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        $lvVersionInput = "${{ inputs.labview_version }}"
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $lvVersionInput -Context 'set-development-mode'
        if ([string]::IsNullOrWhiteSpace($lvVersionInput)) {
          Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
        }
        $lvVersion = $lvInfo.Year

        $scriptArgs = @{
          LabVIEWVersion = $lvVersion
        }

        $scriptArgs.RepoRoot = $repoRoot

        $scriptArgs.SupportedBitness = "${{ inputs.supported_bitness }}"

        $useLabviewInput = "${{ inputs.use_labview }}"
        if (-not [string]::IsNullOrWhiteSpace($useLabviewInput)) {
          $normalized = $useLabviewInput.Trim().ToLowerInvariant()
          if ($normalized -in @('1', 'true', 'yes', 'y')) {
            $scriptArgs.UseLabVIEW = $true
          }
        }

        & "${{ github.action_path }}/Set_Development_Mode.ps1" @scriptArgs



