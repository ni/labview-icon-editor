name: "Apply VIPC Dependencies"
description: "Runs ApplyVIPC.ps1 to install runner dependencies for a given LabVIEW version/bitness."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run ApplyVIPC.ps1
      id: apply
      shell: pwsh
      run: |
        & "${{ github.action_path }}/ApplyVIPC.ps1" `
          -Package_LabVIEW_Version ${{ inputs.package_labview_version }} `
          -SupportedBitness ${{ inputs.supported_bitness }} `
          -RepositoryPath "${{ inputs.repository_path }}" `
          -VIPCPath "${{ inputs.vipc_path }}"
outputs:
  summary-json:
    description: 'Path to the apply-vipc summary JSON (package diff and verification results).'
    value: ${{ steps.apply.outputs.summary-json }}
  vipc_path:
    description: 'Resolved path to the .vipc file that was applied.'
    value: ${{ steps.apply.outputs.vipc_path }}
  vipc_sha256:
    description: 'SHA256 hash of the applied .vipc file.'
    value: ${{ steps.apply.outputs.vipc_sha256 }}
  vipc_size_bytes:
    description: 'Size in bytes of the applied .vipc file.'
    value: ${{ steps.apply.outputs.vipc_size_bytes }}
  vipc_last_write_utc:
    description: 'Last write time (UTC) of the applied .vipc file.'
    value: ${{ steps.apply.outputs.vipc_last_write_utc }}
  vipc_git_commit:
    description: 'Git commit hash of the applied .vipc file (last change to the file).'
    value: ${{ steps.apply.outputs.vipc_git_commit }}
inputs:
  package_labview_version:
    description: 'LabVIEW version to target (derived from VIPB)'
    required: true
  supported_bitness:
    description: '32 or 64'
    required: true
  repository_path:
    description: 'Workspace root path'
    required: true
  vipc_path:
    description: 'Path under repo for the .vipc file (relative to workspace)'
    required: true
