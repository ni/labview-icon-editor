name: "Run Unit Tests"
description: "Runs RunUnitTests.ps1 to execute LabVIEW unit tests via g-cli."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run RunUnitTests.ps1
      shell: pwsh
      run: |
        $repoRoot = $env:GITHUB_WORKSPACE
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "GITHUB_WORKSPACE is required to resolve .lvversion."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        $lvVersionInput = "${{ inputs.labview_version }}"
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $lvVersionInput -Context 'run-unit-tests'
        if ([string]::IsNullOrWhiteSpace($lvVersionInput)) {
          Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
        }
        $lvVersion = $lvInfo.Year

        & "${{ github.action_path }}/RunUnitTests.ps1" `
          -LabVIEWVersion $lvVersion `
          -SupportedBitness ${{ inputs.supported_bitness }} `
          -ProjectPath "${{ inputs.project_path }}"
inputs:
  labview_version:
    description: 'LabVIEW version to run (year or numeric).'
    required: false
  supported_bitness:
    description: '32 or 64'
    required: true
  project_path:
    description: 'Path to the LabVIEW project (.lvproj)'
    required: true



