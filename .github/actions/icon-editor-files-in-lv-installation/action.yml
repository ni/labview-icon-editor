name: "Icon Editor Files in LV Installation"
description: "Runs GetPathsToIconEditorFilesInLVInstallationCLI.vi via g-cli and posts a CSV summary."

inputs:
  lv-ver:
    description: "LabVIEW version (year or numeric)."
    required: false
  arch:
    description: "Bitness (32 or 64)."
    required: true
  repo-root:
    description: "Repository root path (absolute)."
    required: true
  csv-name:
    description: "CSV file name created by the VI."
    required: false
    default: "Icon_Editor_Files_In_LV_Installation_Diagnostics.csv"
  project-file:
    description: "Deprecated. Diagnostics run without opening a project."
    required: false
    default: ""
  summary-title:
    description: "Header title for the workflow summary."
    required: false
    default: "Icon Editor Files in LabVIEW Installation"
  artifact-name:
    description: "Artifact name for the CSV."
    required: false
    default: "icon-editor-files-in-lv-installation"

outputs:
  csv-path:
    description: "Absolute path to the diagnostics CSV."
    value: ${{ steps.run_vi.outputs.csv-path }}
  row-count:
    description: "Number of rows in the CSV."
    value: ${{ steps.run_vi.outputs.row-count }}

runs:
  using: composite
  steps:
    - name: Resolve LabVIEW version
      id: resolve_lv
      shell: pwsh
      run: |
        $repoRoot = '${{ inputs.repo-root }}'
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "repo-root is required."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path
        $lvInput = '${{ inputs.lv-ver }}'
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $lvInput -Context 'icon-editor-files-in-lv-installation'
        if ([string]::IsNullOrWhiteSpace($lvInput)) {
          Write-Warning "lv-ver not provided; using .lvversion ($($lvInfo.Raw))."
        }
        "lv_year=$($lvInfo.Year)" >> $Env:GITHUB_OUTPUT

    - name: Run diagnostics VI
      id: run_vi
      shell: pwsh
      run: |
        & "${{ github.action_path }}/Invoke-GetPathsToIconEditorFilesInLVInstallationCLI.ps1" `
          -LVVersion "${{ steps.resolve_lv.outputs.lv_year }}" `
          -Arch "${{ inputs.arch }}" `
          -RepoRoot "${{ inputs.repo-root }}" `
          -CsvFileName "${{ inputs.csv-name }}" `
          -ProjectFile "${{ inputs.project-file }}" `
          -SummaryTitle "${{ inputs.summary-title }}"

    - name: Upload diagnostics CSV
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run_vi.outputs.csv-path }}


