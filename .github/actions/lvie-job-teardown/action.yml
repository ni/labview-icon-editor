name: LVIE Job Teardown
description: Standard teardown for self-hosted LabVIEW jobs (revert dev mode, close LabVIEW, cleanup, release lock).
inputs:
  revert_dev_mode:
    description: Revert development mode using RevertDevelopmentMode.ps1.
    required: false
    default: 'false'
  revert_bitness:
    description: LabVIEW bitness for dev-mode revert.
    required: false
  close_labview:
    description: Close LabVIEW using Close_LabVIEW.ps1.
    required: false
    default: 'false'
  close_bitness:
    description: LabVIEW bitness for close.
    required: false
  labview_version:
    description: LabVIEW version (year). Defaults to LABVIEW_VERSION_YEAR env var.
    required: false
  repo_root:
    description: Repo root override. Defaults to REPO_ROOT env var.
    required: false
  cleanup_worktree:
    description: Remove worktree and prune git metadata.
    required: false
    default: 'true'
  release_lock:
    description: Release LabVIEW runner lock.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Revert development mode
      if: ${{ inputs.revert_dev_mode == 'true' }}
      shell: pwsh
      run: |
        $labviewVersion = '${{ inputs.labview_version }}'
        $bitness = '${{ inputs.revert_bitness }}'
        if ([string]::IsNullOrWhiteSpace($bitness)) {
          throw "revert_bitness input is required when revert_dev_mode is true."
        }
        $repoRoot = '${{ inputs.repo_root }}'
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:REPO_ROOT
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:GITHUB_WORKSPACE
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "repo_root is required."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        if ([string]::IsNullOrWhiteSpace($labviewVersion)) {
          $labviewVersion = $env:LABVIEW_VERSION_YEAR
        }
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $labviewVersion -Context 'lvie-job-teardown-revert'
        if ([string]::IsNullOrWhiteSpace($labviewVersion)) {
          Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
        }
        $labviewVersion = $lvInfo.Year
        & "$repoRoot\\.github\\actions\\revert-development-mode\\RevertDevelopmentMode.ps1" `
          -LabVIEWVersion $labviewVersion `
          -SupportedBitness $bitness `
          -RepoRoot "$repoRoot"
    - name: Close LabVIEW
      if: ${{ inputs.close_labview == 'true' }}
      shell: pwsh
      run: |
        $labviewVersion = '${{ inputs.labview_version }}'
        $bitness = '${{ inputs.close_bitness }}'
        if ([string]::IsNullOrWhiteSpace($bitness)) {
          throw "close_bitness input is required when close_labview is true."
        }
        $repoRoot = '${{ inputs.repo_root }}'
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:REPO_ROOT
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:GITHUB_WORKSPACE
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "repo_root is required."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        if ([string]::IsNullOrWhiteSpace($labviewVersion)) {
          $labviewVersion = $env:LABVIEW_VERSION_YEAR
        }
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $labviewVersion -Context 'lvie-job-teardown-close'
        if ([string]::IsNullOrWhiteSpace($labviewVersion)) {
          Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
        }
        $labviewVersion = $lvInfo.Year
        & "$repoRoot\\.github\\actions\\close-labview\\Close_LabVIEW.ps1" `
          -LabVIEWVersion $labviewVersion `
          -SupportedBitness $bitness
    - name: Cleanup worktree
      if: ${{ inputs.cleanup_worktree == 'true' && always() }}
      shell: pwsh
      run: |
        $target = '${{ inputs.repo_root }}'
        if ([string]::IsNullOrWhiteSpace($target)) {
          $target = $env:REPO_ROOT
        }
        if ([string]::IsNullOrWhiteSpace($target)) {
          Write-Warning 'REPO_ROOT not set; skipping worktree cleanup.'
          exit 0
        }
        if (-not (Test-Path -Path $target)) {
          Write-Host "Worktree path not found: $target"
          exit 0
        }
        try {
          git -C "$env:GITHUB_WORKSPACE" worktree remove --force "$target" 2>$null | Out-Null
          git -C "$env:GITHUB_WORKSPACE" worktree prune 2>$null | Out-Null
          Write-Host "Removed worktree: $target"
        } catch {
          Write-Warning ("Failed to remove worktree {0}: {1}" -f $target, $_.Exception.Message)
        }
    - name: Release LabVIEW runner lock
      if: ${{ inputs.release_lock == 'true' && always() }}
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $lockScript = Join-Path $env:GITHUB_WORKSPACE 'Tooling\RunnerLock.ps1'
        if (-not (Test-Path $lockScript)) {
          Write-Warning "RunnerLock.ps1 not found at $lockScript; skipping lock release."
          exit 0
        }
        pwsh -NoProfile -File $lockScript -Mode Release

