name: "Full Build"
description: "Runs Build.ps1 to orchestrate the full build and packaging process."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Build.ps1
      shell: pwsh
      run: |
        $repoRoot = "${{ inputs.repo_root }}"
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          $repoRoot = $env:GITHUB_WORKSPACE
        }
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "repo_root is required."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -Context 'build'
        $minorInput = "${{ inputs.labview_minor_revision }}"
        if (-not [string]::IsNullOrWhiteSpace($minorInput)) {
          if ([int]$minorInput -ne [int]$lvInfo.MinorRevision) {
            throw "labview_minor_revision '$minorInput' does not match .lvversion minor '$($lvInfo.MinorRevision)'."
          }
        }
        $lvMinor = if ([string]::IsNullOrWhiteSpace($minorInput)) { $lvInfo.MinorRevision } else { [int]$minorInput }

        & "${{ github.action_path }}/Build.ps1" `
          -RepoRoot $repoRoot `
          -Major ${{ inputs.major }} `
          -Minor ${{ inputs.minor }} `
          -Patch ${{ inputs.patch }} `
          -Build ${{ inputs.build }} `
          -Commit "${{ inputs.commit }}" `
          -LabVIEWMinorRevision $lvMinor `
          -CompanyName "${{ inputs.company_name }}" `
          -AuthorName "${{ inputs.author_name }}"
inputs:
  repo_root:
    description: 'Workspace root path'
    required: true
  major:
    description: 'Major version'
    required: true
  minor:
    description: 'Minor version'
    required: true
  patch:
    description: 'Patch version'
    required: true
  build:
    description: 'Build number'
    required: true
  commit:
    description: 'Commit identifier'
    required: true
  labview_minor_revision:
    description: 'LabVIEW minor revision (0 for 21.0)'
    required: false
    default: ''
  company_name:
    description: 'Company name for metadata'
    required: true
  author_name:
    description: 'Author name for metadata'
    required: true


