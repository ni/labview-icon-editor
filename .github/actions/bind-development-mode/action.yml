name: "Bind Development Mode"
description: "Detect and bind/unbind LabVIEW development mode per bitness with status JSON."
inputs:
  repository_path:
    description: "Path to the repository root"
    required: true
    default: "${{ github.workspace }}"
  mode:
    description: "Operation mode: bind, unbind, or status"
    required: false
    default: "bind"
  bitness:
    description: "Target bitness: 32, 64, or both"
    required: false
    default: "both"
  force:
    description: "Force overwrite/removal when existing token points elsewhere"
    required: false
    default: "false"
  dry_run:
    description: "Report-only mode; perform no changes"
    required: false
    default: "false"
  json_output_path:
    description: "Optional path to write the JSON summary (defaults to reports/dev-mode-bind.json)"
    required: false
    default: ""
outputs:
  json_path:
    description: "Full path to the JSON summary file"
    value: ${{ steps.outputs.outputs.json_path }}
runs:
  using: "composite"
  steps:
    - name: Run bind/unbind/status
      id: run
      shell: pwsh
      continue-on-error: true
      run: |
        $params = @(
          '-RepositoryPath "${{ inputs.repository_path }}"',
          '-Mode "${{ inputs.mode }}"',
          '-Bitness "${{ inputs.bitness }}"'
        )
        if ('${{ inputs.force }}' -eq 'true') { $params += '-Force' }
        if ('${{ inputs.dry_run }}' -eq 'true') { $params += '-DryRun' }
        if ('${{ inputs.json_output_path }}') { $params += "-JsonOutputPath '${{ inputs.json_output_path }}'" }

        $cmd = "& '${{ github.workspace }}/scripts/bind-development-mode/BindDevelopmentMode.ps1' " + ($params -join ' ')
        Write-Host "Running: $cmd"
        Invoke-Expression $cmd

    - id: outputs
      name: Set outputs
      if: always()
      shell: pwsh
      run: |
        $path = if ('${{ inputs.json_output_path }}') { '${{ inputs.json_output_path }}' } else { Join-Path '${{ inputs.repository_path }}' 'reports/dev-mode-bind.json' }
        $full = [System.IO.Path]::GetFullPath($path)
        "json_path=$full" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
