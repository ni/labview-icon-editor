name: "Compute Version"
description: "Determines semantic version components and full version string based on branch, labels and commit count."
inputs:
  github_token:
    description: "GitHub token with repository access"
    required: true
  bump_type_override:
    description: "Optional bump override: major, minor, patch, or none."
    required: false
    default: ""
outputs:
  VERSION:
    description: "Full version string"
    value: ${{ steps.next_version.outputs.VERSION }}
  MAJOR:
    description: "Major version"
    value: ${{ steps.next_version.outputs.MAJOR }}
  MINOR:
    description: "Minor version"
    value: ${{ steps.next_version.outputs.MINOR }}
  PATCH:
    description: "Patch version"
    value: ${{ steps.next_version.outputs.PATCH }}
  BUILD:
    description: "Commit-based build number"
    value: ${{ steps.inc_build.outputs.new_build_number }}
  IS_PRERELEASE:
    description: "Whether the version is a prerelease"
    value: ${{ steps.next_version.outputs.IS_PRERELEASE }}
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine bump type
      id: bump_type
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const path = require('path');
          const {
            loadLabelContract,
            buildReleaseLabelMap,
            normalizeLabels,
          } = require(path.join(process.env.GITHUB_WORKSPACE || process.cwd(), '.github', 'scripts', 'label-metadata.js'));
          const contractPath = path.join(process.env.GITHUB_WORKSPACE || process.cwd(), '.github', 'labels', 'label-contract.json');
          const labelContract = loadLabelContract(contractPath);
          const releaseLabelMap = buildReleaseLabelMap(labelContract);
          const allowed = ['major', 'minor', 'patch'];
          const allowedWithNone = [...allowed, 'none'];
          let bump = 'none';

          const override = core.getInput('bump_type_override').trim().toLowerCase();
          if (override) {
            if (!allowedWithNone.includes(override)) {
              core.setFailed(`Invalid bump_type_override '${override}'. Allowed: ${allowedWithNone.join(', ')}`);
              return;
            }
            core.info(`Using bump_type_override: ${override}`);
            core.setOutput('bump_type', override);
            return;
          }
          if (context.eventName === 'pull_request') {
            const labels = (context.payload.pull_request.labels || []).map((l) => String(l.name || ''));
            const found = normalizeLabels(labels, releaseLabelMap);
            if (found.normalized.length > 1) {
              core.setFailed(`Conflicting release labels detected after normalization: ${found.matchedRaw.join(', ')}`);
              return;
            }
            bump = found.normalized[0] || 'patch';
          }
          core.setOutput('bump_type', bump);

    - name: Determine build number
      id: inc_build
      shell: pwsh
      run: |
        git fetch --unshallow 2>$null || Write-Host "Already a full clone."
        $count = git rev-list --count HEAD
        Write-Host "Commit-based build number => $count"
        "new_build_number=$count" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

    - name: Compute version string
      id: next_version
      shell: pwsh
      env:
        BUMP_TYPE:    ${{ steps.bump_type.outputs.bump_type }}
        BUILD_NUMBER: ${{ steps.inc_build.outputs.new_build_number }}
      run: |
        $semverPattern = '^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        $latestRaw = ''
        $tags = git tag --list --sort=-creatordate 2>$null
        foreach ($tag in $tags) {
          if ($tag -match $semverPattern) {
            $latestRaw = $tag
            break
          }
        }
        if ([string]::IsNullOrWhiteSpace($latestRaw)) {
          Write-Host "No semver tags found; defaulting to 0.0.0."
          $maj=0; $min=1; $pat=0
        }
        else {
          $latest = $latestRaw.Trim().TrimStart('v') -replace '\+.*$' -replace '-.*$'
          $parts = $latest.Split('.')
          $maj = [int]$parts[0]
          $min = if ($parts.Length -gt 1) { [int]$parts[1] } else { 0 }
          $pat = if ($parts.Length -gt 2) { [int]$parts[2] } else { 0 }
        }
        switch ($env:BUMP_TYPE) {
          'major' { $maj++; $min=0; $pat=0 }
          'minor' { $min++; $pat=0 }
          'patch' { $pat++ }
        }
        $branch = $Env:GITHUB_REF -replace '^refs/heads/',''
        $suffix = ''
        if ($branch -like 'release-alpha/*') { $suffix = "alpha.$($Env:BUILD_NUMBER)" }
        elseif ($branch -like 'release-beta/*')  { $suffix = "beta.$($Env:BUILD_NUMBER)" }
        elseif ($branch -like 'release-rc/*')    { $suffix = "rc.$($Env:BUILD_NUMBER)" }
        $version = if ($suffix) { "v$maj.$min.$pat-$suffix-build$($Env:BUILD_NUMBER)" } else { "v$maj.$min.$pat-build$($Env:BUILD_NUMBER)" }
        $isPre  = if ($suffix) { 'true' } else { 'false' }
        Write-Host "Computed version => $version"
        "VERSION=$version"      | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
        "MAJOR=$maj"            | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
        "MINOR=$min"            | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
        "PATCH=$pat"            | Out-File -FilePath $Env:GITHUB_OUTPUT -Append
        "IS_PRERELEASE=$isPre"  | Out-File -FilePath $Env:GITHUB_OUTPUT -Append


