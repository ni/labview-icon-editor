name: "Close LabVIEW"
description: "Runs Close_LabVIEW.ps1 to gracefully shut down a LabVIEW instance."
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: false

    - name: Run Close_LabVIEW.ps1
      shell: pwsh
      run: |
        $repoRoot = $env:GITHUB_WORKSPACE
        if ([string]::IsNullOrWhiteSpace($repoRoot)) {
          throw "GITHUB_WORKSPACE is required to resolve .lvversion."
        }
        $repoRoot = (Resolve-Path -Path $repoRoot -ErrorAction Stop).Path

        $lvVersionInput = "${{ inputs.labview_version }}"
        $assertScript = Join-Path $repoRoot 'Tooling\Assert-LabVIEWVersion.ps1'
        if (-not (Test-Path -Path $assertScript)) {
          throw "Assert-LabVIEWVersion.ps1 not found at $assertScript"
        }
        $lvInfo = & $assertScript -RepoRoot $repoRoot -ExpectedVersion $lvVersionInput -Context 'close-labview'
        if ([string]::IsNullOrWhiteSpace($lvVersionInput)) {
          Write-Warning "labview_version not provided; using .lvversion ($($lvInfo.Raw))."
        }
        $lvVersion = $lvInfo.Year

        & "${{ github.action_path }}/Close_LabVIEW.ps1" `
          -LabVIEWVersion $lvVersion `
          -SupportedBitness ${{ inputs.supported_bitness }} `
          -TimeoutSeconds ${{ inputs.timeout_seconds }}
inputs:
  labview_version:
    description: 'LabVIEW version to close (year or numeric).'
    required: false
  supported_bitness:
    description: '32 or 64'
    required: true
  timeout_seconds:
    description: 'How long to wait for LabVIEW to exit before failing'
    required: false
    default: 120



