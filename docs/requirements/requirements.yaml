- id: TRW-010
  section: "9.2 Versioning & Bump Logic"
  text: "The workflow shall compute next version from last reachable tag, parsed semver, and commit count as BUILD."
  type: "Functional/Performance"
  priority: "High"
  verification:
    methods:
      - "Analysis"
      - "Test"
    primary: "Analysis"
    detail: "Verify fetch-depth 0, tag resolution, commit count."
    level: "System"
  acceptance: "Version = last tag semver bumped with build = commit count since tag."
  owner: "Automation QA (Agent)"
  phase: "CI Integration"
  status: "Completed"
  trace:
    upstream: ["SRS Section 9.2 version computation"]
    downstream: [".github/actions/compute-version"]
  evidence:
    - "CI logs with last tag and commit count"
  risk: "Wrong version/tag selection"
  rationale: "Deterministic versioning"
  version: "1 | 2025-11-20"

- id: TRW-011
  section: "9.2 Versioning & Bump Logic"
